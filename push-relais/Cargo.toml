[package]
name = "push-relais"
version = "0.1.0"
edition = "2021"
# Eigener Dienst, den Ruben betreibt: hält den Apple-.p8-Schlüssel und leitet Pushes der
# Lifeline-Server an APNs weiter. Kein Teil der ausgelieferten Anwendung.
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "push-relais"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
subtle = "2"
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
# Wie im Hauptpaket: ES256 für das Anbieter-Token (`src/web_push/krypto.rs`, `vapid_kopf`).
openssl = { version = "0.10", features = ["vendored"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
