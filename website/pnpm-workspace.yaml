# Eigenständiges Paket (LFH-1111): diese Datei hält pnpm davon ab, eine Wurzel weiter oben zu
# suchen. esbuild braucht sein Installationsskript; sharp bleibt aus, weil die Seite keine
# Bilder verarbeitet.
allowBuilds:
  esbuild: true
  sharp: false

# Karenzzeit für frisch veröffentlichte Pakete (LLH-1884): 1440 Minuten = 24 Stunden.
# Ausdrücklich gesetzt, damit Gate und Cloudflare dieselbe Zahl lesen und ein pnpm-Update die
# Vorgabe nicht still verschiebt. Geprüft wird sie an jedem PR (scripts/check-karenzzeit.sh,
# Schritt 6). Nicht senken, um einen roten Lauf grün zu bekommen: der Lauf wird neu gestartet,
# sobald das Paket alt genug ist.
minimumReleaseAge: 1440
