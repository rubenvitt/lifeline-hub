# Release — ermittelt die Version, bumpt, taggt, legt das Release an.
#
# WIRD AUFGERUFEN, LÄUFT NICHT SELBST LOS: ci.yml ruft ihn nach grünem Gate und nur bei einem
# Push. `workflow_call` statt `workflow_run`, weil semantic-release den Branch über env-ci aus
# `GITHUB_REF` liest — ein `workflow_run`-Lauf trägt dort immer den Default-Branch, und ein
# Push auf `beta` released sonst still als stabile Version. `workflow_call` erbt den
# auslösenden Ereigniskontext.
#
# NICHT JEDER AUFRUF FÜHRT ZU EINEM RELEASE: der Schritt „Ruhefenster" kann den Lauf
# zurücktreten lassen (Regel im Kopf von `scripts/release-ruhefenster.sh`, dort testbar).
name: Release

on:
  workflow_call:
    secrets:
      # Bewusst NICHT `required: true`: ohne eingerichtete App bräche sonst der Aufruf. Der Job
      # prüft unten selbst und überspringt mit klarer Ansage.
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
      # Die Release-Notizen schreibt Claude (`scripts/release/ki-notizen.mjs`). Optional: ohne
      # Schlüssel entstehen die konventionellen Notizen, mit Warnung, ohne roten Lauf.
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Hängt am Ruhefenster: dessen Deckel steht bei 30 Minuten, die Release-Arbeit braucht rund
    # zehn. Ein kürzerer Timeout schnitte einen wartenden Lauf womöglich MITTEN im Release ab.
    # Wer den Deckel hebt, hebt diese Zahl mit.
    timeout-minutes: 45
    steps:
      # Solange die App fehlt, ist „nichts tun" das richtige Verhalten — nicht „scheitern".
      - name: Ist die Release-App eingerichtet?
        id: bereit
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID:-}" ]; then
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release übersprungen — das Secret RELEASE_APP_ID ist nicht gesetzt."
            echo "::notice::Einrichtung siehe ClickUp LFH-527 (GitHub App anlegen, Secrets hinterlegen)."
          else
            echo "bereit=true" >> "$GITHUB_OUTPUT"
          fi

      # Der Token kommt aus einer GitHub App: mit GITHUB_TOKEN erzeugte Pushes lösen KEINE
      # weiteren Workflows aus (das `release: published`-Ereignis für die Artefakte käme nie
      # an), und ein PAT läuft ab und hängt an einer Person.
      #
      # Die App braucht `Contents: Read & Write` (Versions-Commit und Tag), `Issues: Read &
      # Write` (Kommentar an den enthaltenen PRs) und `Pull requests: Read`. Das
      # `permissions:` oben gilt nur für GITHUB_TOKEN. Bewusst nicht per `permission-*`
      # eingeengt: fehlte der App eine angeforderte Berechtigung, bräche der ganze Release
      # statt nur des Kommentars (Fehlermodus bei SUCCESS_COMMENT_TEMPLATE in release.config.mjs).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: steps.bereit.outputs.bereit == 'true'
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.bereit.outputs.bereit == 'true'
        with:
          # Die komplette Historie: semantic-release liest alle Commits seit dem letzten Tag.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # VOR JEDER TEUREN UND SCHREIBENDEN HANDLUNG — alles unten hängt an seinem Ergebnis.
      # Das Skript holt den Kanal mit den Zugangsdaten des Checkouts (`persist-credentials`);
      # ohne sie hielte es einen überholten Lauf für aktuell.
      - name: Ruhefenster
        id: fenster
        if: steps.bereit.outputs.bereit == 'true'
        run: ./scripts/release-ruhefenster.sh --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"

      - name: Rust-Toolchain (stable)
        if: steps.fenster.outputs.freigabe == 'true'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      # cargo-set-version bumpt Cargo.toml UND Cargo.lock (prepareCmd in release.config.mjs);
      # ohne Lock-Bump bräche der nächste --frozen-lockfile-Lauf.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: edit-cache
        if: steps.fenster.outputs.freigabe == 'true'
        with:
          path: ~/.cargo/bin/cargo-set-version
          key: cargo-edit-0.13.7-${{ runner.os }}
      - name: cargo-edit
        if: steps.fenster.outputs.freigabe == 'true' && steps.edit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-edit --locked --version 0.13.7 --no-default-features --features set-version

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        if: steps.fenster.outputs.freigabe == 'true'
        with:
          version: 2026.9.1
          cache: true

      - name: Release-Werkzeug installieren
        if: steps.fenster.outputs.freigabe == 'true'
        run: mise exec -- pnpm install --frozen-lockfile

      - name: semantic-release
        if: steps.fenster.outputs.freigabe == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: lifeline-hub-release
          GIT_AUTHOR_EMAIL: noreply@github.com
          GIT_COMMITTER_NAME: lifeline-hub-release
          GIT_COMMITTER_EMAIL: noreply@github.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Unter `mise exec`, weil der prepareCmd `pnpm` auf dem PATH braucht.
        run: mise exec -- pnpm exec semantic-release
