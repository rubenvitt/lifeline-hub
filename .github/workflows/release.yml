# Release — ermittelt die Version, bumpt, taggt, legt das Release als ENTWURF an und startet
# `artefakte.yml`, das ihn nach grünem Bau aller Plattformen veröffentlicht (LFH-1054).
#
# WIRD AUFGERUFEN, LÄUFT NICHT SELBST LOS: ci.yml ruft ihn nach grünem Gate und nur bei einem
# Push. `workflow_call` statt `workflow_run`, weil semantic-release den Branch über env-ci aus
# `GITHUB_REF` liest — ein `workflow_run`-Lauf trägt dort immer den Default-Branch, und ein
# Push auf `beta` released sonst still als stabile Version. `workflow_call` erbt den
# auslösenden Ereigniskontext.
#
# NICHT JEDER AUFRUF FÜHRT ZU EINEM RELEASE: der Schritt „Ruhefenster" kann den Lauf
# zurücktreten lassen (Regel im Kopf von `scripts/release-ruhefenster.sh`, dort testbar).
name: Release

on:
  workflow_call:
    secrets:
      # Bewusst NICHT `required: true`: ohne eingerichtete App bräche sonst der Aufruf. Der Job
      # prüft unten selbst und überspringt mit klarer Ansage.
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
      # Kein ANTHROPIC_API_KEY mehr: Claude meldet sich per Workload Identity Federation an
      # (Schritt „Claude-Anmeldung" unten).

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # `actions: write` nur für den Start von artefakte.yml (letzter Schritt), `id-token: write`
    # nur für das OIDC-Token der Claude-Anmeldung. Der Aufrufer in ci.yml muss beides ebenfalls
    # gewähren, sonst kappt GitHub es still.
    permissions:
      contents: read
      actions: write
      id-token: write
    # Hängt am Ruhefenster: dessen Deckel steht bei 30 Minuten, die Release-Arbeit braucht rund
    # zehn. Ein kürzerer Timeout schnitte einen wartenden Lauf womöglich MITTEN im Release ab.
    # Wer den Deckel hebt, hebt diese Zahl mit.
    timeout-minutes: 45
    steps:
      # Solange die App fehlt, ist „nichts tun" das richtige Verhalten — nicht „scheitern".
      - name: Ist die Release-App eingerichtet?
        id: bereit
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID:-}" ]; then
            echo "bereit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release übersprungen — das Secret RELEASE_APP_ID ist nicht gesetzt."
            echo "::notice::Einrichtung siehe LFH-527 (GitHub App anlegen, Secrets hinterlegen): https://zunder.rubeen.dev/#/clickup/123zgec1t79"
          else
            echo "bereit=true" >> "$GITHUB_OUTPUT"
          fi

      # Der Token für Versions-Commit, Tag und Entwurf kommt aus einer GitHub App: ein PAT läuft
      # ab und hängt an einer Person.
      #
      # Die App braucht `Contents: Read & Write` (Versions-Commit, Tag, Entwurf). Die Kommentare
      # an den enthaltenen PRs schreibt seit LFH-1054 nicht mehr semantic-release, sondern der
      # Job `freigeben` in artefakte.yml mit GITHUB_TOKEN; dafür braucht die App `Issues` und
      # `Pull requests` nicht mehr. Das `permissions:` oben gilt nur für GITHUB_TOKEN. Bewusst
      # nicht per `permission-*` eingeengt: fehlte der App eine angeforderte Berechtigung, bräche
      # der ganze Release.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: steps.bereit.outputs.bereit == 'true'
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.bereit.outputs.bereit == 'true'
        with:
          # Die komplette Historie: semantic-release liest alle Commits seit dem letzten Tag.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # VOR JEDER TEUREN UND SCHREIBENDEN HANDLUNG — alles unten hängt an seinem Ergebnis.
      # Das Skript holt den Kanal mit den Zugangsdaten des Checkouts (`persist-credentials`);
      # ohne sie hielte es einen überholten Lauf für aktuell.
      - name: Ruhefenster
        id: fenster
        if: steps.bereit.outputs.bereit == 'true'
        run: ./scripts/release-ruhefenster.sh --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"

      - name: Rust-Toolchain (stable)
        if: steps.fenster.outputs.freigabe == 'true'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      # cargo-set-version bumpt Cargo.toml UND Cargo.lock (prepareCmd in release.config.mjs);
      # ohne Lock-Bump bräche der nächste --frozen-lockfile-Lauf.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: edit-cache
        if: steps.fenster.outputs.freigabe == 'true'
        with:
          path: ~/.cargo/bin/cargo-set-version
          key: cargo-edit-0.13.7-${{ runner.os }}
      - name: cargo-edit
        if: steps.fenster.outputs.freigabe == 'true' && steps.edit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-edit --locked --version 0.13.7 --no-default-features --features set-version

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        if: steps.fenster.outputs.freigabe == 'true'
        with:
          version: 2026.9.1
          cache: true

      - name: Release-Werkzeug installieren
        if: steps.fenster.outputs.freigabe == 'true'
        run: mise exec -- pnpm install --frozen-lockfile

      # DIE RELEASE-NOTIZEN SCHREIBT CLAUDE, angemeldet per Workload Identity Federation statt
      # mit festem Schlüssel: GitHub stellt ein OIDC-Token aus, die Claude-CLI im Agent SDK
      # tauscht es gegen ein kurzlebiges Anthropic-Token. Die Regel in der Claude Console lässt
      # nur Pushes auf main/beta/alpha dieses Repos zu (Audience `https://api.anthropic.com`).
      #
      # DIREKT VOR semantic-release, nicht früher: das GitHub-Token lebt rund fünf Minuten, das
      # Ruhefenster bis zu 30. Getauscht wird beim ersten Modellaufruf in `generateNotes`, und
      # das nur EINMAL je Release (der zweite Aufruf kommt aus dem Merker in ki-notizen.mjs) —
      # das Token ist einmalig einlösbar (JTI-Schutz am Aussteller).
      #
      # SCHEITERT DIESER SCHRITT, scheitert nicht der Release: ohne die Variablen schreibt
      # ki-notizen.mjs die konventionellen Notizen, mit Warnung. Die IDs sind nicht geheim und
      # liegen als Repo-Variablen (`vars.*`), nicht als Secrets.
      #
      # Netz mit Frist (LFH-1101): je Versuch 20 s, zwei Wiederholungen; dazu eine harte
      # Schrittgrenze und `continue-on-error` — auch ein Hänger kostet nur die KI-Notizen.
      - name: Claude-Anmeldung (GitHub-OIDC)
        if: steps.fenster.outputs.freigabe == 'true'
        timeout-minutes: 3
        continue-on-error: true
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FEDERATION_RULE_ID" ] || [ -z "$ORGANIZATION_ID" ] || [ -z "$SERVICE_ACCOUNT_ID" ]; then
            echo "::warning::Claude-Anmeldung übersprungen — Repo-Variablen ANTHROPIC_FEDERATION_RULE_ID/_ORGANIZATION_ID/_SERVICE_ACCOUNT_ID fehlen. Es gelten die konventionellen Release-Notizen."
            exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::Claude-Anmeldung übersprungen — kein OIDC-Endpunkt (fehlt \`id-token: write\` beim Aufrufer in ci.yml?). Es gelten die konventionellen Release-Notizen."
            exit 0
          fi
          jwt="$RUNNER_TEMP/claude-oidc.jwt"
          if ! curl -fsS --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -er .value > "$jwt"; then
            echo "::warning::Claude-Anmeldung übersprungen — GitHub hat kein OIDC-Token ausgestellt. Es gelten die konventionellen Release-Notizen."
            rm -f "$jwt"
            exit 0
          fi
          {
            echo "ANTHROPIC_FEDERATION_RULE_ID=$FEDERATION_RULE_ID"
            echo "ANTHROPIC_ORGANIZATION_ID=$ORGANIZATION_ID"
            echo "ANTHROPIC_SERVICE_ACCOUNT_ID=$SERVICE_ACCOUNT_ID"
            echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$jwt"
            # Nur nötig, wenn die Regel mehrere Workspaces abdeckt.
            if [ -n "$WORKSPACE_ID" ]; then echo "ANTHROPIC_WORKSPACE_ID=$WORKSPACE_ID"; fi
          } >> "$GITHUB_ENV"

      - name: semantic-release
        id: semrel
        if: steps.fenster.outputs.freigabe == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: lifeline-hub-release
          GIT_AUTHOR_EMAIL: noreply@github.com
          GIT_COMMITTER_NAME: lifeline-hub-release
          GIT_COMMITTER_EMAIL: noreply@github.com
        # Unter `mise exec`, weil der prepareCmd `pnpm` auf dem PATH braucht.
        run: mise exec -- pnpm exec semantic-release

      # EIN ENTWURF LÖST KEIN `release`-EREIGNIS AUS — die Artefakte startet deshalb dieser
      # Schritt. Das Tag schreibt der `successCmd` von @semantic-release/exec (release.config.mjs);
      # fehlt es, gab es nichts zu releasen. Mit GITHUB_TOKEN: `workflow_dispatch` ist die
      # dokumentierte Ausnahme, die auch mit ihm einen Lauf startet; das App-Token bräuchte ein
      # weiteres Recht. `--ref` ist das Tag: der Workflow läuft im Stand des Releases.
      #
      # SCHEITERT DIESER SCHRITT, liegt ein Entwurf ohne Bau da. Abhilfe: artefakte.yml von Hand
      # mit dem Tag und `freigeben` starten (docs/betrieb/desktop-app.md, „Release-Ablauf“).
      - name: Artefakte starten
        if: steps.semrel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.semrel.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run artefakte.yml --ref "$TAG" -f tag="$TAG" -f freigeben=true
          echo "::notice::Release $TAG als Entwurf angelegt; artefakte.yml veröffentlicht ihn nach grünem Bau."
