# Android-Prüfung (LLH-1989, Entwurf D10): an einem PR, der die Android-Hülle, ihre Skripte oder
# die gemeinsamen Fälle der Hüllen ändert, und nach jedem solchen Push auf `alpha`: auf
# `ubuntu-latest` die App-Tests unter Robolectric fahren, die Release-APK ohne Signatur bauen, den
# Kotlin-Kern testen und die Bildschirmbilder jeder nativen Seite als Artefakt `android-bilder`
# ablegen (Bilder der Änderung für den PR). Ohne grünen Lauf ist App-Code nicht fertig.
#
# KEIN PFLICHT-CHECK: Pflicht sind nur die Checks in `scripts/ruleset-pruefen.sh` (ADR-0048). Ein
# PR ohne solche Änderungen startet keinen Lauf (Pfadfilter). Der Kern läuft zusätzlich in
# `suiten.yml` (Job `android`).
#
# EIN WORKFLOW JE EREIGNIS (ADR-0048): hier nur `pull_request` und der Aufruf; den Push auf `alpha`
# fängt `android-pruefung-alpha.yml` und ruft diesen Workflow mit denselben Jobs, ohne `if`. Dort
# belegt der Lauf den Stand nach dem Merge, den `android.yml` beim nächsten Release signiert.
#
# Versionen: JDK, SDK-Plattform und Build-Tools aus `scripts/android/sdk-version.sh`; das SDK
# bringt der Runner mit, fehlende Pakete lädt `scripts/android/sdk-installieren.sh`. Signiert wird
# hier nie, die Geheimnisse bekommt nur `android.yml`.
#
# Alle Actions sind per Commit-SHA gepinnt (Tag im Kommentar), wie in pr.yml.
name: Android-Prüfung

on:
  pull_request:
    paths:
      - "android/**"
      - "src-tauri/faelle/**"
      - "scripts/android/**"
      - ".github/workflows/android-pruefung.yml"
  workflow_call:

# Least privilege: der Lauf liest nur und legt Artefakte ab.
permissions:
  contents: read

env:
  # Der Kotlin-Compiler legt Klassen mit Umlauten im Namen an (Testnamen als Satz); unter der
  # Locale C scheitert das.
  LC_ALL: C.UTF-8

jobs:
  app:
    name: Android-App
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Ein neuer Push auf den PR (oder auf `alpha`) ersetzt den laufenden Lauf; der jüngste Stand
    # deckt die früheren ab. Auf Job-Ebene, weil der Workflow auch aufgerufen wird; `github.ref`
    # ist dann die des Aufrufers.
    concurrency:
      group: android-pruefung-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK (vorinstalliert, Version aus sdk-version.sh)
        run: ./scripts/android/jdk-waehlen.sh
      - name: Android-SDK ergänzen
        run: ./scripts/android/sdk-installieren.sh
      # Abhängigkeiten aus dem Cache statt jedes Mal aus dem Netz (knapp 1 GB). Ohne Cache lud
      # jeder Lauf den ganzen Baum neu, und Maven Central drosselt die geteilten Runner-Adressen:
      # am 23.11.2026 scheiterten drei Läufe auf zwei PRs binnen fünf Minuten an „429 Too Many
      # Requests“ für `nativeruntime-dist-compat-1.0.20.jar` (Robolectric). Seitdem lädt der Build
      # über Googles Spiegel (Kopf von android/kern/settings.gradle.kts); der Cache spart auch
      # dort. Mit dabei: Gradle-Wrapper und die `android-all`-Jars, die Robolectric zur Laufzeit
      # selbst nach `~/.m2` lädt. Ohne die Sperrdateien des Gradle-Caches.
      #
      # Laden und Speichern getrennt (`restore`/`save`, wie in e2e.yml): gespeichert wird gleich
      # nach dem App-Bau, auch wenn danach der Kern rot wird. Nur wenn der App-Bau grün war, denn
      # dann ist alles geladen; ein Eintrag mit Lücke bliebe unter seinem Schlüssel stehen. Der
      # Schlüssel hängt an Versionskatalog, Build-Skripten und Wrapper; ein älterer Eintrag hilft
      # über `restore-keys`, Gradle lädt nur, was fehlt. Läufe auf `alpha` (android-pruefung-alpha.yml)
      # legen Einträge an, die jeder PR lesen darf.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: abhaengigkeiten
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            ~/.gradle/wrapper/dists
            ~/.m2/repository/org/robolectric
          key: android-abh-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-abh-${{ runner.os }}-
      - name: App-Tests und Release-APK (ohne Signatur)
        id: app
        run: ./android/gradlew -p android :app:testDebugUnitTest :app:assembleRelease --console=plain
      # Nur ohne exakten Treffer: ein bestehender Schlüssel lässt sich nicht überschreiben.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.app.outcome == 'success' && steps.abhaengigkeiten.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
            ~/.gradle/wrapper/dists
            ~/.m2/repository/org/robolectric
          key: ${{ steps.abhaengigkeiten.outputs.cache-primary-key }}
      - name: Kotlin-Kern
        run: ./android/gradlew -p android/kern test --console=plain
      - name: Kotlin-Kern der Helfer-App
        run: ./android/gradlew -p android/helferkern test --console=plain
      - name: Bildschirmbilder
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bilder
          path: android/app/build/bilder/
          if-no-files-found: warn
          retention-days: 14
      # Zur Diagnose nur bei Rot.
      - name: Testberichte
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-testberichte
          path: |
            android/app/build/reports/tests/
            android/kern/build/reports/tests/
            android/helferkern/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
