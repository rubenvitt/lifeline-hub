# Suiten (LLH-1896): Rust-, Frontend- und e2e-Suite samt Bericht, dazu der Swift-Kern der iOS-Hülle
# (LLH-1978) und der Kotlin-Kern der Android-Hülle (LLH-1989), als wiederverwendbarer Workflow.
#
# WIRD AUFGERUFEN, LÄUFT NICHT SELBST LOS: `ci.yml` ruft ihn bei jedem Push auf einen Kanal-Branch
# (der Release wartet darauf), `pr.yml` nur an einem PR mit dem Label `voll` (ohne Pflicht).
# Welche Suiten wann laufen, entscheidet der Aufrufer; hier steht kein `if` nach Ereignis oder
# Label. Regeln: `scripts/AGENTS.md`, „Leichte PR-Prüfung“; Form: `scripts/ci-stufen.test.sh`.
#
# Die Jobs heißen am Commit `<Aufrufer> / <Job>` (etwa `Suiten / Rust-Suite`). Ein Pflicht-Check
# darf deshalb nicht hier stehen: die Schnellprüfungen stehen in `ci.yml` und `pr.yml` selbst.
#
# ZU ENDE AUF KANAL-BRANCHES (LLH-2035, ADR-0091; vorher Abbruch nach LLH-1889): Concurrency AUF
# JOB-EBENE (`rust`, `frontend` je Anteil, `e2e`, `ios`, `android`, `berichte`) ohne Abbruch. Ein
# gestarteter Job läuft zu Ende; je Gruppe wartet höchstens ein Lauf, und ein neuer Push ersetzt
# nur diesen wartenden. Sonst käme die ~68-min-Rust-Suite bei mehreren Merges pro Stunde nie durch. Im
# aufgerufenen Workflow ist `github.event_name` der des Aufrufers: bei Push eine Gruppe je Branch,
# im PR je Lauf (dort bricht der PR-Workflow als Ganzes ab). Der Release in `ci.yml` hat eine
# eigene Gruppe, bricht nie ab und tritt bei einem neueren Commit zurück (Ruhefenster).
#
# NUR GITHUB (ADR-0078): Alle Jobs laufen auf `ubuntu-latest`. Der eigene Server für Rust und e2e
# (LLH-1666, LLH-2014, ADR-0075/0076) ist zurückgebaut.
#
# Geteilt, weil die drei schweren Suiten (Rust, Vitest, Playwright) nicht voneinander abhängen;
# der kritische Pfad ist die Rust-Suite allein. Sie bleibt EIN Job, weil Compile nur einen
# kleinen Teil ihrer Laufzeit ausmacht und jeder Shard ihn erneut zahlte. Vitest teilt nach
# Dateizahl.
#
# Alle Actions sind per Commit-SHA gepinnt (Tag im Kommentar), wie in ci.yml.
name: Suiten

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Die Debuginfo-Stufe (Zeilentabellen, keine für Abhängigkeiten) steht in Cargo.toml,
  # [profile.dev] (LFH-845), und gilt lokal wie hier.
  # Parallelität nach den Kernen des Runners (LLH-1664; der Schritt „Runner-Größe“ in den
  # Suiten nennt Kerne und Speicher). Vitest 2 Dateien zugleich statt einer (lokale Vorgabe in
  # check-all.sh bleibt 1). Die Playwright-Worker stehen in `e2e.yml`. Messwerte vorher/nachher an
  # der Aufgabe LLH-1664.
  VITEST_WORKERS: 2
  # Der Runner läuft in UTC. check-all.sh setzt die Zone selbst; hier steht sie für alles
  # außerhalb des Skripts.
  TZ: Europe/Berlin

jobs:
  # ── Rust-Suite ──────────────────────────────────────────────────────────────────────
  # Bewusst NICHT partitioniert (Compile würde je Shard erneut bezahlt). Er pflegt den geteilten
  # Cargo-Cache (save-if: true, die Vorgabe).
  rust:
    name: Rust-Suite
    # Auf einem Kanal-Branch läuft dieser Job zu Ende, ein neuer Push wartet (s. Kopf); im PR je Lauf.
    concurrency:
      group: ci-rust-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nur bei Bedarf aufräumen (s. Schnellprüfungen).
      - name: Plattenplatz schaffen (nur bei Bedarf)
        run: |
          df -h /
          frei_gb="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          if [ "$frei_gb" -ge 40 ]; then
            echo "Genug Platz (${frei_gb} GB frei) — kein Aufräumen nötig."
            exit 0
          fi
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      # Die GTK-/WebKit-Pakete braucht die Desktop-Hülle (src-tauri, LFH-721): Schritt 4 testet
      # sie mit (`cargo test -p lifeline-desktop`). Umgebung wie nasm, kein Schritt neben check-all.sh.
      - name: System-Werkzeuge für die nativen Crates
        # Die WebKit-Pakete sind groß: bei tröpfelndem Spiegel reichen 300 s je Versuch nicht
        # (LLH-1420). Was ein abgebrochener Versuch schon geladen hat, bleibt im apt-Cache liegen.
        env:
          APT_FRIST_SEK: "600"
        run: >-
          ./scripts/apt-pakete.sh nasm
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          librsvg2-dev libayatana-appindicator3-dev
      - name: Rust-Toolchain (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-openssl-vendored
          cache-on-failure: true
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.9.1
          cache: true
      - name: Rust-Suite
        run: ./scripts/check-all.sh --nur rust

  # ── Frontend-Suite, auf vier Runner geteilt ─────────────────────────────────────────
  frontend:
    name: Frontend-Suite ${{ matrix.shard }}/4
    # Je Anteil eine Gruppe, sonst liefen die vier Anteile nacheinander.
    concurrency:
      group: ci-frontend-${{ matrix.shard }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Ohne fail-fast: ein roter Shard darf den anderen drei nicht die Diagnose nehmen.
      fail-fast: false
      # Die Shard-Zahl steht auch im Bericht (vier Blobs, Job `berichte`).
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Kein Rust, kein Chromium, kein Plattenplatz-Schritt — dieser Job braucht nur Node.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.9.1
          cache: true
      - name: pnpm-Store-Pfad ermitteln
        id: pnpm
        run: echo "store=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Frontend-Abhängigkeiten
        run: mise exec -- pnpm -C frontend install --frozen-lockfile
      - name: Runner-Größe
        run: echo "Kerne $(nproc), Speicher $(free -h | awk '/^Mem:/ {print $2}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Frontend-Suite (Anteil ${{ matrix.shard }}/4)
        env:
          VITEST_SHARD: ${{ matrix.shard }}/4
        run: ./scripts/check-all.sh --nur frontend
      # Vitest legt die Blobs unter frontend/.vitest/blob/ ab. include-hidden-files ist
      # Pflicht, weil das Verzeichnis mit einem Punkt beginnt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest/blob/*
          include-hidden-files: true
          retention-days: 1

  # ── e2e-Suite ───────────────────────────────────────────────────────────────────────
  # Jobs in `e2e.yml`.
  e2e:
    name: e2e
    concurrency:
      group: ci-e2e-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: false
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      checks: read

  # ── Swift-Kern der iOS-Hülle (LLH-1978) ────────────────────────────────────────────
  # `swift test` in ios/LifelineKern und ios/HelferKern über Schritt 18 von check-all.sh, unter
  # Linux. Das App-Target
  # baut nur `ios-pruefung.yml` auf einem macOS-Runner. IOS_SWIFT_PFLICHT=1 macht eine fehlende
  # Toolchain rot statt zur Lücke. Swift in derselben Version wie lokal (Werkzeugversion 6.1 in
  # ios/LifelineKern/Package.swift), aus dem offiziellen Image `swift` per Digest gepinnt. Keine
  # Fremd-Action: die Freigabeliste der Actions ließ `swift-actions/setup-swift` nicht zu, und dann
  # startet der ganze aufrufende Workflow nicht (startup_failure an PR #1483).
  ios:
    name: iOS-Kern
    concurrency:
      group: ci-ios-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # swift:6.1.2-noble
      image: swift@sha256:9096456b6dd5f3dcb1f64152601de3d96f40e48ac98354fefa9ffa9abf2dd6bf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift-Kern
        env:
          IOS_SWIFT_PFLICHT: "1"
        run: ./scripts/check-all.sh --nur ios

  # ── Kotlin-Kern der Android-Hülle (LLH-1989) ───────────────────────────────────────
  # `gradlew -p android/kern test` über Schritt 20 von check-all.sh, nur JDK, kein Android-SDK. Die
  # App baut und testet nur `android-pruefung.yml`. ANDROID_KERN_PFLICHT=1 macht ein fehlendes
  # JDK rot statt zur Lücke. Das vorinstallierte JDK der Version aus scripts/android/sdk-version.sh
  # (jdk-waehlen.sh, keine Action), wie beim App-Bau.
  android:
    name: Android-Kern
    concurrency:
      group: ci-android-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JDK (vorinstalliert, Version aus sdk-version.sh)
        run: ./scripts/android/jdk-waehlen.sh
      - name: Kotlin-Kern
        env:
          ANDROID_KERN_PFLICHT: "1"
        run: ./scripts/check-all.sh --nur android

  # ── Ein Bericht aus den Vitest-Teilläufen ───────────────────────────────────────────
  # Die Merge-Werkzeuge scheitern nur bei NULL Blobs, ein gestorbener Shard ergäbe sonst einen
  # grünen Teilbericht. Mit `!cancelled()`, weil man den Bericht gerade bei Rot braucht. Den
  # e2e-Bericht baut `e2e.yml`.
  berichte:
    name: Testberichte zusammenführen
    needs: frontend
    if: ${{ !cancelled() }}
    # Der Release in `ci.yml` wartet auf den ganzen Aufruf dieses Workflows, also auch auf diesen
    # Job. Ein gescheiterter Bericht darf ihn nicht verhindern: der Job zählt nie als rot (LLH-1896).
    continue-on-error: true
    concurrency:
      group: ci-berichte-${{ github.event_name == 'push' && github.ref || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.9.1
          cache: true
      - name: Frontend-Abhängigkeiten
        run: mise exec -- pnpm -C frontend install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: frontend/.vitest/blob
          pattern: vitest-blob-*
          merge-multiple: true
      # Der Riegel gegen den stillen Teilbericht: fehlt ein Blob, wäre die Zusammenfassung
      # eine Aussage über weniger Tests, als jemand beim Lesen annimmt. Ohne Blobs legt
      # download-artifact das Verzeichnis nicht an (LLH-1205) — deshalb die Prüfung mit `-d`.
      - name: Vollzähligkeit der Teilberichte
        run: |
          set -euo pipefail
          v=0
          if [ -d frontend/.vitest/blob ]; then
            v="$(find frontend/.vitest/blob -name 'blob-*.json' | wc -l | tr -d ' ')"
          fi
          echo "Vitest-Blobs: $v von 4"
          [ "$v" -eq 4 ] || {
            echo "WARNUNG: nicht alle Shards haben einen Bericht hinterlassen." >&2
            echo "         Der zusammengeführte Bericht deckt dann WENIGER ab als die Suite." >&2
          }
      - name: Frontend-Bericht
        run: mise exec -- pnpm -C frontend exec vitest run --merge-reports --reporter=default
        continue-on-error: true
