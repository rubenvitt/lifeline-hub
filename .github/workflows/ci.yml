# CI (LFH-522/LFH-525) — Gate, Coverage und der angehängte Release-Aufruf.
#
# Der Job fährt `scripts/check-all.sh` UNVERÄNDERT. Das ist die tragende Entscheidung dieser
# Datei: das Sammel-Gate (LFH-235/F17) ist die eine Wahrheit darüber, was geprüft wird, und
# eine CI, die ihre Schritte selbst zusammenstellt, driftet unweigerlich vom lokalen Lauf ab.
# Wer hier einen Schritt vermisst, ändert das Skript — nicht diesen Workflow.
#
# Alle Actions sind per Commit-SHA gepinnt (Tag im Kommentar). Ein Tag ist verschiebbar; ein
# kompromittierter Upstream-Tag liefe sonst mit den Rechten dieses Workflows. Dependabot
# (.github/dependabot.yml) hält die Pins aktuell.
name: CI

on:
  pull_request:
  push:
    # beta/alpha existieren heute nicht (frühe Alpha, ein Kanal). Die Einträge stehen hier,
    # damit die Kanäle beim Anlegen sofort geprüft werden.
    branches: [main, beta, alpha]

# Least privilege: der Gate-Job liest nur. Schreibrechte hat ausschließlich der
# Release-Workflow, und der bezieht sie aus einer GitHub App, nicht aus GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # NUR Pull-Request-Läufe abbrechen. Auf einem Kanal-Branch hängt am selben Lauf der
  # Release-Job — ein Abbruch träfe ihn möglicherweise ZWISCHEN dem Push des Versions-Commits
  # und dem Anlegen des GitHub-Releases. Das Ergebnis wäre ein Tag ohne Release, und weil die
  # Artefakte an `release: published` hängen, entstünden sie nie: kein roter Lauf, nur ein
  # fehlendes Release. Ein zweiter Push auf main wartet deshalb, statt den ersten zu killen.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Der Runner hat 2 vCPU; die lokale Vorgabe von 3 Playwright-Workern überzeichnet ihn und
  # ist die wahrscheinlichste Flake-Quelle (Memory: Suite unter Last flaky). Die Config sieht
  # diese Schraube ausdrücklich vor (`PW_WORKERS`), deshalb hier statt einer Config-Änderung.
  PW_WORKERS: 2
  # Volle Debug-Symbole (`debuginfo=2`, Cargos Vorgabe im dev-Profil) sind der zweite große
  # Platzfresser neben den vorinstallierten Toolchains — bei diesem Abhängigkeitsbaum
  # mehrere GB. `line-tables-only` behält Datei und Zeile im Backtrace, wirft nur die
  # Variablen-Debuginfo weg, die im CI ohnehin niemand liest. Ändert keine Testsemantik;
  # lokal bleibt die Vorgabe unangetastet. Für den Coverage-Job ist es zusätzlich Pflicht:
  # llvm-cov braucht Zeileninfo, mehr nicht.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Der Runner läuft in UTC, die Zielumgebung dieses Systems nicht. scripts/check-all.sh setzt
  # die Zone selbst (Begründung dort); der Coverage-Job fährt das Skript aber nicht und braucht
  # sie deshalb hier. Ohne sie wird jeder Test rot, der eine Ortszeit-Umrechnung festschreibt.
  TZ: Europe/Berlin

jobs:
  gate:
    name: check-all.sh
    runs-on: ubuntu-latest
    # 120 statt 60 — gemessen, nicht großzügig geschätzt: ein KALTER Lauf braucht auf zwei
    # vCPU über eine Stunde allein für „Alle Gates" (Rust-Build über 442 Crates inklusive
    # OpenSSL aus Quelle, dann Rust-Suite, 3768 Vitest-Tests und 143 Playwright-Tests). Der
    # erste Anlauf lief exakt in die 60-Minuten-Grenze. Mit warmem Cargo-Cache liegt der Lauf
    # deutlich darunter; die Grenze ist die Reißleine für einen hängenden Lauf, nicht das
    # erwartete Maß.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PLATTENPLATZ — GEMESSEN NÖTIG, NICHT VORSORGLICH (erster CI-Lauf, PR #26).
      # Beide Jobs starben mitten im Build an „No space left on device"; der Runner konnte
      # zuletzt nicht einmal mehr sein eigenes Log schreiben. Ein ubuntu-latest-Runner hat
      # rund 14 GB frei, und dieses Projekt braucht mehr: Debug-Build des ganzen Workspace
      # samt Integrationstests, dazu OpenSSL aus Quelle (seit LFH-522), aws-lc-sys,
      # gebündeltes SQLite, node_modules und ein Chromium.
      # Die drei Verzeichnisse unten sind vorinstallierte Toolchains, die dieses Projekt
      # nirgends anfasst; allein das Android-SDK trägt zweistellige GB. `df` steht davor und
      # danach, damit beim nächsten Engpass nicht wieder geraten werden muss.
      - name: Plattenplatz schaffen
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      # nasm baut aws-lc-sys (rustls), perl+cc bauen das seit LFH-522 eingebackene OpenSSL.
      # cmake und perl bringt ubuntu-latest mit; nasm nicht.
      - name: System-Werkzeuge für die nativen Crates
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nasm

      - name: Rust-Toolchain (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Der Cache-Schlüssel muss das eingebackene OpenSSL kennen: ohne diesen Zusatz
          # teilte ein Lauf VOR und NACH einem openssl-src-Bump denselben Eintrag.
          key: openssl-vendored
          # Ohne das hier gibt es einen Teufelskreis, und er ist im ersten Anlauf eingetreten:
          # die Action speichert per Vorgabe nur nach einem GRÜNEN Job. Ein Lauf, der ins
          # Timeout rennt, hinterlässt also keinen Cache — der nächste startet wieder kalt und
          # rennt wieder ins Timeout. Ein Cache aus einem abgebrochenen Lauf ist nicht falsch,
          # nur unvollständig; die Crates darin sind dieselben.
          cache-on-failure: true

      # mise, weil check-all.sh seine Node-/pnpm-Versionen selbst pinnt
      # (`mise exec node@26.7.0 pnpm@11.10.0`) — beide Nachbarversionen sind gemessen kaputt,
      # siehe den Kommentar im Skript. actions/setup-node stünde daneben und würde ignoriert.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: node@26.7.0 pnpm@11.10.0
          cache: true

      - name: pnpm-Store-Pfad ermitteln
        id: pnpm
        run: echo "store=$(mise exec node@26.7.0 pnpm@11.10.0 -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Frontend-Abhängigkeiten
        run: mise exec node@26.7.0 pnpm@11.10.0 -- pnpm -C frontend install --frozen-lockfile

      # Der Browser-Cache hängt an der Playwright-Version aus dem Lockfile: ein Bump ohne
      # neuen Browser-Download endet sonst in „Executable doesn't exist".
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Playwright-Chromium
        run: mise exec node@26.7.0 pnpm@11.10.0 -- pnpm -C frontend exec playwright install --with-deps chromium

      # Ohne cargo-audit WARNT check-deps.sh nur und exitet 0 — im CI soll es prüfen.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Alle Gates
        run: ./scripts/check-all.sh

      # Nur im Fehlerfall: der Playwright-Report ist das einzige Mittel, eine e2e-Flake auf
      # fremder Hardware zu beurteilen (jsdom rechnet kein Layout, das Log allein reicht nicht).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # 90 statt 45: `cargo llvm-cov` baut den gesamten Workspace ein ZWEITES Mal, instrumentiert
    # und in einem eigenen Target-Verzeichnis — es teilt sich nichts mit dem Gate-Job.
    timeout-minutes: 90
    # Bewusst KEIN Required Check und bewusst ein eigener Job: `cargo llvm-cov` ersetzt
    # `cargo test` durch einen instrumentierten Lauf, im Gate-Job wäre das ein zweiter
    # kompletter Durchlauf. Und ein Coverage-Werkzeug darf das Gate nie rot färben —
    # es misst, es urteilt nicht.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PLATTENPLATZ — GEMESSEN NÖTIG, NICHT VORSORGLICH (erster CI-Lauf, PR #26).
      # Beide Jobs starben mitten im Build an „No space left on device"; der Runner konnte
      # zuletzt nicht einmal mehr sein eigenes Log schreiben. Ein ubuntu-latest-Runner hat
      # rund 14 GB frei, und dieses Projekt braucht mehr: Debug-Build des ganzen Workspace
      # samt Integrationstests, dazu OpenSSL aus Quelle (seit LFH-522), aws-lc-sys,
      # gebündeltes SQLite, node_modules und ein Chromium.
      # Die drei Verzeichnisse unten sind vorinstallierte Toolchains, die dieses Projekt
      # nirgends anfasst; allein das Android-SDK trägt zweistellige GB. `df` steht davor und
      # danach, damit beim nächsten Engpass nicht wieder geraten werden muss.
      - name: Plattenplatz schaffen
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: System-Werkzeuge für die nativen Crates
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nasm

      - name: Rust-Toolchain (stable + llvm-tools)
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage-openssl-vendored
          cache-on-failure: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llvmcov-cache
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.6.22-${{ runner.os }}
      - name: cargo-llvm-cov
        if: steps.llvmcov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.6.22

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: node@26.7.0 pnpm@11.10.0
          cache: true

      - name: Frontend-Abhängigkeiten
        run: mise exec node@26.7.0 pnpm@11.10.0 -- pnpm -C frontend install --frozen-lockfile

      # Dieselbe Env-Hygiene wie im Sammel-Gate: der Runner setzt zwar keine
      # LIFELINE_*-Variablen, aber der Aufruf soll dem lokalen gleichen.
      - name: Rust-Coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # Die Instrumentierung macht die Suite spürbar langsamer, und auf zwei vCPU reicht der
      # Vorgabe-Testtimeout von 10 s dann nicht mehr — gemessen: mehrere Tests liefen in
      # „Test timed out in 10000ms", die im Gate-Job (uninstrumentiert) grün sind. Das ist
      # keine Regression, sondern die bekannte Flakiness unter Last; die Antwort ist mehr Zeit
      # und weniger Parallelität, nicht ein abgeschalteter Test.
      - name: Frontend-Coverage
        run: >-
          mise exec node@26.7.0 pnpm@11.10.0 -- pnpm -C frontend run test:coverage --
          --coverage.reporter=lcov --testTimeout=30000 --no-file-parallelism

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info,frontend/coverage/lcov.info
          # Fehlt das Token (Fork-PR, Secret noch nicht gesetzt), soll der Job nicht rot
          # werden — der Upload ist Zusatznutzen, keine Zusicherung.
          fail_ci_if_error: false

  # Der Release hängt hier drin und nicht in einem eigenen, per `workflow_run` ausgelösten
  # Workflow. Grund steht im Kopf von release.yml: semantic-release liest den Branch aus
  # GITHUB_REF, und ein workflow_run-Lauf trägt dort immer den Default-Branch — ein Push auf
  # `beta` würde als stabiles Release herauskommen, sobald der Kanal existiert.
  #
  # `needs: gate` heißt: kein Release aus einem ungeprüften Stand. Auf `coverage` wird
  # bewusst NICHT gewartet — die Zahl ist informativ und soll nichts aufhalten.
  release:
    name: Release
    needs: gate
    # Nur bei einem Push auf einen Kanal-Branch. Ohne diese Bedingung löste jeder grüne
    # Pull-Request-Lauf einen Release-Versuch aus.
    if: github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: read
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
