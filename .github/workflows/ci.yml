# CI — Gate und Release-Aufruf.
#
# JEDER Job ruft `scripts/check-all.sh` auf, keiner stellt sich seine Schritte selbst zusammen:
# das Sammel-Gate bleibt die eine Wahrheit darüber, WAS geprüft wird; die Jobs entscheiden nur,
# WO es läuft. Wer einen Schritt vermisst, ändert das Skript.
#
# Geteilt, weil die drei schweren Suiten (Rust, Vitest, Playwright) nicht voneinander abhängen;
# der kritische Pfad ist die Rust-Suite allein. Sie bleibt EIN Job, weil Compile nur einen
# kleinen Teil ihrer Laufzeit ausmacht und jeder Shard ihn erneut zahlte. Vitest teilt nach
# Dateizahl.
#
# ZWEI STUFEN IM PR (LLH-1662): Dieser Workflow ist die erste Stufe und prüft jeden Push. Die
# e2e-Suite steht in `e2e.yml` und läuft im PR erst, wenn er fertig markiert ist (Auto-Merge an
# oder Label `e2e`); bis dahin fehlen ihre Pflicht-Checks. Bei einem Push auf einen Kanal-Branch
# ruft der Job `e2e` hier denselben Workflow auf, und der Release wartet darauf. Kopf von
# `e2e.yml`. Weitere Ereignistypen gehören NICHT hierher: das Einschalten von Auto-Merge bräche
# den laufenden Lauf ab (eine Gruppe je Ref).
#
# NUR DIE BETROFFENEN SUITEN (LFH-1111, LFH-1115): Der Job `aenderungen` fragt
# `scripts/ci-auswahl.sh`, das die geänderten Dateien eines PRs `scripts/bereiche.sh` vorlegt;
# die Zuordnung samt Querbezügen steht nur dort. Eine nicht gebrauchte Suite läuft leer durch;
# die Schnellprüfungen laufen immer. Leer heißt GRÜN, nicht fehlend: die Shard-Namen sind
# Required Checks im Ruleset 17017911, und ein per Job-`if` übersprungener Matrix-Job meldet sich
# unter seinem unexpandierten Namen („Frontend-Suite ${{ matrix.shard }}/4"), die Pflicht-Checks
# hingen auf „Expected". Deshalb tragen die Jobs mit Pflicht-Check die Bedingung an jedem
# Schritt, nicht am Job. Das gilt auch für die Rust-Suite ohne Matrix: ihr übersprungener Check
# zeigt GitHub zwar grün, Auto-Merge wartet aber trotzdem (reine Doku- und Website-PRs, #1283 und
# #1336, mussten von Hand gemergt werden). Nur Jobs ohne Pflicht-Check tragen die Bedingung am
# Job. Die zweite Stufe nutzt das Fehlen umgekehrt, damit ihre Checks fehlen (Kopf von `e2e.yml`).
# Im Zweifel wird geprüft: Nur ein ausdrückliches `false` spart, ein roter `aenderungen`-Job
# lässt alles laufen. Push-Läufe auf Kanal-Branches prüfen immer voll.
#
# EIGENER RUNNER (LLH-1666, ADR-0025): `e2e-Binary` und die e2e-Shards laufen auf dem eigenen
# Server, wenn die Repo-Variable `E2E_RUNNER` ein Runner-Label nennt und der Lauf nicht aus einem
# Fork stammt. Die Jobs und die Runner-Wahl stehen seit LLH-1662 in `e2e.yml` (Kopf dort); dieser
# Workflow ruft ihn bei Push auf.
#
# NUR UMNUMMERIERT (LLH-1660, je Suite seit LLH-1662): Benennt der Migrations-Autofix nur
# Migrationen um, übernimmt der neue Kopf jede Suite, die am Commit davor grün war
# (`scripts/ci-auswahl.sh`, `scripts/nur-umnummeriert.sh`). Schnellprüfungen,
# `Migrationsnummern` und die Rust-Suite laufen immer: sie prüft die umnummerierte Migration
# zusammen mit der, die auf dem Ziel-Branch dazukam.
#
# Coverage steht in coverage.yml: dieser Lauf wird auf einem Kanal-Branch nicht abgebrochen,
# ein langer Coverage-Job hielte jeden Folge-Push auf „pending".
#
# Alle Actions sind per Commit-SHA gepinnt (Tag im Kommentar): ein kompromittierter,
# verschobener Upstream-Tag liefe sonst mit den Rechten dieses Workflows. Dependabot hält die
# Pins aktuell.
name: CI

on:
  pull_request:
  push:
    # `alpha` ist der Default-Branch, `main` die Freigabe; `beta` steht als Zwischenstufe
    # bereit und wird beim Anlegen sofort geprüft.
    branches: [main, beta, alpha]

# Least privilege: das Gate liest nur. Schreibrechte hat ausschließlich der Release-Workflow,
# über eine GitHub App statt GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # NUR Pull-Request-Läufe abbrechen: auf einem Kanal-Branch hängt der Release-Job am selben
  # Lauf, und ein Abbruch zwischen Versions-Commit und GitHub-Release hinterließe ein Tag ohne
  # Release (und ohne Artefakte, die release.yml erst nach dem Entwurf startet).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Die Debuginfo-Stufe (Zeilentabellen, keine für Abhängigkeiten) steht in Cargo.toml,
  # [profile.dev] (LFH-845), und gilt lokal wie hier.
  # Parallelität nach den Kernen des Runners (LLH-1664; der Schritt „Runner-Größe“ in den
  # Suiten nennt Kerne und Speicher). Vitest 2 Dateien zugleich statt einer (lokale Vorgabe in
  # check-all.sh bleibt 1). Die Playwright-Worker stehen in `e2e.yml`. Messwerte vorher/nachher an
  # der Aufgabe LLH-1664.
  VITEST_WORKERS: 2
  # Der Runner läuft in UTC. check-all.sh setzt die Zone selbst; hier steht sie für alles
  # außerhalb des Skripts.
  TZ: Europe/Berlin

jobs:
  # ── Welche Suiten braucht dieser Lauf? (LFH-1111/1115, s. Kopf) ─────────────────────
  aenderungen:
    name: Geänderte Bereiche
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `checks: read` für die Check-Runs des Vorgängers (Umnummerierung, `scripts/ci-auswahl.sh`).
    permissions:
      contents: read
      checks: read
    outputs:
      rust: ${{ steps.bereiche.outputs.rust }}
      frontend: ${{ steps.bereiche.outputs.frontend }}
    steps:
      # Bei `pull_request` ist HEAD der Merge-Commit, HEAD^1 die Spitze des Ziel-Branches: zwei
      # Commits Tiefe reichen für den Vergleich. Bei Push prüft das Skript ohnehin voll.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Betroffene Suiten
        id: bereiche
        env:
          CI_EREIGNIS: ${{ github.event_name }}
          CI_KOPF: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-auswahl.sh eins | tee -a "$GITHUB_OUTPUT"

  # ── Die billigen Prüfungen, in einem Job und zuerst ──────────────────────────────────
  # Damit ein Formatierungsfehler nicht erst nach einer Viertelstunde Testlauf auffällt.
  schnell:
    name: Schnellprüfungen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nur bei Bedarf: das Aufräumen kostete auf dem kritischen Pfad über eine Minute, und die
      # heutigen Runner haben genug Platz. Die Schwelle hält den Weg für knappe Images offen.
      - name: Plattenplatz schaffen (nur bei Bedarf)
        run: |
          df -h /
          frei_gb="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          if [ "$frei_gb" -ge 40 ]; then
            echo "Genug Platz (${frei_gb} GB frei) — kein Aufräumen nötig."
            exit 0
          fi
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      # Über das Skript, nie `apt-get` direkt: ein hängender Spiegel hielt den Schritt sonst bis
      # zum Job-Timeout fest (LFH-1101).
      - name: System-Werkzeuge für die nativen Crates
        run: ./scripts/apt-pakete.sh nasm
      - name: Rust-Toolchain (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # shared-key statt key: sonst hängt rust-cache die Job-ID an, jeder Job hätte einen
          # eigenen mehrere GB großen Eintrag (GitHub deckelt bei 10 GB je Repository).
          # `save-if: false` überall außer im Rust-Job: EINER pflegt den Eintrag.
          shared-key: rust-openssl-vendored
          save-if: false
          cache-on-failure: true
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.1
          cache: true
      - name: pnpm-Store-Pfad ermitteln
        id: pnpm
        run: echo "store=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Frontend-Abhängigkeiten
        id: frontend-install
        run: mise exec -- pnpm -C frontend install --frozen-lockfile
      # Scheitert der Install an der Karenzzeit (LLH-1884), kommen die Schnellprüfungen nicht
      # mehr dran, und es stünde nur der rohe pnpm-Fehler da. Dieser Schritt läuft nur dann und
      # erklärt den Verstoß wie Schritt 6 (Paket, ab wann alt genug, neu starten). Der Job bleibt
      # rot; an der Karenzzeit ändert sich nichts.
      - name: Karenzzeit erklären (nur nach gescheitertem Install)
        if: failure() && steps.frontend-install.outcome == 'failure'
        run: ./scripts/check-karenzzeit.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit-cache
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Schnellprüfungen
        run: ./scripts/check-all.sh --nur schnell

  # ── Rust-Suite ──────────────────────────────────────────────────────────────────────
  # Bewusst NICHT partitioniert (Compile würde je Shard erneut bezahlt). Dieser Job pflegt als
  # einziger den geteilten Cargo-Cache (save-if: true, die Vorgabe).
  rust:
    name: Rust-Suite
    needs: aenderungen
    # Am Job nur `!cancelled()`, die Bedingung `RUST` steht an jedem Schritt (s. Kopf): der
    # Pflicht-Check `Rust-Suite` läuft leer grün durch statt übersprungen zu werden.
    if: ${{ !cancelled() }}
    env:
      RUST: ${{ needs.aenderungen.outputs.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUST != 'false'
      # Nur bei Bedarf aufräumen (s. Schnellprüfungen).
      - name: Plattenplatz schaffen (nur bei Bedarf)
        if: env.RUST != 'false'
        run: |
          df -h /
          frei_gb="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          if [ "$frei_gb" -ge 40 ]; then
            echo "Genug Platz (${frei_gb} GB frei) — kein Aufräumen nötig."
            exit 0
          fi
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      # Die GTK-/WebKit-Pakete braucht die Desktop-Hülle (src-tauri, LFH-721): Schritt 4 testet
      # sie mit (`cargo test -p lifeline-desktop`). Umgebung wie nasm, kein Schritt neben check-all.sh.
      - name: System-Werkzeuge für die nativen Crates
        if: env.RUST != 'false'
        # Die WebKit-Pakete sind groß: bei tröpfelndem Spiegel reichen 300 s je Versuch nicht
        # (LLH-1420). Was ein abgebrochener Versuch schon geladen hat, bleibt im apt-Cache liegen.
        env:
          APT_FRIST_SEK: "600"
        run: >-
          ./scripts/apt-pakete.sh nasm
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          librsvg2-dev libayatana-appindicator3-dev
      - name: Rust-Toolchain (stable)
        if: env.RUST != 'false'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RUST != 'false'
        with:
          shared-key: rust-openssl-vendored
          cache-on-failure: true
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: env.RUST != 'false'
        with:
          version: 2026.9.1
          cache: true
      - name: Rust-Suite
        if: env.RUST != 'false'
        run: ./scripts/check-all.sh --nur rust

  # ── Frontend-Suite, auf vier Runner geteilt ─────────────────────────────────────────
  frontend:
    name: Frontend-Suite ${{ matrix.shard }}/4
    needs: aenderungen
    # Am Job nur `!cancelled()`, die Bedingung `FRONTEND` steht an jedem Schritt (s. Kopf).
    if: ${{ !cancelled() }}
    env:
      FRONTEND: ${{ needs.aenderungen.outputs.frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Ohne fail-fast: ein roter Shard darf den anderen drei nicht die Diagnose nehmen.
      fail-fast: false
      # DIE SHARD-ZAHL IST EIN PIN: die gerenderten Jobnamen („… 1/4" bis „4/4") sind Required
      # Status Checks im Ruleset 17017911. Eine andere Zahl änderte die Check-Namen, die alten
      # reporteten nie mehr, und jeder PR hinge still auf „Expected". Nur zusammen mit dem
      # Ruleset ändern.
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.FRONTEND != 'false'
      # Kein Rust, kein Chromium, kein Plattenplatz-Schritt — dieser Job braucht nur Node.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: env.FRONTEND != 'false'
        with:
          version: 2026.9.1
          cache: true
      - name: pnpm-Store-Pfad ermitteln
        if: env.FRONTEND != 'false'
        id: pnpm
        run: echo "store=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.FRONTEND != 'false'
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Frontend-Abhängigkeiten
        if: env.FRONTEND != 'false'
        run: mise exec -- pnpm -C frontend install --frozen-lockfile
      - name: Runner-Größe
        if: env.FRONTEND != 'false'
        run: echo "Kerne $(nproc), Speicher $(free -h | awk '/^Mem:/ {print $2}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Frontend-Suite (Anteil ${{ matrix.shard }}/4)
        if: env.FRONTEND != 'false'
        env:
          VITEST_SHARD: ${{ matrix.shard }}/4
        run: ./scripts/check-all.sh --nur frontend
      # Vitest legt die Blobs unter frontend/.vitest/blob/ ab. include-hidden-files ist
      # Pflicht, weil das Verzeichnis mit einem Punkt beginnt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && env.FRONTEND != 'false' }}
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: frontend/.vitest/blob/*
          include-hidden-files: true
          retention-days: 1

  # ── e2e-Suite der Kanal-Branches ────────────────────────────────────────────────────
  # Im PR startet `e2e.yml` selbst (zweite Stufe, s. Kopf). Hier nur bei Push, damit der Release
  # auf sie wartet. Der Name trägt keinen Pflicht-Check: ein übersprungener Aufruf erfüllt nichts.
  e2e:
    name: e2e (Kanal)
    if: github.event_name == 'push'
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      checks: read

  # ── Ein Bericht aus den Vitest-Teilläufen ───────────────────────────────────────────
  # KEINE Required Checks — das sind die Shard-Jobs selbst: die Merge-Werkzeuge scheitern
  # nur bei NULL Blobs, ein gestorbener Shard ergäbe sonst einen grünen Teilbericht. Mit
  # `!cancelled()`, weil man den Bericht gerade bei Rot braucht. Den e2e-Bericht baut `e2e.yml`.
  berichte:
    name: Testberichte zusammenführen
    needs: [aenderungen, frontend]
    # Ein Bericht über null Teilläufe hilft niemandem.
    if: ${{ !cancelled() && needs.aenderungen.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.1
          cache: true
      - name: Frontend-Abhängigkeiten
        run: mise exec -- pnpm -C frontend install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: frontend/.vitest/blob
          pattern: vitest-blob-*
          merge-multiple: true
      # Der Riegel gegen den stillen Teilbericht: fehlt ein Blob, wäre die Zusammenfassung
      # eine Aussage über weniger Tests, als jemand beim Lesen annimmt. Ohne Blobs legt
      # download-artifact das Verzeichnis nicht an (LLH-1205) — deshalb die Prüfung mit `-d`.
      - name: Vollzähligkeit der Teilberichte
        run: |
          set -euo pipefail
          v=0
          if [ -d frontend/.vitest/blob ]; then
            v="$(find frontend/.vitest/blob -name 'blob-*.json' | wc -l | tr -d ' ')"
          fi
          echo "Vitest-Blobs: $v von 4"
          [ "$v" -eq 4 ] || {
            echo "WARNUNG: nicht alle Shards haben einen Bericht hinterlassen." >&2
            echo "         Der zusammengeführte Bericht deckt dann WENIGER ab als die Suite." >&2
          }
      - name: Frontend-Bericht
        run: mise exec -- pnpm -C frontend exec vitest run --merge-reports --reporter=default
        continue-on-error: true

  # Der Release hängt hier und nicht in einem `workflow_run`-Workflow: semantic-release liest
  # den Branch aus GITHUB_REF, und ein workflow_run-Lauf trägt dort immer den Default-Branch
  # (Näheres im Kopf von release.yml).
  #
  # `needs` MUSS ALLE VIER PRÜFJOBS NENNEN (bei einer Matrix alle Instanzen; `e2e` ist der Aufruf
  # von `e2e.yml` und wartet auf alle seine Jobs) — sonst entstünde ein Release über einer roten
  # Suite. Auf `berichte` wird bewusst NICHT gewartet: der läuft
  # mit `!cancelled()` und wäre auch bei roten Shards grün.
  #
  # EIN AUFRUF IST KEIN RELEASE: mit dem Ruhefenster (`scripts/release-ruhefenster.sh`) tritt
  # der Job zurück, wenn auf dem Kanal ein neuerer Commit liegt. Ein übersprungener
  # Release-Job ist der Normalfall. Push-Läufe desselben Kanals stehen in EINER
  # Nebenläufigkeitsgruppe; ein wartender Release hält also den nächsten Lauf auf — wer das
  # Fenster deutlich vergrößert, gibt dem Release eine eigene Gruppe.
  release:
    name: Release
    needs: [schnell, rust, frontend, e2e]
    # Nur bei einem Push auf einen Kanal-Branch, nicht bei jedem grünen PR-Lauf.
    if: github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    # `actions: write`: release.yml startet artefakte.yml per workflow_dispatch (LFH-1054).
    # `id-token: write`: Claude meldet sich für die Release-Notizen per GitHub-OIDC an.
    permissions:
      contents: read
      actions: write
      id-token: write
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
