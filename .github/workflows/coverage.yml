# Coverage — Rust- und Frontend-Abdeckung für Codecov.
#
# EIN EIGENER WORKFLOW wegen der Nebenläufigkeitsgruppe: ci.yml bricht Kanal-Läufe bewusst
# nicht ab, und ein langer Coverage-Job darin hielte jeden Folge-Push auf „pending" (die Gruppe
# gibt erst frei, wenn der ganze Lauf endet). Hier darf abgebrochen werden, weil nichts daran
# hängt — kein Release, kein Required Check; Codecov vergleicht dann gegen den letzten
# gemessenen Vorfahren, was für eine informative Zahl genügt.
#
# NUR AUF PUSH: der längste Lauf des Repos, für eine Zahl, die sich zwischen zwei Commits kaum
# bewegt.
#
# Alle Actions sind per Commit-SHA gepinnt (Tag im Kommentar), wie in ci.yml.
name: Coverage

on:
  push:
    branches: [main, beta, alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # llvm-cov braucht Zeileninfo, mehr nicht; volle Debug-Symbole kosten mehrere GB Platte
  # (Begründung ausführlich in ci.yml).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Der Runner läuft in UTC; dieser Workflow fährt check-all.sh nicht, das die Zone sonst setzt.
  TZ: Europe/Berlin

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # `cargo llvm-cov` baut den ganzen Workspace ein ZWEITES Mal, instrumentiert und in einem
    # eigenen Target-Verzeichnis.
    timeout-minutes: 90
    # Bewusst KEIN Required Check: ein Coverage-Werkzeug darf das Gate nie rot färben — es
    # misst, es urteilt nicht.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PLATTENPLATZ: der Debug-Build des ganzen Workspace samt OpenSSL aus Quelle, aws-lc-sys,
      # gebündeltem SQLite, node_modules und Chromium passte nicht auf einen Standard-Runner.
      # Die Verzeichnisse unten sind vorinstallierte Toolchains, die dieses Projekt nicht
      # anfasst. `df` davor und danach, damit man beim nächsten Engpass nicht raten muss.
      - name: Plattenplatz schaffen
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      # Die GTK-/WebKit-Pakete braucht die Desktop-Hülle (src-tauri, LFH-721): `cargo llvm-cov
      # --workspace` übersetzt sie mit. Umgebung wie nasm, kein Schritt neben check-all.sh.
      - name: System-Werkzeuge für die nativen Crates
        run: >-
          sudo apt-get update && sudo apt-get install --no-install-recommends -y nasm
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          librsvg2-dev libayatana-appindicator3-dev

      - name: Rust-Toolchain (stable + llvm-tools)
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Eigener Schlüssel, KEIN shared-key: instrumentierte Artefakte im geteilten Eintrag
          # machten ihn für die anderen Jobs unbrauchbar.
          key: coverage-openssl-vendored
          cache-on-failure: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llvmcov-cache
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.6.22-${{ runner.os }}
      - name: cargo-llvm-cov
        if: steps.llvmcov-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --locked --version 0.6.22

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          cache: true

      - name: Frontend-Abhängigkeiten
        run: mise exec -- pnpm -C frontend install --frozen-lockfile

      # Dieselbe Env-Hygiene wie im Sammel-Gate: der Runner setzt zwar keine
      # LIFELINE_*-Variablen, aber der Aufruf soll dem lokalen gleichen.
      - name: Rust-Coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # Die Instrumentierung macht die Suite auf zwei vCPU so langsam, dass der
      # Vorgabe-Timeout von 10 s nicht reicht — mehr Zeit und weniger Parallelität statt
      # abgeschalteter Tests. `exec vitest` direkt, weil `pnpm run test:coverage -- <flags>`
      # die Flags nicht durchreichte.
      #
      # `--retry=1` ist großzügiger als im Gate und darf es sein: dieser Job misst nur
      # (continue-on-error). Bleibt er trotzdem rot, gehört die Frontend-Coverage ganz heraus,
      # statt weiter Schrauben zu lockern.
      - name: Frontend-Coverage
        run: >-
          mise exec -- pnpm -C frontend exec vitest run --coverage
          --coverage.reporter=lcov --testTimeout=30000 --no-file-parallelism --retry=1

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info,frontend/coverage/lcov.info
          # Fehlt das Token (Fork-PR, Secret noch nicht gesetzt), soll der Job nicht rot
          # werden — der Upload ist Zusatznutzen, keine Zusicherung.
          fail_ci_if_error: false
