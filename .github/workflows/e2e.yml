# e2e — die zweite Stufe der PR-CI (LLH-1662) und die e2e-Suite der Kanal-Branches.
#
# ZWEI STUFEN IM PR: `ci.yml` prüft jeden Push (Schnellprüfungen, Rust, Vitest). Die e2e-Suite
# (e2e-Binary und die Anteile `e2e 1/4` bis `4/4`, rund eine Stunde und fünf Jobs) läuft erst,
# wenn der PR als FERTIG markiert ist: Auto-Merge ist eingeschaltet oder das Label `e2e` ist
# gesetzt. Beim Einschalten startet sie für den aktuellen Kopf-Commit, danach bei jedem weiteren
# Push, solange eines davon gilt. Das Label holt e2e-Rückmeldung, ohne zu mergen.
#
# DIE PFLICHT-CHECKS FEHLEN DAVOR, STATT LEER GRÜN ZU MELDEN: `e2e-Binary` und `e2e 1/4` bis
# `4/4` sind Required Checks im Ruleset 17017911. Ein per Job-`if` übersprungener Matrix-Job meldet
# sich unter seinem unexpandierten Namen (`e2e ${{ matrix.shard }}/4`), der gerenderte Name fehlt,
# und der PR ist nicht mergebar; Auto-Merge wartet genau darauf. Deshalb ist auch das Binary eine
# Matrix mit einem Eintrag, aus dem sein Name entsteht: ein übersprungener Job OHNE Matrix
# erfüllte seinen Check. Ob ein Lauf startet, entscheidet allein das `if` der Auswahl
# (`aenderungen`); `binaer` und `e2e` hängen an ihrem Ergebnis. „e2e betroffen“ steht wie bisher
# an jedem Schritt: ein fertiger PR ohne e2e-relevante Änderung meldet leer grün.
#
# NEBENLÄUFIGKEIT: Ereignisse, die eine Stufe starten oder die letzte Fertig-Markierung
# zurücknehmen, teilen sich eine Gruppe je PR und brechen einen laufenden Lauf ab; so beendet
# „Auto-Merge aus“ einen laufenden e2e-Lauf, und ein neuer Commit an einem fertigen PR den Lauf
# für den alten Kopf. Alles andere (ein fremdes Label, das Entfernen von `e2e` bei weiter
# eingeschaltetem Auto-Merge, ein Commit an einem PR in Arbeit) läuft in einer eigenen Gruppe und
# startet nichts.
#
# KANAL-BRANCHES: `ci.yml` ruft diesen Workflow bei jedem Push auf `alpha`, `beta`, `main` auf
# (`workflow_call`, dort ist `github.event_name` = `push`), und der Release wartet darauf. Die
# Checks heißen dann `e2e (Kanal) / e2e 1/4` usw. (Name des Aufruf-Jobs als Vorsilbe); auf
# Kanal-Branches verlangt das Ruleset keine.
#
# Warum ein eigener Workflow und nicht mehr Ereignisse in `ci.yml`: das Einschalten von Auto-Merge
# bräche dort den laufenden Lauf ab (eine Gruppe je Ref), und ein Lauf, der Rust und
# Schnellprüfungen überspringt, meldete sie als jüngsten Check-Run `skipped`, also grün, auch über
# einem roten.
#
# Regeln: scripts/AGENTS.md, „Zwei Stufen im PR“. Formtest: scripts/ci-stufen.test.sh.
# Alle Actions sind per Commit-SHA gepinnt (Tag im Kommentar), wie in ci.yml.
name: e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, auto_merge_enabled, auto_merge_disabled, labeled, unlabeled]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Gemeinsame Gruppe je PR für jeden Start (s. `if` der Auswahl) und für das Zurücknehmen der
  # letzten Fertig-Markierung; sonst eine eigene je Lauf (s. Kopf). Ein neuer Commit an einem
  # NICHT fertigen PR teilt sie nicht: die Nutzlast ist der Stand beim Ereignis, und ein Lauf, der
  # nach dem Einschalten von Auto-Merge eingereiht wird, bräche sonst den gerade gestarteten ab
  # (GitHub garantiert die Reihenfolge nicht). Formtest: scripts/ci-stufen.test.sh.
  group: >-
    ${{ (github.event_name == 'pull_request' && (
          (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)
           && (github.event.pull_request.auto_merge != null
               || contains(github.event.pull_request.labels.*.name, 'e2e')))
          || (github.event.action == 'auto_merge_enabled'
              && !contains(github.event.pull_request.labels.*.name, 'e2e'))
          || (github.event.action == 'labeled' && github.event.label.name == 'e2e'
              && github.event.pull_request.auto_merge == null)
          || ((github.event.action == 'auto_merge_disabled'
               || (github.event.action == 'unlabeled' && github.event.label.name == 'e2e'))
              && github.event.pull_request.auto_merge == null
              && !contains(github.event.pull_request.labels.*.name, 'e2e'))))
        && format('e2e-pr-{0}', github.event.pull_request.number)
        || format('e2e-lauf-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Parallelität nach den Kernen des Runners (LLH-1664; der Schritt „Runner-Größe“ nennt Kerne
  # und Speicher). Bei 4 Kernen: Playwright 3 statt 4 Worker, weil Vite-Server und Backend auf
  # demselben Runner mitrechnen. Zeigen wandernde Infrastruktur-Fehler (goto-Timeout,
  # ERR_CONNECTION_REFUSED, Kopf von `workers` in frontend/playwright.config.ts), zuerst hier
  # zurücknehmen. Messwerte vorher/nachher an der Aufgabe LLH-1664.
  PW_WORKERS: 3
  TZ: Europe/Berlin

jobs:
  # ── Startet die zweite Stufe, und braucht sie e2e? ──────────────────────────────────
  # Das `if` ist die eine Stelle, die über den Start entscheidet: bei Push immer; im PR bei einem
  # neuen Commit, wenn er fertig ist, und wenn eine Fertig-Markierung gesetzt wird, die vorher
  # fehlte (sonst lief die Stufe schon). Es liest den Zustand NACH dem Ereignis.
  aenderungen:
    name: e2e-Auswahl
    if: >-
      ${{ github.event_name != 'pull_request'
        || (contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)
            && (github.event.pull_request.auto_merge != null
                || contains(github.event.pull_request.labels.*.name, 'e2e')))
        || (github.event.action == 'auto_merge_enabled'
            && !contains(github.event.pull_request.labels.*.name, 'e2e'))
        || (github.event.action == 'labeled' && github.event.label.name == 'e2e'
            && github.event.pull_request.auto_merge == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `checks: read` für die Check-Runs des Vorgängers (Umnummerierung, `scripts/ci-auswahl.sh`).
    permissions:
      contents: read
      checks: read
    outputs:
      e2e: ${{ steps.bereiche.outputs.e2e }}
    steps:
      # Bei `pull_request` ist HEAD der Merge-Commit, HEAD^1 die Spitze des Ziel-Branches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Betroffene Suiten
        id: bereiche
        env:
          CI_EREIGNIS: ${{ github.event_name }}
          CI_KOPF: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci-auswahl.sh zwei | tee -a "$GITHUB_OUTPUT"

  # ── Backend-Binary für die e2e-Anteile ──────────────────────────────────────────────
  # Eigener Job: so starten die Anteile nach dem Build statt nach Build PLUS Rust-Tests.
  # Eine Matrix mit EINEM Eintrag, nur damit der Name fehlt, wenn die Stufe nicht startet (s. Kopf).
  binaer:
    name: ${{ matrix.check }}
    needs: aenderungen
    # Läuft auch, wenn die Auswahl rot ist: im Zweifel wird geprüft (leere Ausgabe = betroffen).
    if: ${{ !cancelled() && needs.aenderungen.result != 'skipped' }}
    env:
      E2E: ${{ needs.aenderungen.outputs.e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        # DER NAME IST EIN PIN: Required Check im Ruleset 17017911.
        check: [e2e-Binary]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.E2E != 'false'
      # Nur bei Bedarf aufräumen (s. Schnellprüfungen in ci.yml).
      - name: Plattenplatz schaffen (nur bei Bedarf)
        if: env.E2E != 'false'
        run: |
          df -h /
          frei_gb="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          if [ "$frei_gb" -ge 40 ]; then
            echo "Genug Platz (${frei_gb} GB frei) — kein Aufräumen nötig."
            exit 0
          fi
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /
      # Über das Skript, nie `apt-get` direkt: ein hängender Spiegel hielt den Schritt sonst bis
      # zum Job-Timeout fest (LFH-1101).
      - name: System-Werkzeuge für die nativen Crates
        if: env.E2E != 'false'
        run: ./scripts/apt-pakete.sh nasm
      - name: Rust-Toolchain (stable)
        if: env.E2E != 'false'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.E2E != 'false'
        with:
          shared-key: rust-openssl-vendored
          save-if: false
          cache-on-failure: true
      - name: Debug-Binary bauen
        if: env.E2E != 'false'
        run: cargo build --bin lifeline-hub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.E2E != 'false'
        with:
          name: lifeline-hub-debug
          path: target/debug/lifeline-hub
          retention-days: 1

  # ── e2e-Suite, auf vier Runner geteilt ──────────────────────────────────────────────
  e2e:
    name: e2e ${{ matrix.shard }}/4
    needs: [aenderungen, binaer]
    # Ein rotes Binary lässt die Anteile aus, dann fehlen sie (s. Kopf).
    if: ${{ !cancelled() && needs.aenderungen.result != 'skipped' && needs.binaer.result == 'success' }}
    env:
      E2E: ${{ needs.aenderungen.outputs.e2e }}
    runs-on: ubuntu-latest
    # 75 min (LLH-1488): gemessen am 27.10.2026 (Lauf 40581848993) brauchten die Tests je Shard
    # 33, 58, 47 und 49 min; Shard 2 lief zweimal in die alte Frist von 60 min, ohne roten Test.
    # Die Suite hat sich seit der Laufzeittabelle von LFH-1117 verdoppelt (180 → 267 Dateien,
    # 173 → 337 Testminuten); nach der aufgefrischten `frontend/e2e/laufzeiten.json` sind es
    # rechnerisch 45 min je Shard, `gate3-trefflaeche` allein 35 min. 45 von 75 min lässt Luft
    # für langsame Runner und die Firefox/WebKit-Systempakete bei leerem apt-Cache (34 min bei
    # einem langsamen Ubuntu-Mirror, PR #338).
    timeout-minutes: 75
    strategy:
      # Ohne fail-fast: ein roter Shard darf den anderen drei nicht die Diagnose nehmen.
      fail-fast: false
      # DIE SHARD-ZAHL IST EIN PIN: die gerenderten Jobnamen („… 1/4" bis „4/4") sind Required
      # Status Checks im Ruleset 17017911. Eine andere Zahl änderte die Check-Namen, die alten
      # reporteten nie mehr, und jeder PR hinge still auf „Expected". Nur zusammen mit dem
      # Ruleset ändern.
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.E2E != 'false'
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: env.E2E != 'false'
        with:
          version: 2026.9.1
          cache: true
      - name: pnpm-Store-Pfad ermitteln
        if: env.E2E != 'false'
        id: pnpm
        run: echo "store=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.E2E != 'false'
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Frontend-Abhängigkeiten
        if: env.E2E != 'false'
        run: mise exec -- pnpm -C frontend install --frozen-lockfile
      # Die Browserliste steht im Schlüssel: ein Eintrag aus der Zeit, als nur Chromium installiert
      # wurde, darf nicht als Treffer für alle drei gelten.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.E2E != 'false'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-firefox-webkit-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      # SYSTEMPAKETE AUS DEM CACHE: Firefox und WebKit brauchen rund 125 MB .deb-Pakete, die das
      # Runner-Image nicht mitbringt. Der Ubuntu-Mirror lieferte sie im ersten Lauf (PR #338) in
      # zwei Shards mit 60–90 kB/s, 24 bzw. 34 min, und riss das 40-min-Limit; im dritten Shard in
      # 28 s. Die Tests selbst blieben bei 11 min. apt-get nimmt Pakete, die passend in
      # /var/cache/apt/archives liegen, statt sie zu laden. Ein veralteter Eintrag schadet nicht:
      # was sich geändert hat, lädt apt nach. Der Schlüssel hängt am Lockfile, weil die
      # Playwright-Version die Paketliste bestimmt.
      #
      # Laden und Speichern getrennt (`restore`/`save`): das kombinierte `actions/cache` speichert
      # erst am Ende eines GRÜNEN Jobs — ein roter oder abgebrochener Shard hinterließe nichts, und
      # der nächste Lauf stünde wieder am langsamen Mirror.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.E2E != 'false'
        id: apt-cache
        with:
          path: ~/.cache/apt-playwright
          key: apt-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: apt-playwright-${{ runner.os }}-${{ runner.arch }}-
      - name: Systempakete aus dem Cache bereitlegen
        if: env.E2E != 'false'
        run: |
          mkdir -p ~/.cache/apt-playwright
          if compgen -G "$HOME/.cache/apt-playwright/*.deb" > /dev/null; then
            sudo cp "$HOME"/.cache/apt-playwright/*.deb /var/cache/apt/archives/
            echo "Aus dem Cache: $(ls "$HOME"/.cache/apt-playwright/*.deb | wc -l) Pakete"
          fi
      # ALLE DREI in jedem Shard: welcher Shard die Firefox- und WebKit-Fälle bekommt, entscheidet
      # die Verteilung nach Laufzeit, und die verschiebt sich mit jeder aufgefrischten Tabelle.
      # Systempakete und Browser getrennt. `install-deps` ruft apt-get: Frist und Wiederholung wie
      # `scripts/apt-pakete.sh` (LFH-1101), und wie dort läuft die Schleife UNTER `sudo`
      # (LLH-1420, LLH-1507). Darüber traf `timeout` nur `sudo`; das apt-get als root lud am
      # hängenden Spiegel weiter, hielt den apt-Lock, und Versuch 2 und 3 endeten sofort mit
      # „Could not get lock“. `install-deps` reicht apt keine Optionen durch, daher Sperr-Wartezeit
      # und Netz-Fristen als apt-Konfiguration. 15 min je Versuch, weil ein Lauf ohne Paket-Cache
      # am langsamen Spiegel schon 24 min brauchte (s. o.); was ein abgebrochener Versuch geladen
      # hat, bleibt im Archiv. Die Browser lädt der Runner-Nutzer, damit sie in seinem Cache liegen;
      # meist kommen sie aus dem Cache, daher 5 min je Versuch. So endet der Schritt auch im
      # schlimmsten Fall (3 × 15 + 3 × 5 min) mit eigenem Grund vor dem Job-Timeout von 75 min.
      - name: Playwright-Browser (Chromium, Firefox, WebKit)
        if: env.E2E != 'false'
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' 'DPkg::Lock::Timeout "120";' |
            sudo tee /etc/apt/apt.conf.d/99lfh-fristen > /dev/null
          node_bin="$(mise exec -- node -p 'process.execPath')"
          sudo env "WIEDERHOLEN_PAUSE_SEK=15" ./scripts/wiederholen.sh 3 900 -- \
            sh -c 'dpkg --configure -a && "$0" frontend/node_modules/@playwright/test/cli.js install-deps chromium firefox webkit' \
            "$node_bin"
          ./scripts/wiederholen.sh 3 300 -- \
            mise exec -- pnpm -C frontend exec playwright install chromium firefox webkit
          # Für den Cache (s. o.): was apt-get geladen hat, liegt danach in seinem Archiv.
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            cp /var/cache/apt/archives/*.deb ~/.cache/apt-playwright/
          fi
      # Gleich nach der Installation, nicht erst am Jobende (s. o.). Nur ohne exakten Treffer: ein
      # bestehender Schlüssel lässt sich nicht überschreiben.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.E2E != 'false' && steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/apt-playwright
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.E2E != 'false'
        with:
          name: lifeline-hub-debug
          path: bin
      # PFLICHT: upload-artifact zippt ohne Dateirechte, alles kommt als 644 zurück.
      # check-all.sh prüft das Bit und bräche sonst mit klarer Meldung ab.
      - name: Ausführbar machen
        if: env.E2E != 'false'
        run: chmod +x bin/lifeline-hub
      - name: Runner-Größe
        if: env.E2E != 'false'
        run: echo "Kerne $(nproc), Speicher $(free -h | awk '/^Mem:/ {print $2}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: e2e-Suite (Anteil ${{ matrix.shard }}/4)
        if: env.E2E != 'false'
        env:
          PW_SHARD: ${{ matrix.shard }}/4
          # Erspart die Rust-Toolchain: ohne die Variable fragte die Playwright-Config
          # `cargo metadata` nach dem Target-Verzeichnis.
          PW_BINAER: ${{ github.workspace }}/bin/lifeline-hub
        run: ./scripts/check-all.sh --nur e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && env.E2E != 'false' }}
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: frontend/blob-report
          retention-days: 1

  # ── Ein Bericht aus den Teilläufen ──────────────────────────────────────────────────
  # KEIN Required Check — das sind die Anteile selbst: `playwright merge-reports` scheitert nur
  # bei NULL Blobs, ein gestorbener Anteil ergäbe sonst einen grünen Teilbericht. Mit
  # `!cancelled()`, weil man den Bericht gerade bei Rot braucht. `continue-on-error` am Job: bei
  # Push wartet der Release auf den Aufruf dieses Workflows, und der ist nur grün, wenn jeder Job
  # grün ist; ein Aussetzer im Bericht hielte sonst einen Release über grünen Suiten auf.
  berichte:
    name: e2e-Bericht
    continue-on-error: true
    needs: [aenderungen, e2e]
    if: >-
      ${{ !cancelled() && needs.aenderungen.result != 'skipped'
      && needs.aenderungen.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.1
          cache: true
      - name: Frontend-Abhängigkeiten
        run: mise exec -- pnpm -C frontend install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: frontend/all-blob-reports
          pattern: playwright-blob-*
          merge-multiple: true
      # Der Riegel gegen den stillen Teilbericht: fehlt ein Blob, wäre die Zusammenfassung
      # eine Aussage über weniger Tests, als jemand beim Lesen annimmt. Ohne Blobs legt
      # download-artifact das Verzeichnis nicht an (LLH-1205) — deshalb die Prüfung mit `-d`.
      - name: Vollzähligkeit der Teilberichte
        run: |
          set -euo pipefail
          p=0
          if [ -d frontend/all-blob-reports ]; then
            p="$(find frontend/all-blob-reports -name '*.zip' | wc -l | tr -d ' ')"
          fi
          echo "Playwright-Blobs: $p von 4"
          [ "$p" -eq 4 ] || {
            echo "WARNUNG: nicht alle Anteile haben einen Bericht hinterlassen." >&2
            echo "         Der zusammengeführte Bericht deckt dann WENIGER ab als die Suite." >&2
          }
      - name: e2e-Bericht
        run: mise exec -- pnpm -C frontend exec playwright merge-reports --reporter html ./all-blob-reports
        continue-on-error: true
      # LAUFZEITEN DER e2e-ANTEILE (LFH-1117): die Anteile verteilen nach `frontend/e2e/laufzeiten.json`.
      # Hier entsteht dieselbe Tabelle aus diesem Lauf, als Artefakt `e2e-laufzeiten`; die
      # Zusammenfassung zeigt, wie die bisherige Tabelle unter den neuen Messwerten trägt. Liegt
      # der langsamste Anteil spürbar über dem Mittel, die Datei aus dem Artefakt einchecken.
      # Nur bei vier Blobs: ein Teilbericht ergäbe eine Tabelle ohne die fehlenden Dateien. Gezählt
      # nur `report-k.zip` auf oberster Ebene: der HTML-Bericht davor entpackt die Traces roter
      # Tests als `resources/*.zip` in dasselbe Verzeichnis.
      - name: e2e-Laufzeiten
        continue-on-error: true
        run: |
          set -euo pipefail
          [ "$(find frontend/all-blob-reports -maxdepth 1 -name 'report-*.zip' | wc -l | tr -d ' ')" -eq 4 ] || {
            echo "Nicht alle vier e2e-Blobs da: keine Laufzeittabelle."; exit 0; }
          mise exec -- pnpm -C frontend exec playwright merge-reports --reporter json ./all-blob-reports > e2e-bericht.json
          cp frontend/e2e/laufzeiten.json laufzeiten.json
          mise exec -- node scripts/e2e-anteile.mjs aktualisieren --aus e2e-bericht.json --nach laufzeiten.json \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('laufzeiten.json') != '' }}
        with:
          name: e2e-laufzeiten
          path: laufzeiten.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-versuch-${{ github.run_attempt }}
          path: frontend/playwright-report
          retention-days: 7
