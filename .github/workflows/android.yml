# Android-App (LLH-1989, Entwurf D9): den Tag auschecken, die Release-APK bauen und signieren
# (`scripts/android/release-apk.sh`, lokal genauso), ans versionierte Release hängen und die
# Update-Kanäle fortschreiben (`scripts/release/android-kanal.mjs`). Betrieb, Schlüssel und
# Geheimnisse: docs/betrieb/android-app.md.
#
# Zwei Auslöser, kein PR und kein Push (ADR-0048; dieselbe Form wie ios.yml):
#
# - `workflow_call` aus artefakte.yml (Job `android`), NACH der Freigabe jedes Tags der Kanäle
#   `alpha`, `beta` und `main`. Der Job steht in keinem `needs` von `freigeben`: ein roter Bau
#   oder fehlende Geheimnisse halten weder Release noch Deployment auf, es fehlt nur die APK
#   dieses Tags (wie `ios`).
# - `workflow_dispatch` als Handstart, etwa nachdem die Geheimnisse angelegt sind.
#
# Was wohin kommt (Entwurf D9):
#
# - Ans versionierte Release: `lifeline-hub-android-<version>.apk` und `.sha256`
#   (`scripts/android/apk-ablegen.sh`). Nie überschrieben: liegt die APK schon da (zweiter Bau
#   desselben Tags, andere Bauminute und damit andere sha256), bleiben Upload und Kanäle für
#   diesen Lauf aus, mit Hinweis.
# - In die Kanal-Releases `android-alpha`, `android-beta` und `android-stabil` (Vorabversion, nie
#   „latest“, Tag ohne `v`, damit semantic-release und pr-kommentare.mjs sie übergehen; beim
#   ersten Mal angelegt): `android.json` nur vorwärts, jeder Vorabkanal nur seine eigenen, stabile
#   alle drei; die feste `lifeline-hub-android.apk` (QR-Code an der Wand) ersetzen nur Tags des
#   eigenen Kanals, und auch sie nur vorwärts. Auch stabil hat ein eigenes Kanal-Release statt
#   `…/releases/latest/download/`: das neue Release wird „latest“, bevor seine APK gebaut ist,
#   dort stünde bis dahin (bei rotem Bau bis zum Nachbau) nichts (Kopf von android-kanal.mjs).
# - Ein Job je Kanal mit eigener Nebenläufigkeitsgruppe, damit zwei Releases einen Kanal nie
#   gleichzeitig schreiben. GitHub hält je Gruppe nur EINEN wartenden Job; kommt ein dritter
#   dazu, bricht es den wartenden ab (`cancel-in-progress: false` schützt nur den laufenden), und
#   das lässt sich nicht abstellen. Folge: ein Kanal kann einen Stand überspringen, bis zum
#   nächsten Release seines Kanals. Nachholen: „Re-run failed jobs“ am Lauf mit dem abgebrochenen
#   Job, solange seine Artefakte leben (7 Tage); ein Handstart hilft nicht, sein neuer Bau hat eine
#   andere sha256 und schreibt keinen Kanal. Ein Entwurf (Handstart vor der Freigabe) schreibt
#   keinen Kanal: seine Download-URLs erreichten nur Berechtigte.
# - Ein Tag außerhalb der drei Kanäle (etwa `-rc.1`) wird mit Hinweis übersprungen, nicht rot.
#
# Signiert wird mit EINEM Schlüssel für immer (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD); fehlt eins, wird der Job rot, es entsteht nie eine
# unsignierte APK am Release. Ohne Cache: der Release-Bau übernimmt nichts aus anderen Läufen.
#
# Alle Actions sind per Commit-SHA gepinnt (Tag im Kommentar), wie in pr.yml.
name: Android-App (APK)

on:
  workflow_call:
    inputs:
      tag:
        description: 'Freigegebener Release-Tag der Kanäle alpha, beta oder main (vorbereiten in artefakte.yml)'
        required: true
        type: string
      version:
        description: 'Version ohne v'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, dessen APK gebaut und abgelegt werden soll, z. B. v1.0.0-alpha.196, v1.0.0-beta.3 oder v1.0.0'
        required: true
        type: string

# Least privilege: nur die Jobs, die ans Release schreiben, bekommen `contents: write`.
permissions:
  contents: read

env:
  # Der Kotlin-Compiler legt Klassen mit Umlauten im Namen an; unter der Locale C scheitert das.
  LC_ALL: C.UTF-8

jobs:
  bauen:
    name: APK bauen und signieren
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      bauen: ${{ steps.pruefen.outputs.bauen }}
      version: ${{ steps.pruefen.outputs.version }}
      version_code: ${{ steps.apk.outputs.version_code }}
      sha256: ${{ steps.apk.outputs.sha256 }}
    # Je Tag ein Bau zur Zeit; ein zweiter wartet.
    concurrency:
      group: android-apk-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      # Bei einem Handstart ist der Tag freie Eingabe: erst gegen das Muster prüfen, dann an
      # `actions/checkout` geben. Eine andere Vorabkennung als alpha und beta gehört in keinen
      # Kanal: übersprungen mit Hinweis (release-apk.sh wiese sie ab).
      - name: Tag prüfen
        id: pruefen
        env:
          ROH_TAG: ${{ inputs.tag }}
          ROH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$ROH_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "FEHLER: '$ROH_TAG' ist kein zulässiger Release-Tag (erwartet: vX.Y.Z[-vorab])." >&2
            exit 1
          fi
          if [ -n "$ROH_VERSION" ] && [ "$ROH_VERSION" != "${ROH_TAG#v}" ]; then
            echo "FEHLER: Version '$ROH_VERSION' passt nicht zum Tag '$ROH_TAG'." >&2
            exit 1
          fi
          echo "version=${ROH_TAG#v}" >> "$GITHUB_OUTPUT"
          if ! printf '%s' "$ROH_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$'; then
            echo "::notice::$ROH_TAG gehört in keinen Android-Kanal (nur alpha, beta, main); keine APK."
            echo "bauen=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bauen=ja" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.pruefen.outputs.bauen == 'ja' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: JDK (vorinstalliert, Version aus sdk-version.sh)
        if: ${{ steps.pruefen.outputs.bauen == 'ja' }}
        run: ./scripts/android/jdk-waehlen.sh
      - name: Android-SDK ergänzen
        if: ${{ steps.pruefen.outputs.bauen == 'ja' }}
        run: ./scripts/android/sdk-installieren.sh
      - name: Bauen, signieren, prüfen
        if: ${{ steps.pruefen.outputs.bauen == 'ja' }}
        id: apk
        env:
          TAG: ${{ inputs.tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/android/release-apk.sh --tag "$TAG" --ausgabe "$RUNNER_TEMP/versand"
      - if: ${{ steps.pruefen.outputs.bauen == 'ja' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: ${{ runner.temp }}/versand/
          if-no-files-found: error
          retention-days: 7

  # Versioniertes Release: die APK nie überschreiben (apk-ablegen.sh). Danach das Manifest, das auf
  # sie zeigt, und die Kanäle, die dieses Release fortschreibt, als Liste für den Job `kanal`.
  ablegen:
    name: APK ans Release hängen
    needs: bauen
    if: ${{ needs.bauen.outputs.bauen == 'ja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      kanaele: ${{ steps.kanaele.outputs.kanaele }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.9.1
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: versand
      - name: APK ans Release hängen
        id: apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: ./scripts/android/apk-ablegen.sh --tag "$TAG" --versand versand
      - name: Manifest erzeugen
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.bauen.outputs.version }}
          VERSION_CODE: ${{ needs.bauen.outputs.version_code }}
          SHA256: ${{ needs.bauen.outputs.sha256 }}
        run: |
          set -euo pipefail
          mise exec -- node scripts/release/android-kanal.mjs --manifest --version "$VERSION" \
            --version-code "$VERSION_CODE" --sha256 "$SHA256" --repo "$GH_REPO" > versand/android.json
          cat versand/android.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-manifest
          path: versand/android.json
          if-no-files-found: error
          retention-days: 7
      # Welche Kanäle: Alpha → android-alpha, Beta → android-beta, stabil → alle drei. Ein Entwurf
      # und ein Lauf, der die APK nicht abgelegt hat, schreiben keinen. Erst die Ausgabe holen, dann
      # umformen: in einer Pipe ginge ein Fehler des Skripts verloren, und der Job meldete still
      # „kein Kanal“.
      - name: Kanäle bestimmen
        id: kanaele
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.bauen.outputs.version }}
          ABGELEGT: ${{ steps.apk.outputs.abgelegt }}
        run: |
          set -euo pipefail
          if [ "$ABGELEGT" != ja ]; then
            echo "::notice::Die APK dieses Laufs liegt nicht am Release $TAG, die Android-Kanäle bleiben."
            echo "kanaele=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::notice::$TAG ist nicht veröffentlicht, die Android-Kanäle bleiben."
            echo "kanaele=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ausgabe="$(mise exec -- node scripts/release/android-kanal.mjs --kanaele-fuer "$VERSION")"
          kanaele="$(jq -Rnc '[inputs | select(length > 0)]' <<< "$ausgabe")"
          echo "kanaele=$kanaele" >> "$GITHUB_OUTPUT"
          echo "Kanäle: $kanaele"

  kanal:
    name: Kanal ${{ matrix.kanal }} fortschreiben
    needs: [bauen, ablegen]
    if: ${{ needs.ablegen.outputs.kanaele != '' && needs.ablegen.outputs.kanaele != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        kanal: ${{ fromJSON(needs.ablegen.outputs.kanaele) }}
    # Je Kanal eine Gruppe für alle Läufe: zwei Releases schreiben einen Kanal nie gleichzeitig.
    concurrency:
      group: android-kanal-${{ matrix.kanal }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.9.1
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: android-*
          merge-multiple: true
          path: neu
      - name: Fortschreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          KANAL: ${{ matrix.kanal }}
          VERSION: ${{ needs.bauen.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf alt && mkdir -p alt
          if gh release view "$KANAL" > /dev/null 2>&1; then
            # Kein `|| true` ums Laden: ein Netzfehler hieße sonst „Kanal leer“ und könnte ihn
            # zurückdrehen.
            namen="$(gh release view "$KANAL" --json assets --jq '.assets[].name')"
            if grep -qx android.json <<< "$namen"; then
              gh release download "$KANAL" --pattern android.json --dir alt
            fi
          else
            case "$KANAL" in
              android-alpha) titel="Alpha"; tags="Alpha-Tags" ;;
              android-beta) titel="Beta"; tags="Beta-Tags" ;;
              android-stabil) titel="Stabil"; tags="stabile Releases" ;;
              *) echo "FEHLER: unbekannter Kanal $KANAL" >&2; exit 1 ;;
            esac
            gh release create "$KANAL" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Android-App: Kanal $titel" \
              --notes "Update-Manifest und APK für Android-Apps im Kanal $titel (LLH-1989). android.json wird bei jeder Freigabe fortgeschrieben und zeigt auf die APK am versionierten Release; lifeline-hub-android.apk ersetzen nur neuere $tags."
          fi
          # Beide Entscheidungen gegen den Stand VOR dem Hochladen (`alt/`). Die feste APK: nur ein
          # Tag desselben Kanals (in Alpha und Beta nie ein stabiles), und nur vorwärts wie das
          # Manifest.
          apk="$(mise exec -- node scripts/release/android-kanal.mjs --apk-ersetzen "$KANAL" --neu neu/android.json --alt alt/android.json)"
          entscheidung="$(mise exec -- node scripts/release/android-kanal.mjs --kanal "$KANAL" --neu neu/android.json --alt alt/android.json)"
          if [ "$apk" = "ja" ]; then
            cp "neu/lifeline-hub-android-$VERSION.apk" neu/lifeline-hub-android.apk
            gh release upload "$KANAL" neu/lifeline-hub-android.apk --clobber
            echo "::notice::$KANAL: lifeline-hub-android.apk ist $VERSION."
          fi
          if [ "$entscheidung" = "hochladen" ]; then
            gh release upload "$KANAL" neu/android.json --clobber
            echo "::notice::$KANAL zeigt auf $TAG."
          fi
