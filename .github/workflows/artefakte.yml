# Release-Artefakte — vier Binaries, zwei Container-Abbilder (lifeline-hub und
# karten-service), bei Alpha-Releases danach ein GitHub-Deployment. Dazu die Desktop-Hülle
# (LFH-721, desktop.yml): Pakete für macOS arm64 und Windows x64 plus das Update-Manifest
# latest.json. Stabile Hüllen lesen es über …/releases/latest/download/, Alpha-Hüllen über den
# Alpha-Kanal …/releases/download/desktop-alpha/ (LLH-1280, Job `desktop-kanal`). Bei stabilen
# Tags entsteht die Hülle vor der Freigabe und hält sie bei rotem Bau auf, bei Alpha-Tags erst
# danach, ohne Release oder Deployment aufzuhalten.
#
# EIN RELEASE WIRD ERST HIER VERÖFFENTLICHT (LFH-1054). semantic-release legt es als Entwurf an
# und startet diesen Workflow mit `freigeben: true` (letzter Schritt in release.yml). Der Job
# `freigeben` veröffentlicht nur, wenn ALLE Bau-, Smoke-, Abbild- und Upload-Jobs grün sind;
# danach `latest` an den Abbildern, PR-Kommentare und das Deployment. Bleibt ein Job rot, bleibt
# das Release Entwurf, Tag und Versions-Commit bleiben, die Nummer ist verbraucht. Nach einer
# vorübergehenden Störung (Runner, Apple) führt „Re-run failed jobs“ bis zur Veröffentlichung.
#
# Eigener Lauf statt Teil des Release-Laufs: so lassen sich die Artefakte eines bestehenden
# Releases per workflow_dispatch nachbauen, ohne die Version neu zu ermitteln, und der bis zu
# 90 Minuten lange Bau hält die Nebenläufigkeitsgruppe der CI nicht fest. Ein Nachbau ohne
# `freigeben` veröffentlicht nichts und rollt nichts aus.
#
# Die Windows-Binary entsteht als CROSS-BUILD auf dem Linux-Runner (MinGW-w64); die .exe
# linkt nur gegen Windows-System-DLLs. Der Windows-Runner trägt stattdessen den Smoke-Test —
# er belegt, dass die Datei auf der Zielplattform startet.
name: Artefakte

# KEIN `release: published` mehr: ein Entwurf löst kein Ereignis aus, und das Veröffentlichen
# übernimmt dieser Workflow selbst.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, dessen Artefakte (neu) gebaut werden sollen, z. B. v0.2.0'
        required: true
        type: string
      freigeben:
        description: 'Nach grünem Bau veröffentlichen, kommentieren und (alpha) ausrollen — setzt release.yml; von Hand nur für einen liegengebliebenen Entwurf'
        required: false
        type: boolean
        default: false
      desktop:
        description: 'Desktop-Hülle bei einer Vorabversion schon vor der Freigabe bauen (Nachbau eines Alpha-Releases)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: artefakte-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Ein eigener Job nur fürs Prüfen und Zerlegen des Tags: er fließt unten in das `ref` von
  # `actions/checkout` und in Dateinamen, und bei workflow_dispatch ist er freie Eingabe. Erst
  # gegen ein festes Muster prüfen, dann verwenden — nie roh in ein `run:` interpolieren.
  vorbereiten:
    name: Tag prüfen
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pruefen.outputs.tag }}
      version: ${{ steps.pruefen.outputs.version }}
      desktop: ${{ steps.pruefen.outputs.desktop }}
      vorab: ${{ steps.pruefen.outputs.vorab }}
    steps:
      - id: pruefen
        env:
          ROH_TAG: ${{ inputs.tag }}
          DESKTOP_ERZWUNGEN: ${{ inputs.desktop || false }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$ROH_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "FEHLER: '$ROH_TAG' ist kein zulässiger Release-Tag (erwartet: vX.Y.Z[-vorab])." >&2
            exit 1
          fi
          echo "tag=$ROH_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${ROH_TAG#v}" >> "$GITHUB_OUTPUT"
          # Vorabversion ja/nein am Tag, nicht an github.event.release.prerelease: Ereignis gibt
          # es keins mehr (LFH-1054), und beim Dispatch war es schon immer leer.
          if [ "${ROH_TAG#*-}" = "$ROH_TAG" ]; then
            echo "vorab=false" >> "$GITHUB_OUTPUT"
          else
            echo "vorab=true" >> "$GITHUB_OUTPUT"
          fi
          # `desktop`: Hülle VOR der Freigabe bauen — bei einem Tag ohne Vorabkennung oder per
          # Dispatch ausdrücklich. Alpha-Tags bauen sie sonst danach (Job `desktop-alpha`,
          # LLH-1280).
          if [ "${ROH_TAG#*-}" = "$ROH_TAG" ] || [ "$DESKTOP_ERZWUNGEN" = "true" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  bauen:
    name: ${{ matrix.name }}
    needs: vorbereiten
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sbom: true
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runs-on: ubuntu-latest
            target: x86_64-pc-windows-gnu
            mingw: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}

      - name: System-Werkzeuge (Linux)
        if: runner.os == 'Linux'
        # Über das Skript: Frist und Wiederholung gegen einen hängenden Spiegel (LFH-1101).
        run: ./scripts/apt-pakete.sh nasm

      - name: MinGW-Toolchain für den Windows-Cross-Build
        if: matrix.mingw
        run: ./scripts/apt-pakete.sh gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: System-Werkzeuge (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Rust-Toolchain (stable, Ziel ${{ matrix.target }})
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: artefakt-${{ matrix.target }}

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.1
          cache: true

      # Nur einmal: der Cargo-Graph ist über alle Targets derselbe.
      - name: SBOM-Werkzeuge
        if: matrix.sbom
        # Beide Versionen exakt gepinnt: ein Werkzeug unter einem `^`-Bereich bricht den Lauf
        # irgendwann an der teuersten Stelle. cdxgen statt cyclonedx-npm (Begründung in
        # scripts/build-release.sh).
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.7
          mise exec -- npm install -g @cyclonedx/cdxgen@11.11.0
          # Der PATH-Eintrag ist Teil der Installation: `npm -g` legt die Binary unter mises
          # Node-Verzeichnis ab, und build-release.sh findet sie per `command -v cdxgen` —
          # sonst bräche der Lauf erst am SBOM_PFLICHT-Gate mit einer falschen Ursache. Ein
          # nacktes `npm`/`node` ist hier nicht zugesichert, deshalb `mise exec`.
          echo "$(mise exec -- npm prefix -g)/bin" >> "$GITHUB_PATH"

      - name: Bauen
        env:
          # Nur für den Cross-Build gesetzt; auf den nativen Runnern sind die Variablen leer.
          # Eine committete .cargo/config.toml bräche lokale Builds ohne MinGW.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: ${{ matrix.mingw && 'x86_64-w64-mingw32-gcc' || '' }}
          CC_x86_64_pc_windows_gnu: ${{ matrix.mingw && 'x86_64-w64-mingw32-gcc' || '' }}
          CXX_x86_64_pc_windows_gnu: ${{ matrix.mingw && 'x86_64-w64-mingw32-g++' || '' }}
          AR_x86_64_pc_windows_gnu: ${{ matrix.mingw && 'x86_64-w64-mingw32-ar' || '' }}
          # Nur der Matrix-Eintrag, der die Stückliste ausliefert, bricht bei unvollständigem
          # SBOM; auf den anderen Runnern fehlen die Werkzeuge, dort zu brechen nähme dem
          # Release seine Binaries.
          SBOM_PFLICHT: ${{ matrix.sbom && '1' || '' }}
        run: ./scripts/build-release.sh --target ${{ matrix.target }}

      # Der karten-service läuft nur auf Servern, nicht im ELW — deshalb nur die Linux-Ziele.
      # Er bettet kein Frontend ein; ein nacktes `cargo build` teilt sich den Cache.
      - name: karten-service bauen
        if: runner.os == 'Linux' && !matrix.mingw
        run: cargo build --release -p karten-service --target ${{ matrix.target }}

      - name: Artefakt einsammeln
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
          ZIEL: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
          SBOM: ${{ matrix.sbom && '1' || '' }}
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --format-version 1 --no-deps | mise exec -- node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).target_directory')"
          ausgabe="$target_dir/$ZIEL/release"
          mkdir -p versand
          case "$ZIEL" in
            *windows*) cp "$ausgabe/lifeline-hub.exe" "versand/lifeline-hub-$VERSION-$ZIEL.exe" ;;
            *)         cp "$ausgabe/lifeline-hub"     "versand/lifeline-hub-$VERSION-$ZIEL" ;;
          esac
          case "$ZIEL" in
            *linux*) cp "$ausgabe/karten-service" "versand/karten-service-$VERSION-$ZIEL" ;;
          esac
          # NUR der SBOM-Eintrag der Matrix packt ein Zip, und nur mit geprüftem INHALT:
          # `[ -d … ]` kann nicht rot werden (build-release.sh legt das Verzeichnis selbst an),
          # und packten alle Runner ein gleichnamiges Zip, entschiede die Upload-Reihenfolge.
          if [ -n "$SBOM" ]; then
            [ -n "$(find "$ausgabe/sbom" -name '*.cdx.json' -print -quit)" ] \
              || { echo "FEHLER: keine Cargo-Stückliste (*.cdx.json) im SBOM." >&2; exit 1; }
            [ -s "$ausgabe/sbom/bom-frontend.json" ] \
              || { echo "FEHLER: keine Frontend-Stückliste (bom-frontend.json) im SBOM." >&2; exit 1; }
            ( cd "$ausgabe" && zip -r - sbom ) > "versand/lifeline-hub-$VERSION-sbom.zip"
          fi
          ( cd versand && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done )
          ls -lh versand

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versand-${{ matrix.name }}
          path: versand/
          retention-days: 7

  # Der Beleg, dass die cross-gebaute Datei auf der Zielplattform wirklich läuft. `--help`
  # prüft nur den Start; `sqlite-version` lädt zusätzlich das eingebackene SQLite und
  # liefert genau die Zahl, die build-release.sh im Cross-Build nicht ermitteln konnte.
  windows-smoke:
    name: Windows-Smoke-Test
    needs: [vorbereiten, bauen]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: versand-windows-x86_64
          path: versand

      - name: Starten und Version lesen
        shell: bash
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          exe="versand/lifeline-hub-$VERSION-x86_64-pc-windows-gnu.exe"
          "$exe" --help > /dev/null
          version="$("$exe" sqlite-version)"
          echo "eingebettetes SQLite: $version"
          # Leere Ausgabe hieße: gestartet, aber die statisch gelinkte Bibliothek antwortet
          # nicht — genau der stille Fehlschlag, den ein reiner Exit-Code-Test durchließe.
          [ -n "$version" ] || { echo "FEHLER: sqlite-version lieferte nichts." >&2; exit 1; }

  veroeffentlichen:
    name: Ans Release hängen
    needs: [vorbereiten, bauen, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: versand-*
          merge-multiple: true
          path: versand

      # Hinweis und Quelltext der LGPL-Bibliotheken im Binary (HEIC-Decoder, LFH-1000): neben
      # die Binaries, damit die Quelle so lange verfügbar bleibt wie das Release. Die Stände
      # stehen gepinnt in scripts/release/drittanbieter-quellen.txt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}
          path: quelle
          sparse-checkout: |
            scripts/release
            frontend/public/lizenzen
          persist-credentials: false

      - name: Drittanbieter-Hinweis und Quellen
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          # Ein Release von vor LFH-1000 (Nachbau per workflow_dispatch) kennt das Skript nicht
          # und trägt auch den Decoder nicht austauschbar; die Binaries gehen trotzdem hoch.
          if [ ! -x quelle/scripts/release/drittanbieter-quellen.sh ]; then
            echo "::notice::Tag ohne drittanbieter-quellen.sh, Schritt übersprungen."
            exit 0
          fi
          quelle/scripts/release/drittanbieter-quellen.sh versand "$VERSION"
          ( cd versand && for f in lifeline-hub-"$VERSION"-DRITTANBIETER.txt lifeline-hub-"$VERSION"-drittanbieter.zip; do
              shasum -a 256 "$f" > "$f.sha256"
            done )

      # Die Lizenz neben die Binaries (LLH-1446). Ein Tag von davor hat keine LICENSE.
      - name: Lizenz
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f quelle/LICENSE ]; then
            echo "::notice::Tag ohne LICENSE, Schritt übersprungen."
            exit 0
          fi
          cp quelle/LICENSE "versand/lifeline-hub-$VERSION-LIZENZ.txt"
          ( cd versand && shasum -a 256 "lifeline-hub-$VERSION-LIZENZ.txt" > "lifeline-hub-$VERSION-LIZENZ.txt.sha256" )

      - name: Hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.vorbereiten.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lh versand
          gh release upload "$TAG" versand/* --clobber

  # ── Desktop-Hülle (LFH-721, Bau in desktop.yml) ──────────────────────────────────────
  # Hängt nur an `vorbereiten`, nie an `bauen` — ein roter Server-Build hält den Bau der Hülle
  # nicht auf und umgekehrt. Stabile Tags (und Prüfläufe mit `desktop: true`) bauen VOR der
  # Freigabe, ein roter Bau hält die Veröffentlichung auf (Job `freigeben`).
  desktop:
    name: Desktop-Hülle
    needs: vorbereiten
    if: needs.vorbereiten.outputs.desktop == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.vorbereiten.outputs.tag }}
      version: ${{ needs.vorbereiten.outputs.version }}
    secrets: inherit

  # Alpha-Kanal (LLH-1280): Alpha-Tags bauen die Hülle erst NACH der Freigabe ans schon
  # veröffentlichte Release. Bau und Notarisierung dauern länger als die Server-Artefakte und
  # hängen an Apple; so verzögern sie weder Veröffentlichung noch Deployment, und ein roter Bau
  # kostet nur die Desktop-App dieses Releases. Nur aus release.yml (`freigeben`), ein Nachbau
  # baut die Hülle über `desktop: true` vor der (dann ausbleibenden) Freigabe.
  desktop-alpha:
    name: Desktop-Hülle (Alpha-Kanal)
    needs: [vorbereiten, freigeben]
    if: >-
      ${{ !cancelled() && inputs.freigeben
      && needs.freigeben.result == 'success'
      && needs.vorbereiten.outputs.vorab == 'true'
      && needs.vorbereiten.outputs.desktop != 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.vorbereiten.outputs.tag }}
      version: ${{ needs.vorbereiten.outputs.version }}
    secrets: inherit

  docker:
    name: Container-Abbild
    needs: [vorbereiten, bauen]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: versand-linux-*
          merge-multiple: true
          path: versand

      # Das Dockerfile erwartet dist/linux-<TARGETARCH>/lifeline-hub — TARGETARCH ist Dockers
      # Schreibweise (amd64/arm64), nicht die Rust-Triple-Schreibweise.
      - name: Kontext für das Abbild bauen
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/linux-amd64 dist/linux-arm64
          cp "versand/lifeline-hub-$VERSION-x86_64-unknown-linux-gnu" dist/linux-amd64/lifeline-hub
          cp "versand/lifeline-hub-$VERSION-aarch64-unknown-linux-gnu" dist/linux-arm64/lifeline-hub
          chmod +x dist/linux-*/lifeline-hub

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nur die Version: `latest` (das zieht ein `docker pull` ohne Angabe) setzt erst der Job
      # `freigeben`, wenn das stabile Release wirklich veröffentlicht ist (LFH-1054).
      - name: Abbild-Tag bestimmen
        id: tags
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      # Startet das Abbild überhaupt? Ein gepushtes, aber nicht startfähiges Abbild (etwa
      # glibc-Versatz, siehe Dockerfile) fiele sonst erst beim Ausrollen auf. Rot hier hält auch
      # das Deployment auf.
      - name: Starttest (amd64)
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          version="$(docker run --rm --platform linux/amd64 "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" sqlite-version)"
          echo "eingebettetes SQLite: $version"
          [ -n "$version" ] || { echo "FEHLER: Abbild startet, liefert aber keine SQLite-Version." >&2; exit 1; }
          # Die Lizenz kommt aus dem Binary, nicht aus einer zweiten Kopie (LLH-1446).
          docker run --rm --platform linux/amd64 "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" lizenz | cmp - LICENSE \
            || { echo "FEHLER: \`lizenz\` im Abbild weicht von LICENSE ab." >&2; exit 1; }

  # Zweites Abbild, selbes Muster wie `docker` oben: fertige Binaries, kein Build aus Quelle.
  # Eigener Job statt eines weiteren Schritts dort, damit ein Fehler hier das Hauptabbild
  # nicht mitreißt — ohne karten-service läuft lifeline-hub weiter, nur ohne Kartenbau.
  docker-karten:
    name: Container-Abbild karten-service
    needs: [vorbereiten, bauen]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: versand-linux-*
          merge-multiple: true
          path: versand

      - name: Kontext für das Abbild bauen
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/linux-amd64 dist/linux-arm64
          cp "versand/karten-service-$VERSION-x86_64-unknown-linux-gnu" dist/linux-amd64/karten-service
          cp "versand/karten-service-$VERSION-aarch64-unknown-linux-gnu" dist/linux-arm64/karten-service
          chmod +x dist/linux-*/karten-service

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Wie beim Hauptabbild: `latest` erst nach der Freigabe.
      - name: Abbild-Tag bestimmen
        id: tags
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: echo "tags=ghcr.io/${GITHUB_REPOSITORY,,}-karten-service:$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: karten-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      # Wie beim Hauptabbild: startet es, und sind die Werkzeuge da, die der Runner aufruft?
      - name: Starttest (amd64)
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          bild="ghcr.io/${GITHUB_REPOSITORY,,}-karten-service:$VERSION"
          docker run --rm --platform linux/amd64 "$bild" --help > /dev/null
          docker run --rm --platform linux/amd64 --entrypoint sh "$bild" -c 'docker --version && make --version > /dev/null && sqlite3 --version > /dev/null'

  # ── Freigabe (LFH-1054) ───────────────────────────────────────────────────────────
  # Der einzige Weg zu einem veröffentlichten Release. `!cancelled()` plus Einzelprüfung statt
  # der Vorgabe „alle needs grün“, weil `desktop` bei Vorabversionen `skipped` ist. `desktop`
  # ist der ganze Aufruf von desktop.yml: fehlt eine Plattform, ist er rot, auch wenn das
  # Teilmanifest schon am Entwurf hängt.
  # Jeder Schritt ist wiederholbar: schon veröffentlicht, `latest` schon gesetzt, Kommentar schon
  # da — alles kein Fehler.
  freigeben:
    name: Release freigeben
    needs: [vorbereiten, bauen, windows-smoke, veroeffentlichen, desktop, docker, docker-karten]
    if: >-
      ${{ !cancelled() && inputs.freigeben
      && needs.vorbereiten.result == 'success'
      && needs.bauen.result == 'success'
      && needs.windows-smoke.result == 'success'
      && needs.veroeffentlichen.result == 'success'
      && needs.docker.result == 'success'
      && needs.docker-karten.result == 'success'
      && (needs.vorbereiten.outputs.desktop != 'true' || needs.desktop.result == 'success') }}
    runs-on: ubuntu-latest
    # Das erste stabile Release kommentiert die ganze Historie; die Kommentare laufen der Reihe
    # nach und warten bei GitHubs Ratenbegrenzung.
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.vorbereiten.outputs.tag }}
          VORAB: ${{ needs.vorbereiten.outputs.vorab }}
        run: |
          set -euo pipefail
          # `gh release view/edit` finden einen Entwurf über sein ausstehendes Tag.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::notice::$TAG ist schon veröffentlicht."
            exit 0
          fi
          # `--latest` ausdrücklich: für frisch veröffentlichte Releases nimmt GitHub sonst
          # „latest“ an, und an `releases/latest/download/latest.json` hängt der Desktop-Updater.
          if [ "$VORAB" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          echo "::notice::$TAG veröffentlicht."

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: needs.vorbereiten.outputs.vorab != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.vorbereiten.outputs.vorab != 'true'

      # Ein Prerelease darf `latest` nie übernehmen. Umgehängt wird das Manifest der Version,
      # nichts wird neu gebaut — beide Architekturen, Provenance und SBOM bleiben dieselben.
      - name: Abbilder als latest markieren
        if: needs.vorbereiten.outputs.vorab != 'true'
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          for bild in "ghcr.io/${GITHUB_REPOSITORY,,}" "ghcr.io/${GITHUB_REPOSITORY,,}-karten-service"; do
            docker buildx imagetools create --tag "$bild:latest" "$bild:$VERSION"
          done

      # Volle Historie: das Skript rechnet den Commit-Bereich seit dem letzten veröffentlichten
      # Release desselben Kanals mit `git rev-list`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.1
          cache: true

      # Fehler hier machen den Job nicht rot (das Release steht schon), sie stehen als Warnung im
      # Protokoll. Begründung und Rechnung im Kopf von scripts/release/pr-kommentare.mjs.
      - name: Enthaltene Pull Requests kommentieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.vorbereiten.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/release/pr-kommentare.mjs ]; then
            echo "::notice::Tag ohne pr-kommentare.mjs, Schritt übersprungen."
            exit 0
          fi
          mise exec -- node scripts/release/pr-kommentare.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY"

  # Alpha-Releases gehen ohne Handgriff auf den Server. Dieser Job legt nur das
  # GitHub-Deployment an; ausgerollt wird von einem Pull-Agenten auf dem Server (Begründung im
  # Kopf von deployment.yml). Erst nach der Freigabe, und nur, wenn release.yml den Lauf
  # gestartet hat (oder jemand ausdrücklich `freigeben` setzt): ein Nachbau soll nicht nebenbei
  # ein älteres Release ausrollen.
  #
  # `!cancelled()` plus `needs.freigeben.result` statt der Vorgabe `success()`: die prüft ALLE
  # Vorgänger bis zur Wurzel, nicht nur `needs`. Bei Vorabversionen ist `desktop`
  # `skipped`, und `freigeben` hängt daran — mit der Vorgabe fiel das Deployment still aus,
  # obwohl `freigeben` grün war (alpha.99 und alpha.100, LFH-1137).
  deployment:
    name: Deployment alpha anlegen
    needs: [vorbereiten, freigeben]
    if: >-
      ${{ !cancelled() && inputs.freigeben
      && needs.freigeben.result == 'success'
      && contains(needs.vorbereiten.outputs.tag, '-alpha.') }}
    permissions:
      deployments: write
    uses: ./.github/workflows/deployment.yml
    with:
      tag: ${{ needs.vorbereiten.outputs.tag }}

  # ── Alpha-Kanal der Desktop-Hülle (LLH-1280) ─────────────────────────────────────────
  # Hüllen mit einer Vorabversion lesen `releases/download/desktop-alpha/latest.json`
  # (src-tauri/src/update.rs), stabile weiter `releases/latest/download/latest.json`. Dieser Job
  # schreibt den Kanal fort, sobald ein Release mit Desktop-Paketen veröffentlicht ist, auch ein
  # stabiles. Nur vorwärts und nur vollständig (scripts/release/desktop-kanal.mjs). Das Release
  # `desktop-alpha` legt er beim ersten Mal selbst an: Vorabversion, nie „latest“, Tag ohne `v`,
  # damit semantic-release und pr-kommentare.mjs es übergehen. Eine Gruppe für alle Läufe, damit
  # zwei Releases den Kanal nicht gleichzeitig schreiben.
  desktop-kanal:
    name: Alpha-Kanal der Desktop-Hülle fortschreiben
    needs: [vorbereiten, freigeben, desktop, desktop-alpha]
    if: >-
      ${{ !cancelled()
      && (needs.desktop.result == 'success' || needs.desktop-alpha.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: desktop-kanal
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.1
          cache: true

      - name: Fortschreiben
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.vorbereiten.outputs.tag }}
          KANAL: desktop-alpha
        run: |
          set -euo pipefail
          # Ein Entwurf (Nachbau ohne Freigabe, rote Freigabe) hat Download-URLs, die nur
          # Berechtigte erreichen; der Kanal zeigte für alle anderen ins Leere.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "::notice::$TAG ist nicht veröffentlicht, der Alpha-Kanal bleibt."
            exit 0
          fi
          mkdir -p neu kanal
          gh release download "$TAG" --pattern latest.json --dir neu
          if gh release view "$KANAL" > /dev/null 2>&1; then
            # Kein `|| true` ums Laden: ein Netzfehler hieße sonst „Kanal leer“ und könnte ihn
            # zurückdrehen.
            if gh release view "$KANAL" --json assets --jq '.assets[].name' | grep -qx latest.json; then
              gh release download "$KANAL" --pattern latest.json --dir kanal
            fi
          else
            gh release create "$KANAL" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Desktop-App: Alpha-Kanal" \
              --notes "Update-Manifest für Desktop-Apps mit Vorabversion (LLH-1280). Die Pakete liegen am jeweiligen Release; dieses Release trägt nur latest.json und wird bei jeder Freigabe fortgeschrieben."
          fi
          entscheidung="$(mise exec -- node scripts/release/desktop-kanal.mjs --neu neu/latest.json --alt kanal/latest.json)"
          if [ "$entscheidung" = "hochladen" ]; then
            gh release upload "$KANAL" neu/latest.json --clobber
            echo "::notice::Alpha-Kanal zeigt auf $TAG."
          fi
