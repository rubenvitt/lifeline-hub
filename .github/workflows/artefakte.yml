# Release-Artefakte — vier Binaries, zwei Container-Abbilder (lifeline-hub und
# karten-service), bei Alpha-Releases danach ein GitHub-Deployment. Bei STABILEN Releases
# zusätzlich die Desktop-Hülle (LFH-721): Pakete für macOS arm64 und Windows x64 plus das
# Update-Manifest latest.json, das installierte Hüllen über …/releases/latest/download/ lesen.
#
# Hängt am fertigen Release, nicht am Release-Lauf: so lassen sich die Artefakte eines
# bestehenden Releases per workflow_dispatch nachbauen, ohne die Version neu zu ermitteln.
#
# Die Windows-Binary entsteht als CROSS-BUILD auf dem Linux-Runner (MinGW-w64); die .exe
# linkt nur gegen Windows-System-DLLs. Der Windows-Runner trägt stattdessen den Smoke-Test —
# er belegt, dass die Datei auf der Zielplattform startet.
name: Artefakte

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, dessen Artefakte (neu) gebaut werden sollen, z. B. v0.2.0'
        required: true
        type: string
      desktop:
        description: 'Desktop-Hülle auch für eine Vorabversion bauen (Prüflauf vor dem ersten stabilen Release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: artefakte-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Ein eigener Job nur fürs Prüfen und Zerlegen des Tags: er fließt unten in das `ref` von
  # `actions/checkout` und in Dateinamen, und bei workflow_dispatch ist er freie Eingabe. Erst
  # gegen ein festes Muster prüfen, dann verwenden — nie roh in ein `run:` interpolieren.
  vorbereiten:
    name: Tag prüfen
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pruefen.outputs.tag }}
      version: ${{ steps.pruefen.outputs.version }}
      desktop: ${{ steps.pruefen.outputs.desktop }}
    steps:
      - id: pruefen
        env:
          ROH_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DESKTOP_ERZWUNGEN: ${{ inputs.desktop || false }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$ROH_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "FEHLER: '$ROH_TAG' ist kein zulässiger Release-Tag (erwartet: vX.Y.Z[-vorab])." >&2
            exit 1
          fi
          echo "tag=$ROH_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${ROH_TAG#v}" >> "$GITHUB_OUTPUT"
          # Die Desktop-Hülle hat EINEN Kanal, den stabilen (Entscheidung 25.09.2026): gebaut
          # wird bei einem Tag ohne Vorabkennung — oder per Dispatch ausdrücklich. Bewusst am
          # Tag entschieden, nicht an github.event.release.prerelease: das ist beim Dispatch leer.
          if [ "${ROH_TAG#*-}" = "$ROH_TAG" ] || [ "$DESKTOP_ERZWUNGEN" = "true" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  bauen:
    name: ${{ matrix.name }}
    needs: vorbereiten
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sbom: true
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            runs-on: ubuntu-latest
            target: x86_64-pc-windows-gnu
            mingw: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}

      - name: System-Werkzeuge (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nasm

      - name: MinGW-Toolchain für den Windows-Cross-Build
        if: matrix.mingw
        run: sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: System-Werkzeuge (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Rust-Toolchain (stable, Ziel ${{ matrix.target }})
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: artefakt-${{ matrix.target }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          cache: true

      # Nur einmal: der Cargo-Graph ist über alle Targets derselbe.
      - name: SBOM-Werkzeuge
        if: matrix.sbom
        # Beide Versionen exakt gepinnt: ein Werkzeug unter einem `^`-Bereich bricht den Lauf
        # irgendwann an der teuersten Stelle. cdxgen statt cyclonedx-npm (Begründung in
        # scripts/build-release.sh).
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.7
          mise exec -- npm install -g @cyclonedx/cdxgen@11.11.0
          # Der PATH-Eintrag ist Teil der Installation: `npm -g` legt die Binary unter mises
          # Node-Verzeichnis ab, und build-release.sh findet sie per `command -v cdxgen` —
          # sonst bräche der Lauf erst am SBOM_PFLICHT-Gate mit einer falschen Ursache. Ein
          # nacktes `npm`/`node` ist hier nicht zugesichert, deshalb `mise exec`.
          echo "$(mise exec -- npm prefix -g)/bin" >> "$GITHUB_PATH"

      - name: Bauen
        env:
          # Nur für den Cross-Build gesetzt; auf den nativen Runnern sind die Variablen leer.
          # Eine committete .cargo/config.toml bräche lokale Builds ohne MinGW.
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: ${{ matrix.mingw && 'x86_64-w64-mingw32-gcc' || '' }}
          CC_x86_64_pc_windows_gnu: ${{ matrix.mingw && 'x86_64-w64-mingw32-gcc' || '' }}
          CXX_x86_64_pc_windows_gnu: ${{ matrix.mingw && 'x86_64-w64-mingw32-g++' || '' }}
          AR_x86_64_pc_windows_gnu: ${{ matrix.mingw && 'x86_64-w64-mingw32-ar' || '' }}
          # Nur der Matrix-Eintrag, der die Stückliste ausliefert, bricht bei unvollständigem
          # SBOM; auf den anderen Runnern fehlen die Werkzeuge, dort zu brechen nähme dem
          # Release seine Binaries.
          SBOM_PFLICHT: ${{ matrix.sbom && '1' || '' }}
        run: ./scripts/build-release.sh --target ${{ matrix.target }}

      # Der karten-service läuft nur auf Servern, nicht im ELW — deshalb nur die Linux-Ziele.
      # Er bettet kein Frontend ein; ein nacktes `cargo build` teilt sich den Cache.
      - name: karten-service bauen
        if: runner.os == 'Linux' && !matrix.mingw
        run: cargo build --release -p karten-service --target ${{ matrix.target }}

      - name: Artefakt einsammeln
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
          ZIEL: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
          SBOM: ${{ matrix.sbom && '1' || '' }}
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --format-version 1 --no-deps | mise exec -- node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).target_directory')"
          ausgabe="$target_dir/$ZIEL/release"
          mkdir -p versand
          case "$ZIEL" in
            *windows*) cp "$ausgabe/lifeline-hub.exe" "versand/lifeline-hub-$VERSION-$ZIEL.exe" ;;
            *)         cp "$ausgabe/lifeline-hub"     "versand/lifeline-hub-$VERSION-$ZIEL" ;;
          esac
          case "$ZIEL" in
            *linux*) cp "$ausgabe/karten-service" "versand/karten-service-$VERSION-$ZIEL" ;;
          esac
          # NUR der SBOM-Eintrag der Matrix packt ein Zip, und nur mit geprüftem INHALT:
          # `[ -d … ]` kann nicht rot werden (build-release.sh legt das Verzeichnis selbst an),
          # und packten alle Runner ein gleichnamiges Zip, entschiede die Upload-Reihenfolge.
          if [ -n "$SBOM" ]; then
            [ -n "$(find "$ausgabe/sbom" -name '*.cdx.json' -print -quit)" ] \
              || { echo "FEHLER: keine Cargo-Stückliste (*.cdx.json) im SBOM." >&2; exit 1; }
            [ -s "$ausgabe/sbom/bom-frontend.json" ] \
              || { echo "FEHLER: keine Frontend-Stückliste (bom-frontend.json) im SBOM." >&2; exit 1; }
            ( cd "$ausgabe" && zip -r - sbom ) > "versand/lifeline-hub-$VERSION-sbom.zip"
          fi
          ( cd versand && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done )
          ls -lh versand

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: versand-${{ matrix.name }}
          path: versand/
          retention-days: 7

  # Der Beleg, dass die cross-gebaute Datei auf der Zielplattform wirklich läuft. `--help`
  # prüft nur den Start; `sqlite-version` lädt zusätzlich das eingebackene SQLite und
  # liefert genau die Zahl, die build-release.sh im Cross-Build nicht ermitteln konnte.
  windows-smoke:
    name: Windows-Smoke-Test
    needs: [vorbereiten, bauen]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: versand-windows-x86_64
          path: versand

      - name: Starten und Version lesen
        shell: bash
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          exe="versand/lifeline-hub-$VERSION-x86_64-pc-windows-gnu.exe"
          "$exe" --help > /dev/null
          version="$("$exe" sqlite-version)"
          echo "eingebettetes SQLite: $version"
          # Leere Ausgabe hieße: gestartet, aber die statisch gelinkte Bibliothek antwortet
          # nicht — genau der stille Fehlschlag, den ein reiner Exit-Code-Test durchließe.
          [ -n "$version" ] || { echo "FEHLER: sqlite-version lieferte nichts." >&2; exit 1; }

  veroeffentlichen:
    name: Ans Release hängen
    needs: [vorbereiten, bauen, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: versand-*
          merge-multiple: true
          path: versand

      - name: Hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.vorbereiten.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lh versand
          gh release upload "$TAG" versand/* --clobber

  # ── Desktop-Hülle (LFH-721) ─────────────────────────────────────────────────────────
  # Nativ je Plattform: die NSIS-Bündelung und WebView2 laufen auf dem Windows-Runner, nicht
  # als Cross-Build wie die Server-Binary. Hängt nur an `vorbereiten`, nie an `bauen` — ein
  # roter Server-Build hält die Hülle nicht auf und umgekehrt. Kein MSI: MSI nimmt keine
  # Vorabversion an, und Prüfläufe per Dispatch tragen eine.
  desktop:
    name: ${{ matrix.name }}
    needs: vorbereiten
    if: needs.vorbereiten.outputs.desktop == 'true'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop-macos-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: desktop-windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}

      - name: Rust-Toolchain (stable, Ziel ${{ matrix.target }})
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-${{ matrix.target }}

      # Gepinnt wie cargo-cyclonedx; dieselbe Minor wie die tauri-Crate in src-tauri/Cargo.toml.
      - name: Tauri-CLI
        run: |
          cargo tauri --version 2>/dev/null | grep -qx 'tauri-cli 2.12.0' \
            || cargo install tauri-cli --locked --version 2.12.0

      - name: Bauen
        working-directory: src-tauri
        env:
          # Ohne den privaten Schlüssel entstehen keine .sig-Dateien und damit kein Update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.vorbereiten.outputs.version }}
          ZIEL: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "FEHLER: Secret TAURI_SIGNING_PRIVATE_KEY fehlt (docs/betrieb/desktop-app.md)." >&2
            exit 1
          fi
          # Die Hülle muss die Release-Version tragen, sonst vergleicht ihr Updater falsch.
          # Gesetzt wird sie von release.config.mjs (prepareCmd).
          grep -qx "version = \"$VERSION\"" Cargo.toml \
            || { echo "FEHLER: src-tauri/Cargo.toml trägt nicht die Version $VERSION." >&2; exit 1; }
          cargo tauri build --ci --target "$ZIEL" --bundles "$BUNDLES"

      # Kanonische Dateinamen: Tauris eigene tragen Leerzeichen, die GitHub beim Hochladen still
      # durch Punkte ersetzt — die URL in latest.json zeigte dann ins Leere.
      - name: Pakete einsammeln
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
          ZIEL: ${{ matrix.target }}
        run: |
          set -euo pipefail
          target_dir="$(cargo metadata --format-version 1 --no-deps | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).target_directory')"
          # Auf dem Windows-Runner liefert Cargo `D:\a\…`; im Bash-Glob unten wäre der Backslash
          # ein Maskierzeichen.
          if command -v cygpath > /dev/null; then target_dir="$(cygpath -u "$target_dir")"; fi
          bundle="$target_dir/$ZIEL/release/bundle"
          name="lifeline-hub-desktop-$VERSION"
          genau_eine() {
            local treffer=("$@")
            [ "${#treffer[@]}" -eq 1 ] && [ -f "${treffer[0]}" ] \
              || { echo "FEHLER: erwartet genau eine Datei, gefunden: ${treffer[*]}" >&2; exit 1; }
            printf '%s' "${treffer[0]}"
          }
          mkdir -p versand
          case "$ZIEL" in
            *apple-darwin)
              archiv="$(genau_eine "$bundle"/macos/*.app.tar.gz)"
              cp "$archiv" "versand/$name-macos-arm64.app.tar.gz"
              cp "$archiv.sig" "versand/$name-macos-arm64.app.tar.gz.sig"
              cp "$(genau_eine "$bundle"/dmg/*.dmg)" "versand/$name-macos-arm64.dmg"
              ;;
            *windows*)
              installer="$(genau_eine "$bundle"/nsis/*-setup.exe)"
              cp "$installer" "versand/$name-windows-x64-setup.exe"
              cp "$installer.sig" "versand/$name-windows-x64-setup.exe.sig"
              ;;
          esac
          ( cd versand && for f in *; do
              case "$f" in *.sig) continue ;; esac
              if command -v sha256sum > /dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
            done )
          ls -l versand

      # Eigener Präfix `desktop-`: `veroeffentlichen` lädt `versand-*` und soll diese Dateien
      # nicht je nach Laufreihenfolge mitnehmen.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: versand/
          retention-days: 7

  # latest.json entsteht aus dem, was TATSÄCHLICH gebaut wurde: `always()`, damit eine
  # gescheiterte Plattform nur aus dem Manifest fällt, statt die andere mitzunehmen. Ohne ein
  # einziges Paket bricht das Skript ab (scripts/release/desktop-manifest.mjs, Selbsttest in
  # Schritt 8 von check-all.sh).
  desktop-veroeffentlichen:
    name: Desktop-Pakete und latest.json ans Release hängen
    needs: [vorbereiten, desktop]
    if: always() && needs.vorbereiten.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: versand

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          cache: true

      - name: latest.json erzeugen und hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.vorbereiten.outputs.tag }}
        run: |
          set -euo pipefail
          mise exec -- node scripts/release/desktop-manifest.mjs --dir versand --tag "$TAG" --repo "$GH_REPO"
          ls -lh versand
          gh release upload "$TAG" versand/* --clobber

  docker:
    name: Container-Abbild
    needs: [vorbereiten, bauen]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: versand-linux-*
          merge-multiple: true
          path: versand

      # Das Dockerfile erwartet dist/linux-<TARGETARCH>/lifeline-hub — TARGETARCH ist Dockers
      # Schreibweise (amd64/arm64), nicht die Rust-Triple-Schreibweise.
      - name: Kontext für das Abbild bauen
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/linux-amd64 dist/linux-arm64
          cp "versand/lifeline-hub-$VERSION-x86_64-unknown-linux-gnu" dist/linux-amd64/lifeline-hub
          cp "versand/lifeline-hub-$VERSION-aarch64-unknown-linux-gnu" dist/linux-arm64/lifeline-hub
          chmod +x dist/linux-*/lifeline-hub

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` nur für stabile Releases: ein Prerelease darf den Tag nicht übernehmen, den
      # ein `docker pull` ohne Angabe zieht. Die Kanal-Tags (beta/alpha) entstehen erst, wenn
      # es die Branches gibt — bis dahin ist der Ausdruck schlicht leer.
      - name: Abbild-Tags bestimmen
        id: tags
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
          IST_VORAB: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail
          bild="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$bild:$VERSION"
          if [ "$IST_VORAB" != "true" ]; then
            tags="$tags,$bild:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      # Startet das Abbild überhaupt? Ein gepushtes, aber nicht startfähiges Abbild (etwa
      # glibc-Versatz, siehe Dockerfile) fiele sonst erst beim Ausrollen auf. Rot hier hält auch
      # das Deployment auf.
      - name: Starttest (amd64)
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          version="$(docker run --rm --platform linux/amd64 "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" sqlite-version)"
          echo "eingebettetes SQLite: $version"
          [ -n "$version" ] || { echo "FEHLER: Abbild startet, liefert aber keine SQLite-Version." >&2; exit 1; }

  # Zweites Abbild, selbes Muster wie `docker` oben: fertige Binaries, kein Build aus Quelle.
  # Eigener Job statt eines weiteren Schritts dort, damit ein Fehler hier das Hauptabbild
  # nicht mitreißt — ohne karten-service läuft lifeline-hub weiter, nur ohne Kartenbau.
  docker-karten:
    name: Container-Abbild karten-service
    needs: [vorbereiten, bauen]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.vorbereiten.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: versand-linux-*
          merge-multiple: true
          path: versand

      - name: Kontext für das Abbild bauen
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/linux-amd64 dist/linux-arm64
          cp "versand/karten-service-$VERSION-x86_64-unknown-linux-gnu" dist/linux-amd64/karten-service
          cp "versand/karten-service-$VERSION-aarch64-unknown-linux-gnu" dist/linux-arm64/karten-service
          chmod +x dist/linux-*/karten-service

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild-Tags bestimmen
        id: tags
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
          IST_VORAB: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail
          bild="ghcr.io/${GITHUB_REPOSITORY,,}-karten-service"
          tags="$bild:$VERSION"
          if [ "$IST_VORAB" != "true" ]; then
            tags="$tags,$bild:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: karten-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true

      # Wie beim Hauptabbild: startet es, und sind die Werkzeuge da, die der Runner aufruft?
      - name: Starttest (amd64)
        env:
          VERSION: ${{ needs.vorbereiten.outputs.version }}
        run: |
          set -euo pipefail
          bild="ghcr.io/${GITHUB_REPOSITORY,,}-karten-service:$VERSION"
          docker run --rm --platform linux/amd64 "$bild" --help > /dev/null
          docker run --rm --platform linux/amd64 --entrypoint sh "$bild" -c 'docker --version && make --version > /dev/null && sqlite3 --version > /dev/null'

  # Alpha-Releases gehen ohne Handgriff auf den Server. Dieser Job legt nur das
  # GitHub-Deployment an; ausgerollt wird von einem Pull-Agenten auf dem Server (Begründung im
  # Kopf von deployment.yml). Nur beim echten Release-Ereignis: ein Nachbau per
  # workflow_dispatch soll nicht nebenbei ein älteres Release ausrollen.
  deployment:
    name: Deployment alpha anlegen
    needs: [vorbereiten, docker, docker-karten]
    if: github.event_name == 'release' && github.event.release.prerelease && contains(needs.vorbereiten.outputs.tag, '-alpha.')
    permissions:
      deployments: write
    uses: ./.github/workflows/deployment.yml
    with:
      tag: ${{ needs.vorbereiten.outputs.tag }}
