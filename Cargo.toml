[package]
name = "lifeline-hub"
# Die Anwendungsversion steht EINMAL, in [workspace.package] — die Desktop-Hülle erbt sie mit.
version.workspace = true
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
# `sqlite-deserialize` nur für `db::test_pool`: das migrierte Schema wird je Testprozess einmal
# gebaut und als Abbild in jede frische `:memory:`-DB eingespielt. Schaltet nur API frei.
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "sqlite-deserialize"] }
# `bundled` kompiliert SQLite ins Binary: ein SQLite-CVE ist NUR per Crate-Bump + Rebuild +
# Redeploy zu schließen, kein System-Update erreicht diese Kopie (docs/betrieb/packaging.md,
# „Eingebettetes SQLite"). Bei einem Bump wird tests/sqlite_version.rs rot und erzwingt den
# Doku-Nachzug.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `gzip` (LFH-599): die Fachebenen-Quellen packen auf Anfrage (ODL 890 KB → 81 KB, PEGELONLINE
# 754 KB → 71 KB). Das Feature schaltet Angebot und Entpacken für JEDEN Client per Vorgabe ein;
# Clients, die Bytes durchreichen oder pinnen (Kachel-Proxy, Download), setzen `.no_gzip()`.
# Brotli bot am 01.10.2026 nur Bright Sky an — kein eigenes Feature dafür.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Jahr der Einsatznummer in der Org-Zeitzone. Die tzdb ist einkompiliert; eine Regeländerung
# eines Staates braucht einen Crate-Bump.
chrono-tz = "0.10"
axum-extra = { version = "0.12", features = ["cookie"] }
# `Max-Age` des Sitzungscookies (LFH-779); `cookie` nimmt nur `time::Duration`, axum-extra
# reicht `time` nicht durch. Liegt ohnehin schon im Lockfile (über `cookie`).
time = "0.3"
# Netzliste der vertrauenswürdigen Reverse-Proxys (LFH-604). Liegt ohnehin schon im Lockfile
# (über `hyper-util`).
ipnet = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"
sha2 = "0.11"
base64 = "0.22"
mime_guess = "2"
# Vorschaubilder der Anhänge (LFH-759, `src/anhang/vorschau/`): nur die Decoder für JPEG, PNG,
# GIF, WebP und TIFF plus den JPEG-Encoder. Alle reines Rust (zune-jpeg, png, gif, image-webp,
# tiff), kein `-sys`-Crate, damit das Single-Binary ohne C-Bibliothek bleibt; ohne `rayon`, die
# Last begrenzt `anhang::vorschau` selbst. HEIC dekodiert der Browser (design.md D3/D8).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
# fontstack-/Pfadsegment-Encoding für den Style-/Tile-Proxy.
percent-encoding = "2"
rust-embed = "8"
# OpenAPI-Codegen als Wahrheitsquelle für die Frontend-Typen.
utoipa = "6"
tower-http = { version = "0.7", features = ["fs", "catch-panic", "trace", "request-id"] }
# Prod-Abhängigkeit: der PMTiles-Tile-Handler nutzt `tower::ServiceExt::oneshot` (routes/karte.rs).
tower = { version = "0.5", features = ["util", "limit"] }
fs4 = "1.1.0"
# KRITIS-Objekte aus dem OSM-Extrakt lesen; reiner Rust-PBF-Leser ohne FFI.
osmpbf = "0.3"
# Eigener, kleiner Thread-Pool für den Extrakt-Import: der globale Pool nähme alle Kerne und ein
# Vielfaches an Speicher.
rayon = "1"
# Geteilter Offline-Katalog-Typ. `schema` zieht `ToSchema` in den Typ-Codegen; kein
# Default-Feature des Crates, damit karten-service utoipa nicht mitzieht.
karten-katalog = { path = "crates/karten-katalog", features = ["schema"] }
# ClamAV-INSTREAM-Client, reines Rust (nur tokio). `optional`, damit `--no-default-features`
# den No-op-Stub baut.
clamav-client = { version = "2.2", optional = true, default-features = false, features = ["tokio"] }
# TLS-Bind über rustls; rcgen erzeugt das selbstsignierte Zertifikat (Fallback).
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
# Nur für `TokioTimer`: hyper braucht einen Timer, bevor `header_read_timeout` gesetzt werden
# darf (sonst Panik beim Verbindungsaufbau).
hyper-util = { version = "0.1", features = ["tokio"] }
# OIDC/SSO. default-features aus: sie zögen oauth2s eigenen reqwest-0.12-Stack (`ring`) neben
# unseren reqwest 0.13 (`aws-lc-rs`) auf dasselbe rustls-0.23, und rustls könnte den
# Default-CryptoProvider nicht mehr bestimmen (bricht tls::tests::rcgen_pem_ist_per_rustls_ladbar).
# Den HTTP-Client liefert der Code selbst (`redirect::Policy::none()`, SSRF).
openidconnect = { version = "4", default-features = false }
# WebAuthn/Passkeys. Die Default-Features ziehen keinen eigenen reqwest-/rustls-Stack.
# `webauthn-rs-core`/`webauthn-attestation-ca` hängen UNBEDINGT an `openssl-sys`, unabhängig von
# der Feature-Wahl — deshalb der `openssl`-Eintrag unten.
#
# `conditional-ui`: discoverable-Authentifizierung für den usernameless Passkey-Login; ein leeres
# Feature-Gate ohne transitive Deps. `danger-allow-state-serialisation` ist nicht nötig, der
# Ceremony-State bleibt in-memory (`auth::webauthn::state`).
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
# OpenSSL STATISCH eingebacken (`vendored`). Keine neue Abhängigkeit, sondern der Schalter für
# den unvermeidbaren Pull aus webauthn-rs — Feature-Unifikation aktiviert `vendored` im ganzen
# Graphen. Grund: der Windows-Cross-Build hat keine System-OpenSSL, und das Single-Binary
# braucht so keine OpenSSL-Runtime am Zielrechner (Docker-Image distroless).
#
# Preis: Build braucht Perl + C-Compiler, ein kalter Build kompiliert OpenSSL mit. Ein
# OpenSSL-CVE ist NUR per Crate-Bump + Rebuild + Redeploy zu schließen (packaging.md).
openssl = { version = "0.10", features = ["vendored"] }
uuid = { version = "1", features = ["v4", "serde"] }
# TOTP-Zweitfaktor: "otpauth" für die otpauth://-URL (QR-Enrollment), "gen_secret" für
# zufällige Secrets.
totp-rs = { version = "6", features = ["otpauth", "gen_secret"] }

[dev-dependencies]
# "danger-credential-internals" schaltet `From<Credential> for Passkey` frei, damit Tests aus
# einer synthetischen `Credential` einen ECHTEN `Passkey` bauen, ohne Authenticator-Zeremonie.
# `webauthn-rs-core` direkt, weil `webauthn_rs::prelude` nicht alle nötigen Typen reexportiert.
# Resolver v2 unifiziert Dev-Dep-Features nicht in `cargo build` — die Produktions-Binary
# bekommt das Feature nicht.
webauthn-rs = { version = "0.5", features = ["danger-credential-internals"] }
webauthn-rs-core = "=0.5.5"
# SSE-Body eines OFFENEN Streams frameweise lesen: `to_bytes` wartet auf ein Stream-Ende, das
# bei einem Live-Feed nie kommt.
http-body-util = "0.1"

[features]
# clamav ist Default-AN (reines Rust). Der echte Scan braucht einen erreichbaren clamd; ohne
# `--clamav-addr` ist der Seam ein No-op.
default = ["clamav"]

# Dev-only: Seed-Testdaten und /api/dev/users. Niemals im Release-Build aktivieren.
dev-seeds = []

# Echter clamd-Upload-Scan; ohne dieses Feature (`--no-default-features`) ein No-op.
clamav = ["dep:clamav-client"]

# EINE Versionsquelle für Server und Desktop-Hülle (LFH-721): semantic-release setzt sie per
# `cargo set-version -p lifeline-hub` (release.config.mjs), beide Pakete erben sie. Zwei eigene
# Versionsfelder drifteten beim Einmergen eines alpha-Releases auseinander.
[workspace.package]
version = "1.0.0-alpha.69"

[workspace]
members = [".", "crates/karten-katalog", "karten-service", "src-tauri"]

# Debuginfo im Dev- und Testprofil (LFH-845): eigener Code nur Zeilentabellen, Abhängigkeiten
# keine. Unter Linux linkt jedes der ~130 Binaries in target/debug/deps die Debuginfo neu mit;
# das Testbinary `einsatz` wog voll 501 MB, so 142 MB. Ein voller Testbau des Workspace passt
# damit in 21,6 GB statt hochgerechnet über 60, kalt 14 % schneller. Backtraces nennen weiter Datei und
# Zeile, auch für Fremdcode, der durch eigene Generics läuft. Die CI liest dieselbe Einstellung.
# Preis: lldb zeigt keine Variablen. Für eine solche Sitzung ohne Dateiänderung:
#   CARGO_PROFILE_DEV_DEBUG=true cargo test --test <name>
#   (plus --config 'profile.dev.package."*".debug=true' für Variablen in Abhängigkeiten)
# Messung: openspec/changes/archive/2026-10-03-lfh-845-debuginfo-testbinaries/design.md
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# Der KRITIS-Import liest einen 4–5 GB großen PBF-Extrakt, auch im Dev-Stack. Nur diese
# Abhängigkeiten werden im Dev-Build optimiert; der eigene Code bleibt debugbar.
[profile.dev.package.osmpbf]
opt-level = 3
[profile.dev.package.protobuf]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

# Argon2 ist absichtlich rechenteuer, unoptimiert rund 18-mal mehr — jeder Integrationstest
# hasht und prüft. Verfahren und Parameter bleiben unverändert; wirkt nur auf Debug-Builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
