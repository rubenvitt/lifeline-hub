[package]
name = "lifeline-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"
sha2 = "0.11"
mime_guess = "2"
# LFH-182: fontstack-/Pfadsegment-Encoding für den Style-/Tile-Proxy.
percent-encoding = "2"
rust-embed = "8"
# LFH-120: OpenAPI-Codegen als Wahrheitsquelle für die Frontend-Typen (Typ-Drift-Absicherung).
utoipa = "5"
tower-http = { version = "0.7", features = ["fs"] }
# Prod-Abhängigkeit: der PMTiles-Tile-Handler nutzt `tower::ServiceExt::oneshot`,
# um `ServeFile` per Request laufen zu lassen (siehe routes/karte.rs).
tower = { version = "0.5", features = ["util"] }
fs4 = "1.1.0"
# LFH-201: geteilter Offline-Katalog-Typ (Grundstein für den späteren karten-service).
karten-katalog = { path = "crates/karten-katalog" }
# LFH-114: optionaler ClamAV/clamd-Client für den Upload-Virenscan. Hinter dem `clamav`-Feature,
# damit der Default-Build single-binary bleibt (kein FFI, keine Signatur-DB im Prozess).
clamav-client = { version = "2.2", optional = true, default-features = false, features = ["tokio"] }

[features]
# Dev-only: aktiviert Seed-Testdaten und den /api/dev/users-Endpoint.
# Niemals im Release-Build aktivieren (kein Default-Feature).
dev-seeds = []

# LFH-114: echter ClamAV/clamd-Upload-Scan. Ohne dieses Feature ist der Scan-Seam ein No-op.
# Braucht zur Laufzeit einen erreichbaren clamd (Sidecar/systemd) — siehe --clamav-addr.
clamav = ["dep:clamav-client"]

# LFH-201: Workspace-Umstellung — geteilter Typ wandert in ein eigenes Crate (Grundstein für den
# späteren karten-service). `karten-service` ist jetzt Teil des Workspace (Skelett, LFH-201 Task 2).
[workspace]
members = [".", "crates/karten-katalog", "karten-service"]
