[package]
name = "lifeline-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
# `bundled` kompiliert SQLite als C-Amalgamation ins Binary. Folge: ein SQLite-CVE ist
# NUR per Crate-Bump + Rebuild + Redeploy zu schließen — kein System-Update erreicht diese
# Kopie. Welche Version drinsteckt und wie der Patch-Pfad läuft: siehe
# docs/betrieb/packaging.md („Eingebettetes SQLite"). Bei einem Bump wird
# tests/sqlite_version.rs rot und erzwingt den Doku-Nachzug (LFH-233/G02).
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tempfile = "3"
sha2 = "0.11"
mime_guess = "2"
# LFH-182: fontstack-/Pfadsegment-Encoding für den Style-/Tile-Proxy.
percent-encoding = "2"
rust-embed = "8"
# LFH-120: OpenAPI-Codegen als Wahrheitsquelle für die Frontend-Typen (Typ-Drift-Absicherung).
utoipa = "5"
# trace + request-id (LFH-249/F30): Request-Instrumentierung. Kein neuer Abhängigkeitsbaum —
# tower-http ist ohnehin da, uuid ebenfalls Direkt-Dependency.
tower-http = { version = "0.7", features = ["fs", "catch-panic", "trace", "request-id"] }
# Prod-Abhängigkeit: der PMTiles-Tile-Handler nutzt `tower::ServiceExt::oneshot`,
# um `ServeFile` per Request laufen zu lassen (siehe routes/karte.rs).
tower = { version = "0.5", features = ["util", "limit"] }
fs4 = "1.1.0"
# LFH-201: geteilter Offline-Katalog-Typ (Grundstein für den späteren karten-service).
# `schema` (LFH-265): zieht `ToSchema` für OfflineKatalogEintrag in den Typ-Codegen. Bewusst
# kein Default-Feature des Crates — karten-service soll utoipa standalone nicht mitziehen.
karten-katalog = { path = "crates/karten-katalog", features = ["schema"] }
# LFH-114: ClamAV/clamd-Client für den Upload-Virenscan. Reiner Rust-INSTREAM-Client (nur
# tokio, kein FFI/keine Signatur-DB im Prozess) → das Binary bleibt single-binary. Hängt am
# `clamav`-Feature, das Default-AN ist (s. [features]); `optional` bleibt, damit
# `--no-default-features` den reinen No-op-Stub baut.
clamav-client = { version = "2.2", optional = true, default-features = false, features = ["tokio"] }
# LFH-274: HTTPS/TLS-Transport — axum-server für den rustls-basierten TLS-Bind,
# rcgen für die selbstsignierte Cert-Generierung (mkcert-/BYO-Fallback).
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
# LFH-231/G10: ausschließlich für `TokioTimer` — hyper braucht einen Timer, bevor
# `header_read_timeout` gesetzt werden darf (sonst Panik beim Verbindungsaufbau). Die Crate
# war ohnehin transitiv im Graph (über axum und axum-server), hier nur direkt benannt.
hyper-util = { version = "0.1", features = ["tokio"] }
# LFH-41: OIDC/SSO (Increment 3). Task 1 nur die Dependency — Discovery/Token-Exchange/Claims
# folgen in späteren Increment-3-Tasks (Lazy Discovery, kein Netz beim Start).
# default-features aus: die Default-Features "reqwest"/"rustls-tls" ziehen oauth2s eigenen
# reqwest-0.12-Stack (hyper-rustls mit `ring`) hinein — kollidiert mit unserem reqwest 0.13
# (`aws-lc-rs`) auf demselben rustls-0.23: rustls kann dann den Default-CryptoProvider nicht
# mehr automatisch bestimmen (bricht tls::tests::rcgen_pem_ist_per_rustls_ladbar). Spätere
# Tasks liefern den HTTP-Client für `request_async`/`discover_async` selbst (SSRF-Disziplin:
# `redirect::Policy::none()` verlangt ohnehin einen eigenen Client statt oauth2s Default).
openidconnect = { version = "4", default-features = false }
# LFH-275: WebAuthn/Passkeys (Increment 4). Default-Features (nur "attestation", reine
# Zertifikatsketten-Prüfung für Sicherheitsschlüssel-Attestation) ziehen KEINEN eigenen
# reqwest-/rustls-Stack — kein Kollisions-Risiko wie bei openidconnect (Kanarienvogel-Test
# `tls::tests::rcgen_pem_ist_per_rustls_ladbar` bleibt grün, siehe dortige Verifikation).
# ACHTUNG (Supply-Chain-Review): `default-features = false` (also OHNE "attestation") entfernt
# NICHT das system-OpenSSL (`openssl`/`openssl-sys`) — verifiziert per `cargo tree -i openssl-sys`.
# `webauthn-rs-core`/`webauthn-attestation-ca` deklarieren `openssl`/`openssl-sys` als
# unconditional, nicht-optionale Dependency in ihrem eigenen Cargo.toml (kein `cfg(feature =
# "attestation")` davor) — das Feature gated in dieser Version nur Felder/Methoden im
# `webauthn-rs`-Top-Crate, keine Dependency-Kante. Der openssl-Pull ist damit inhärent zu jeder
# Nutzung dieser Library-Version, nicht durch Feature-Wahl vermeidbar. `openssl-sys` bindet zudem
# standardmäßig DYNAMISCH gegen die System-libssl/libcrypto (kein "vendored") — das ist auch eine
# LAUFZEIT-Abhängigkeit, nicht nur eine Build-Voraussetzung (verifiziert per `otool -L` auf der
# gebauten Binary). Details/Build-Voraussetzung: `docs/betrieb/packaging.md`.
#
# `conditional-ui` (LFH-313): schaltet die discoverable-Authentifizierung frei
# (`start_/identify_/finish_discoverable_authentication`, `DiscoverableAuthentication`/
# `DiscoverableKey`) für den usernameless Passkey-Login. Ist ein LEERES Feature-Gate
# (`conditional-ui = []` in webauthn-rs) → keine transitiven Deps, kein Binary-Impact
# (nur zuvor `#[cfg]`-ausgeblendete Methoden/Typen werden sichtbar). KEIN
# `danger-allow-state-serialisation` nötig: der Ceremony-State liegt rein in-memory
# (`auth::webauthn::state`), wird nie (de)serialisiert.
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
# LFH-522: OpenSSL wird STATISCH eingebacken (`vendored`) statt dynamisch gegen die
# System-libssl/libcrypto zu binden. Der Pull selbst ist unvermeidbar (siehe den
# webauthn-rs-Block darüber: `webauthn-rs-core`/`webauthn-attestation-ca` deklarieren
# `openssl-sys` unconditional). Dieser Eintrag ist deshalb KEINE neue Abhängigkeit, sondern
# der Schalter dafür — Cargos Feature-Unifikation aktiviert `vendored` quer durch den Graphen.
#
# Warum: (1) Windows-Cross-Build (x86_64-pc-windows-gnu) hat keine System-OpenSSL, gegen die
# er linken könnte — ohne `vendored` bricht `openssl-sys` im Build-Script ab. (2) Damit ist
# die in docs/betrieb/packaging.md offen gelassene „Option (b)" eingelöst: das Single-Binary-
# Versprechen gilt wieder ohne Sternchen, der Zielrechner (ELW/Mini-PC) braucht keine
# kompatible OpenSSL-Runtime mehr, und das Docker-Image kommt ohne libssl aus (distroless).
#
# Preis: Build-Voraussetzung ist jetzt Perl + C-Compiler (statt pkg-config + libssl-dev), und
# ein KALTER Build kompiliert OpenSSL mit (~2 min, danach gecacht). Betriebsfolge wie beim
# eingebetteten SQLite: ein OpenSSL-CVE ist NUR per Crate-Bump + Rebuild + Redeploy zu
# schließen, kein `apt upgrade` erreicht diese Kopie — steht in packaging.md.
openssl = { version = "0.10", features = ["vendored"] }
uuid = { version = "1", features = ["v4", "serde"] }
# LFH-43: TOTP-Zweitfaktor (Increment 5, MFA). "otpauth" für die otpauth://-URL-Erzeugung
# (QR-Code-Enrollment), "gen_secret" für kryptografisch zufällige Secret-Erzeugung.
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }

[dev-dependencies]
# LFH-275 Task 3: Passkey-Storage-Tests brauchen echte `Passkey`-Werte, aber eine komplette
# Registrierungs-Zeremonie braucht einen echten/simulierten Authenticator. Statt einer
# schweren Softtoken-Ceremony-Crate oder eines versionsfragilen handgetippten JSON-Fixtures
# nutzen wir den von webauthn-rs SELBST bereitgestellten Escape-Hatch: das Feature
# "danger-credential-internals" schaltet `From<Credential> for Passkey` frei (interface.rs),
# damit Tests eine synthetische `Credential` (alle Felder public) zu einem ECHTEN `Passkey`
# konvertieren können — kein Fake-String, sondern eine Instanz des echten Typs, die den
# echten serde-Pfad durchläuft. `webauthn-rs-core` wird zusätzlich direkt gebraucht, weil
# `webauthn_rs::prelude` nicht alle für den Credential-Bau nötigen Typen (u.a.
# `RegisteredExtensions`, `UserVerificationPolicy`) reexportiert. Nur `[dev-dependencies]`:
# Cargos Resolver v2 unifiziert Dev-Dep-Features NICHT in den normalen `cargo build`-Graphen
# (verifiziert: `cargo build` bleibt ohne das Feature, `cargo test` bekommt es), daher bleibt
# `cargo build`/die Produktions-Binary unberührt — Boot-Verifikation s. `tls::tests::
# rcgen_pem_ist_per_rustls_ladbar` (Canary, RustCrypto/rustls-CryptoProvider-Kollision).
webauthn-rs = { version = "0.5", features = ["danger-credential-internals"] }
webauthn-rs-core = "=0.5.5"
# SSE-Body eines OFFENEN Streams frameweise lesen (F01/LFH-227-Filtertest): `to_bytes`
# wartet auf das Stream-Ende, das bei einem Live-Feed nie kommt. Kein neuer Fremdcode —
# axum baut ohnehin darauf auf, der Eintrag macht die Nutzung im Test nur explizit.
http-body-util = "0.1"

[features]
# clamav ist Default-AN: der Client ist pure-Rust (nur tokio) → kein Binary-Bloat, das Binary
# bleibt single-binary. Der echte Scan braucht trotzdem einen erreichbaren clamd (optionaler
# Laufzeit-Daemon); ohne `--clamav-addr` ist der Seam ein No-op → kein zweiter Prozess nötig.
# `--no-default-features` baut den reinen No-op-Stub ohne den clamav-Client.
default = ["clamav"]

# Dev-only: aktiviert Seed-Testdaten und den /api/dev/users-Endpoint.
# Niemals im Release-Build aktivieren (kein Default-Feature).
dev-seeds = []

# LFH-114: echter ClamAV/clamd-Upload-Scan (Default-AN, s.o.). Ohne dieses Feature
# (`--no-default-features`) ist der Scan-Seam ein No-op. Braucht zur Laufzeit einen
# erreichbaren clamd (Sidecar/systemd) — siehe --clamav-addr.
clamav = ["dep:clamav-client"]

# LFH-201: Workspace-Umstellung — geteilter Typ wandert in ein eigenes Crate (Grundstein für den
# späteren karten-service). `karten-service` ist jetzt Teil des Workspace (Skelett, LFH-201 Task 2).
[workspace]
members = [".", "crates/karten-katalog", "karten-service"]
