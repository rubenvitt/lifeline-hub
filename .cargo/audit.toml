# LFH-253/G01: Konfiguration für `cargo audit` (scripts/check-deps.sh).
#
# Hier stehen NUR Advisories, für die es keinen Fix gibt UND deren Nichtbetroffenheit
# begründet ist. Jeder Eintrag braucht: warum kein Upgrade möglich ist, warum das Risiko
# in DIESEM Code nicht trägt, und woran man merkt, dass sich das ändert.
#
# Der Sinn der Liste ist nicht, das Gate leise zu machen, sondern es NUTZBAR zu halten:
# ein Gate, das von Tag eins rot ist, wird abgeschaltet statt befolgt. Was hier steht,
# ist bewertet — was nicht hier steht, bricht den Build.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — „Marvin Attack": Timing-Sidechannel in `rsa` 0.9.x, über den ein
    # Angreifer mit einem Entschlüsselungs-Orakel den PRIVATEN Schlüssel rekonstruieren
    # kann. Severity 5.9 (medium).
    #
    # Kein Upgrade möglich: die Advisory sagt ausdrücklich „No fixed upgrade is available"
    # — es gibt bis heute keine gefixte rsa-Version. Der Pfad ist
    # rsa 0.9.10 ← openidconnect 4.0.1 ← lifeline-hub, also transitiv und nicht abwählbar,
    # solange OIDC/SSO unterstützt wird.
    #
    # Warum das Risiko hier nicht trägt: lifeline-hub ist OIDC-*Client* (Relying Party).
    # In dieser Rolle wird RSA ausschließlich zum PRÜFEN von Signaturen benutzt — mit dem
    # ÖFFENTLICHEN Schlüssel des Identity Providers aus dessen JWKS. Wir halten keinen
    # privaten RSA-Schlüssel und entschlüsseln nichts damit; die Client-Authentisierung
    # läuft über `client_secret`, nicht über RSA. Der Angriff braucht aber genau ein
    # Orakel, das mit dem privaten Schlüssel entschlüsselt. Diese Operation existiert in
    # diesem Programm nicht.
    #
    # Neu bewerten, wenn: (a) eine gefixte rsa-Version erscheint (dann Ignore streichen),
    # (b) das Projekt anfängt, verschlüsselte ID-Tokens (JWE) zu entgegenzunehmen oder
    # selbst als OIDC-*Provider* aufzutreten — dann kämen private-key-Operationen ins
    # Spiel und die Begründung oben fiele weg.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0387 (LLH-1275) — Timing-Unterschiede in `crypto-bigint` 0.5.5 bei
    # Operationen, die konstante Laufzeit versprechen. Gefixt erst in `crypto-bigint` >= 0.7.6.
    #
    # Kein Upgrade möglich: der Pfad ist crypto-bigint 0.5.5 ← elliptic-curve 0.13.8 ←
    # p256 0.13 / p384 0.13 ← openidconnect 4.0.1 bzw. age 0.12.1 (über hpke) ← lifeline-hub.
    # Die ganze RustCrypto-Linie 0.13 hängt an crypto-bigint 0.5, die 0.7 erst an
    # elliptic-curve 0.14. Beide Direktabhängigen verlangen p256 0.13 (Stand 24.10.2026).
    #
    # Warum das Risiko hier nicht trägt: ein Timing-Angriff braucht eine Operation mit einem
    # GEHEIMEN Wert, deren Laufzeit der Angreifer misst. Die gibt es auf diesen Pfaden nicht.
    # openidconnect nutzt P-256/P-384 nur zum PRÜFEN von ES256/ES384-Signaturen des Identity
    # Providers, mit dessen öffentlichem Schlüssel aus dem JWKS (wie bei RUSTSEC-2023-0071
    # oben: Relying Party, kein privater Schlüssel). age verschlüsselt die Backups mit
    # X25519 (`src/backup/verschluesselung.rs`), nicht mit P-256; P-256-Identitäten gibt es in
    # age nur über Plugins, und die sind aus (`default-features = false` in `Cargo.toml`).
    #
    # Neu bewerten, wenn: (a) openidconnect oder age auf elliptic-curve 0.14 gehen (dann
    # Upgrade und Ignore streichen), (b) lifeline-hub selbst mit einem privaten P-256/P-384-
    # Schlüssel signiert oder entschlüsselt (etwa private_key_jwt beim IdP, eigene JWTs,
    # ECDH), (c) das age-Feature `plugin` eingeschaltet wird.
    "RUSTSEC-2026-0387",

    # RUSTSEC-2026-0459 (LLH-1617, BEFRISTET bis 30.11.2026) — SQLite < 3.54.0 (CVE-2026-119375)
    # liefert uninitialisierten Page-Cache, wenn ein Prozess eine DB-Datei zusammen mit einer
    # `-wal`-Datei anderer Seitengröße öffnet. Gefixt in `libsqlite3-sys` >= 0.39.0.
    #
    # Kein Upgrade möglich: `sqlx-sqlite` 0.9.0 verlangt `libsqlite3-sys >=0.30.1, <0.38.0`. Die
    # Schranke ist upstream angehoben (transact-rs/sqlx#4502, gemergt 08.11.2026), aber noch in
    # keinem Release (Stand 09.11.2026).
    #
    # Warum das Risiko hier nicht trägt: der Angriff braucht ein präpariertes Paar aus DB und
    # `-wal`, das ein weniger vertrauenswürdiger Dritter geschrieben hat. lifeline-hub öffnet nur
    # eigene Dateien im Datenverzeichnis; wer dort schreiben kann, hat die Datenbank ohnehin.
    # `restore` spielt eine einzelne Sicherungsdatei ein und entfernt `-wal`/`-shm` vorher
    # (`src/backup/restore.rs`); `deserialize` dient nur `db::test_pool` mit einem selbst
    # erzeugten Abbild.
    #
    # Neu bewerten, wenn: (a) ein sqlx-Release `libsqlite3-sys` 0.39 erlaubt (dann heben und
    # Ignore streichen), (b) lifeline-hub SQLite-Dateien von außen annimmt (Upload, Import einer
    # DB mit `-wal`), (c) spätestens am 30.11.2026 (LLH-1617).
    "RUSTSEC-2026-0459",
]
