<helmet>
<style>
@font-face{font-family:"LFH Archivo";src:url("ds/lifeline-hub/fonts/lfh-archivo-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"LFH Archivo";src:url("ds/lifeline-hub/fonts/lfh-archivo-600.woff2") format("woff2");font-weight:600}

body{margin:0}
.tel{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#08090b;color:#e8ebee;font-family:"LFH Archivo",system-ui,sans-serif;font-size:15px;line-height:21px;overflow:hidden}

.kl{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 12px 0 0;background:#0c0e11;border-bottom:1px solid #22262b}
.kl button{width:52px;height:52px;border:0;background:transparent;color:#e8ebee;display:inline-flex;align-items:center;justify-content:center;padding:0}
.kl .ein{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kl .uhr{font-size:15px}
.li{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.z{padding:7px 12px 8px 9px;border-bottom:1px solid #22262b;border-left:3px solid #1677ff;background:#0f1215}
.z.b{border-left-color:#ff6b6b}
.k{display:flex;align-items:baseline;gap:8px;font-size:13px;color:#c6ccd2;white-space:nowrap;overflow:hidden}
.k .zt{font-size:15px;color:#e8ebee}
.k .ty{font-size:12px;font-weight:600;color:#5c9dff}
.b .k .ty{color:#ff6b6b}
.k small{font-size:12px;color:#9aa2ab}
.sz{flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding:8px 12px;border-top:1px solid #2e343a;background:#0f1215}
.seg{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr))}
.seg button{height:48px;box-sizing:border-box;margin-left:-1px;border:1px solid #626a73;background:#0f1215;color:#9aa2ab;font:inherit;font-size:13px;padding:0}
.seg button:first-child{margin-left:0}
.seg button.an{background:#16191d;color:#e8ebee;box-shadow:inset 0 -3px 0 #1677ff}
.zw{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:6px}
.fd{display:flex;align-items:center;height:48px;box-sizing:border-box;border:1px solid #626a73;background:#08090b;font-size:12px;color:#9aa2ab}
.fd span{width:44px;flex-shrink:0;padding-left:10px;box-sizing:border-box}
.fd input,.fd select{flex:1;min-width:0;height:46px;border:0;background:transparent;color:#e8ebee;font:inherit;font-size:15px;padding:0 8px 0 0}
.sz textarea{height:66px;box-sizing:border-box;resize:none;border:1px solid #4d94d6;border-left:3px solid #1677ff;box-shadow:0 0 0 2px #0d1620;background:#08090b;color:#e8ebee;font:inherit;font-size:15px;line-height:21px;padding:10px}
.ab{display:flex;align-items:center;gap:10px}
.ab label{flex:1;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#c6ccd2;min-height:48px}
.ab input{width:20px;height:20px;margin:0}
.pr{height:48px;padding:0 22px;border:0;background:#4d94d6;color:#08090b;font:inherit;font-size:15px;font-weight:600}
.tast{height:290px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#16191d;border-top:1px solid #2e343a;font-size:13px;color:#9aa2ab}
</style>
</helmet>
<div class="tel">
  <header class="kl">
    <button type="button" aria-label="Menü"><svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><path d="M0 1h22M0 8h22M0 15h22" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <span class="ein">ÜBUNG – Starkregen Musterstadt</span>
    <svg width="16" height="14" viewBox="0 0 14 12" role="img" aria-label="verbunden"><path d="M1 4a9 9 0 0 1 12 0M3.5 7a5.5 5.5 0 0 1 7 0" fill="none" stroke="#52c41a" stroke-width="1.6"/><circle cx="7" cy="10" r="1.3" fill="#52c41a"/></svg>
    <span class="uhr mono">19:26</span>
  </header>
  <div class="li">
    <div class="z b"><div class="k"><span class="zt mono">1921</span><span class="ty">Berichtigung</span><span>Rettungsstaffel → EL <small>· Funk</small></span></div><div>Zu Nr. 230: RTW 83-1, nicht 83-2, ist wieder einsatzbereit am Marktplatz.</div></div>
    <div class="z"><div class="k"><span class="zt mono">1924</span><span class="ty">Meldung</span><span>Sanitätsgruppe UHS → EL <small>· Funk</small></span></div><div>Zwei Patienten SK II an RTW übergeben, UHS wieder aufnahmefähig.</div></div>
  </div>
  <form class="sz" aria-label="Eintrag erfassen">
    <div class="seg" role="group" aria-label="Typ des Eintrags">
      <button type="button" class="an">Meldung</button>
      <button type="button">Anordnung</button>
      <button type="button">Entscheidung</button>
      <button type="button">Lage</button>
    </div>
    <div class="zw">
      <label class="fd"><span>Zeit</span><input class="mono" value="jetzt · 1926"></label>
      <label class="fd"><span>Weg</span><select><option>Funk</option><option>Telefon</option></select></label>
    </div>
    <label class="fd"><span>Von</span><input value="Logistiktrupp"></label>
    <label class="fd"><span>An</span><input value="EL"></label>
    <textarea aria-label="Inhalt">Stromerzeuger an der UHS Turnhalle angeschlossen, läuft.</textarea>
    <div class="ab">
      <label><input type="checkbox" checked> auch in den Meldungseingang</label>
      <button class="pr" type="submit">Erfassen</button>
    </div>
  </form>
  <div class="tast" aria-hidden="true">Bildschirmtastatur</div>
</div>
</x-dc>
