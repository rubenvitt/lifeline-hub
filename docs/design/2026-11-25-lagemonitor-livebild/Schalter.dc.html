<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Schalter Livebild auf dem Lagemonitor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 420px; height: 360px; box-sizing: border-box; padding: 16px 16px 16px 24px; background: #08090b; color: #c6ccd2; font-family: Archivo, system-ui, sans-serif; font-size: 13px; display: flex; flex-direction: column; gap: 8px">
  <div style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9199a2">Drohne</div>
  <ul aria-label="Drohnenquellen" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
    <li style="display: flex; flex-direction: column; gap: 6px">
      <span style="color: #e8ebee">Suchlage Kreisverband</span>
      <span>Zugeschaltet · Mission „Waldsee“</span>
      <button type="button" style="align-self: flex-start; height: 30px; padding: 0 12px; background: transparent; color: #e8ebee; border: 1px solid #6c747d; border-radius: 0; font: inherit">Livebild</button>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 30px; cursor: pointer">
        <button type="button" role="switch" aria-checked="{{an}}" onClick="{{umschalten}}" style="width: 32px; height: 18px; border-radius: 9px; border: none; padding: 2px; background: {{spurFarbe}}; display: flex; justify-content: {{knopfSeite}}; cursor: pointer">
          <span style="display: block; width: 14px; height: 14px; border-radius: 7px; background: #e8ebee"></span>
        </button>
        <span style="color: #e8ebee">Livebild auf dem Lagemonitor</span>
      </label>
      <span style="color: #9199a2">{{hinweis}}</span>
      <button type="button" style="align-self: flex-start; height: 30px; padding: 0 12px; background: transparent; color: #e8ebee; border: 1px solid #6c747d; border-radius: 0; font: inherit">Abschalten</button>
    </li>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":360}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { an: false }; }
  renderVals() {
    const an = this.state.an;
    return {
      an: an ? 'true' : 'false',
      spurFarbe: an ? '#4d94d6' : '#2e343a',
      knopfSeite: an ? 'flex-end' : 'flex-start',
      hinweis: an ? 'Das Großbild zeigt das Livebild; Personen im Bild sind dort sichtbar.' : 'Aus (Vorgabe): das Großbild zeigt kein Livebild.',
      umschalten: () => this.setState({ an: !an }),
    };
  }
}
</script>
</body>
</html>
