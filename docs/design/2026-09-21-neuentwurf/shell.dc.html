<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="_ds/lifeline-hub-design-system-ac89f959-9945-47a5-bb8b-25b1c32d4848/tokens/colors.css">
<link rel="stylesheet" href="_ds/lifeline-hub-design-system-ac89f959-9945-47a5-bb8b-25b1c32d4848/tokens/typography.css">
<link rel="stylesheet" href="_ds/lifeline-hub-design-system-ac89f959-9945-47a5-bb8b-25b1c32d4848/tokens/spacing.css">
<link rel="stylesheet" href="_ds/lifeline-hub-design-system-ac89f959-9945-47a5-bb8b-25b1c32d4848/tokens/elevation.css">
<link rel="stylesheet" href="_ds/lifeline-hub-design-system-ac89f959-9945-47a5-bb8b-25b1c32d4848/tokens/motion.css">
<script src="_ds/lifeline-hub-design-system-ac89f959-9945-47a5-bb8b-25b1c32d4848/_ds_bundle.js"></script>
</helmet>
<div style="width:100%; height:100%; display:flex; flex-direction:column; background:#08090b; color:#e8ebee; font-family:Archivo, system-ui, sans-serif; overflow:hidden">

  <div style="height:52px; flex:0 0 52px; display:flex; align-items:stretch; border-bottom:1px solid #22262b; background:#0c0e11">
    <div style="width:60px; flex:0 0 60px; display:flex; align-items:center; justify-content:center; border-right:1px solid #22262b">
      <div style="width:14px; height:14px; background:#a8071a"></div>
    </div>
    <div style="display:flex; align-items:center; gap:14px; padding:0 16px; border-right:1px solid #22262b">
      <div style="font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:500; letter-spacing:.02em; color:#9aa2ab">lifeline-hub</div>
      <div style="width:1px; height:18px; background:#22262b"></div>
      <div style="display:flex; align-items:center; gap:8px">
        <div style="width:6px; height:6px; background:#52c41a"></div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:12px; color:#e8ebee">{{ einsatzId }}</div>
        <div style="font-size:13px; font-weight:500; color:#c6ccd2">{{ einsatzName }}</div>
      </div>
    </div>

    <div style="flex:1; display:flex; align-items:center; padding:0 16px">
      <div style="display:flex; align-items:center; gap:10px; width:100%; max-width:520px; height:30px; padding:0 10px; background:#14171b; border:1px solid #2e343a">
        <i class="ti ti-search" style="font-size:15px; color:#5f676f"></i>
        <div style="flex:1; font-size:13px; color:#5f676f">Modul, Einheit, Meldung, Koordinate …</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:11px; color:#5f676f; border:1px solid #2e343a; padding:1px 5px">⌘K</div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:0; border-left:1px solid #22262b">
      <div style="display:flex; align-items:center; gap:7px; padding:0 14px; border-right:1px solid #22262b">
        <i class="ti ti-antenna-bars-5" style="font-size:16px; color:#52c41a"></i>
        <div style="font-family:'JetBrains Mono', monospace; font-size:11px; color:#9aa2ab">SYNC</div>
      </div>
      <div style="padding:0 14px; border-right:1px solid #22262b; font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:500; letter-spacing:.04em">{{ zeit }}</div>
      <div style="display:flex; align-items:center; gap:9px; padding:0 16px 0 14px">
        <div style="width:24px; height:24px; background:#22262b; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; font-size:10px; color:#c6ccd2">RV</div>
        <div style="font-size:12px; color:#9aa2ab">S2 Lage</div>
      </div>
    </div>
  </div>

  <div style="flex:1; display:flex; min-height:0">

    <div style="width:60px; flex:0 0 60px; display:flex; flex-direction:column; border-right:1px solid #22262b; background:#0c0e11">
      <sc-for list="{{ kategorien }}" as="k" hint-placeholder-count="5">
        <div style="position:relative; height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; background: {{ k.bg }}">
          <div style="position:absolute; left:0; top:0; bottom:0; width:2px; background: {{ k.marker }}"></div>
          <i class="{{ k.icon }}" style="font-size:20px; color: {{ k.farbe }}"></i>
          <div style="font-size:9px; letter-spacing:.06em; text-transform:uppercase; color: {{ k.farbe }}">{{ k.label }}</div>
        </div>
      </sc-for>
      <div style="flex:1"></div>
      <div style="height:56px; display:flex; align-items:center; justify-content:center; border-top:1px solid #22262b">
        <i class="ti ti-settings" style="font-size:19px; color:#5f676f"></i>
      </div>
    </div>

    <div style="width:208px; flex:0 0 208px; display:flex; flex-direction:column; border-right:1px solid #22262b; background:#0a0c0e">
      <div style="height:42px; flex:0 0 42px; display:flex; align-items:center; padding:0 14px; border-bottom:1px solid #22262b">
        <div style="font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#5f676f">{{ panelTitel }}</div>
      </div>
      <div style="padding:6px 0; display:flex; flex-direction:column">
        <sc-for list="{{ module }}" as="m" hint-placeholder-count="6">
          <div style="display:flex; align-items:center; gap:10px; height:34px; padding:0 14px; cursor:pointer; background: {{ m.bg }}">
            <div style="width:2px; height:16px; background: {{ m.marker }}"></div>
            <div style="flex:1; font-size:13px; color: {{ m.farbe }}">{{ m.label }}</div>
            <div style="font-family:'JetBrains Mono', monospace; font-size:11px; color: {{ m.zahlFarbe }}">{{ m.zahl }}</div>
          </div>
        </sc-for>
      </div>
      <div style="flex:1"></div>
      <div style="padding:12px 14px; border-top:1px solid #22262b; display:flex; flex-direction:column; gap:6px">
        <div style="font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:#5f676f">Einsatzdauer</div>
        <div style="font-family:'JetBrains Mono', monospace; font-size:18px; font-weight:500; color:#e8ebee">{{ dauer }}</div>
      </div>
    </div>

    <div style="flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden">{{ children }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;aktiv&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fuehrung&quot;,&quot;kraefte&quot;,&quot;erfassung&quot;,&quot;lage&quot;,&quot;komm&quot;],&quot;default&quot;:&quot;lage&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;panelTitel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lage&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;module&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string; zahl?:string; aktiv?:boolean}[]&quot;},&quot;einsatzId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;E-2026-0431&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;einsatzName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hochwasser Weserlauf&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;zeit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;14:22&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dauer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;06:41 h&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const aktiv = this.props.aktiv ?? 'lage';
    const kats = [
      { key: 'fuehrung', icon: 'ti ti-hierarchy-2', label: 'Führung' },
      { key: 'kraefte', icon: 'ti ti-truck', label: 'Kräfte' },
      { key: 'erfassung', icon: 'ti ti-clipboard-text', label: 'Erfassung' },
      { key: 'lage', icon: 'ti ti-map-2', label: 'Lage' },
      { key: 'komm', icon: 'ti ti-message', label: 'Komm.' }
    ];
    return {
      kategorien: kats.map(k => ({
        ...k,
        farbe: k.key === aktiv ? '#e8ebee' : '#5f676f',
        marker: k.key === aktiv ? '#a8071a' : 'transparent',
        bg: k.key === aktiv ? '#16191d' : 'transparent'
      })),
      module: (this.props.module ?? []).map(m => ({
        label: m.label,
        zahl: m.zahl ?? '',
        farbe: m.aktiv ? '#e8ebee' : '#9aa2ab',
        zahlFarbe: m.aktiv ? '#c6ccd2' : '#5f676f',
        marker: m.aktiv ? '#4d94d6' : 'transparent',
        bg: m.aktiv ? '#14171b' : 'transparent'
      })),
      panelTitel: this.props.panelTitel ?? 'Lage',
      einsatzId: this.props.einsatzId ?? 'E-2026-0431',
      einsatzName: this.props.einsatzName ?? 'Hochwasser Weserlauf',
      zeit: this.props.zeit ?? '14:22',
      dauer: this.props.dauer ?? '06:41 h',
      children: this.props.children
    };
  }
}
</script>
</body>
</html>
