# XcodeGen-Projekt der iOS-Hülle (LLH-1978, design.md D1; Regeln: ios/AGENTS.md).
#
# Keine .xcodeproj im Repo: `xcodegen generate --spec ios/project.yml` erzeugt
# ios/LifelineHub.xcodeproj. Vorher schreibt `scripts/ios/version.sh` ios/App/Version.xcconfig
# (Version aus [workspace.package]); ohne die Datei bricht XcodeGen ab. Die XcodeGen-Version ist
# in scripts/ios/xcodegen-installieren.sh gepinnt, den Ablauf in der CI fährt
# scripts/ios/simulator-pruefung.sh (`.github/workflows/ios-pruefung.yml`).
#
# Push über APNs (Entwurf „iOS-Alarme über APNs“): die App trägt Push, Time Sensitive, die App
# Group und den gemeinsamen Schlüsselbund (App/LifelineHub.entitlements); die Notification Service
# Extension `Benachrichtigungsdienst` entschlüsselt die Nutzlast und teilt App Group und
# Schlüsselbund. Code für beide liegt in Gemeinsam/. Signiert wird beides automatisch.
#
# Helfer-App (ADR-0098, Regeln: ios/Helfer/AGENTS.md): eigene native App `LifelineHelfer` mit der
# Widget-Erweiterung `HelferAktivitaet` (Live-Aktivität) und dem Kern `HelferKern`. Ihre Version
# schreibt scripts/ios/helfer-version.sh nach Helfer/App/Version.xcconfig (nicht versioniert).
# XcodeGen braucht beide xcconfig für jedes Schema: vor `xcodegen generate` laufen immer
# scripts/ios/version.sh und scripts/ios/helfer-version.sh (testflight.sh, simulator-pruefung.sh).
name: LifelineHub

options:
  bundleIdPrefix: dev.rubeen.lifeline
  deploymentTarget:
    iOS: "17.4"
  developmentLanguage: de
  createIntermediateGroups: true
  xcodeVersion: "26.6"

settings:
  base:
    DEVELOPMENT_TEAM: H95J852PKP
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # Die Hülle läuft auf iPhone und iPad (1 = iPhone, 2 = iPad).
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  # Testbare Logik ohne UIKit und WebKit, auch unter Linux geprüft (Schritt 18 von check-all.sh).
  LifelineKern:
    path: LifelineKern
  # Kern der Helfer-App, ebenfalls unter Linux geprüft (ios/Helfer/AGENTS.md).
  HelferKern:
    path: HelferKern

targets:
  LifelineHub:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: App
        excludes:
          - "Huelle/**"
          - "Info.plist"
          - "LifelineHub.entitlements"
          - "PrivacyInfo.xcprivacy"
          - "Version.xcconfig"
      # Schlüsselbund, Entschlüsseln und App Group, gemeinsam mit der Extension.
      - path: Gemeinsam
      # Das Init-Skript ist reines JS (Vitest führt es aus, frontend/src/test/huelle.ts); die
      # App liest es als Ressource und spielt es als WKUserScript ein.
      - path: App/Huelle/huelle.js
        buildPhase: resources
      # Vorwärmen der Assets für den Start ohne Server (LLH-1980); Vitest führt es aus
      # (frontend/src/huelle/iosVorwaermen.test.ts), die App per `callAsyncJavaScript`.
      - path: App/Huelle/vorwaermen.js
        buildPhase: resources
      # Sperrt den Standort in Unterframes (LLH-2071); Vitest führt es aus
      # (frontend/src/huelle/iosUnterframe.test.ts), die App als WKUserScript in jedem Frame.
      - path: App/Huelle/unterframe-standort.js
        buildPhase: resources
      # Privacy-Manifest (Required-Reason-APIs) liegt an der Wurzel des App-Bündels.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LifelineKern
      # Wird als App-Erweiterung eingebettet (PlugIns/Benachrichtigungsdienst.appex).
      - target: Benachrichtigungsdienst
    configFiles:
      Debug: App/Version.xcconfig
      Release: App/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.ios
        PRODUCT_NAME: LifelineHub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: App/LifelineHub.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lifeline
        # Aus App/Version.xcconfig (scripts/ios/version.sh); gelesen von LifelineKern.AppVersion.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LifelineVersion: $(LIFELINE_VERSION)
        # Gruppe des gemeinsamen Schlüsselbunds (Gemeinsam/Schluesselbund.swift).
        LifelineSchluesselbundGruppe: $(AppIdentifierPrefix)dev.rubeen.lifeline.ios.gemeinsam
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Die Kamera liest den QR-Code mit der Adresse des Einsatzservers.
        NSLocalNetworkUsageDescription: Lifeline verbindet sich mit dem Einsatzserver im lokalen Netz, etwa mit elw.local.
        # Standort nur im Vordergrund (LLH-2071): kein Always, kein UIBackgroundModes location.
        NSLocationWhenInUseUsageDescription: Lifeline zeigt deinen Standort auf der Lagekarte und übernimmt ihn auf Wunsch in Ortsfelder. Er bleibt auf dem Gerät, bis du ihn selbst speicherst.
        CFBundleURLTypes:
          - CFBundleURLName: dev.rubeen.lifeline.ios
            CFBundleURLSchemes:
              - lifeline
        # Startbildschirm in Kopf-Schwarz (Farbe aus App/Assets.xcassets), ohne Storyboard.
        UILaunchScreen:
          UIColorName: Kopfschwarz
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Notification Service Extension: öffnet die verschlüsselte Nutzlast, bevor iOS die Meldung zeigt.
  Benachrichtigungsdienst:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Benachrichtigungsdienst
        excludes:
          - "Info.plist"
          - "Benachrichtigungsdienst.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: Gemeinsam
      # Liest die Zahl der Server aus der App Group: eigenes Privacy-Manifest im Bündel.
      - path: Benachrichtigungsdienst/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LifelineKern
    # Dieselbe Version wie die App; App Store Connect lehnt eine abweichende ab.
    configFiles:
      Debug: App/Version.xcconfig
      Release: App/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.ios.benachrichtigung
        PRODUCT_NAME: Benachrichtigungsdienst
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Benachrichtigungsdienst/Benachrichtigungsdienst.entitlements
        # Wie in Xcodes Vorlage: nur eingebettet in die App, sonst wird das Archiv „generisch“
        # und lässt sich nicht zu App Store Connect hochladen (TN3110).
        SKIP_INSTALL: "YES"
    info:
      path: Benachrichtigungsdienst/Info.plist
      properties:
        CFBundleDisplayName: Lifeline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LifelineSchluesselbundGruppe: $(AppIdentifierPrefix)dev.rubeen.lifeline.ios.gemeinsam
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Dienst

  # Unit-Tests im Simulator gegen die gebaute App (Info.plist, Ressourcen).
  LifelineHubTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: AppTests
        excludes:
          - "Testserver/**"
      # Wegwerf-Zertifikat des https-Testservers (LLH-1980), erzeugt von
      # scripts/ios/testserver-zertifikat.sh, nie committet.
      - path: AppTests/Testserver/testserver.p12
        buildPhase: resources
        optional: true
    dependencies:
      - target: LifelineHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # UI-Tests im Simulator; legen Bildschirmbilder der nativen Seiten als XCTAttachment ab, die
  # scripts/ios/simulator-pruefung.sh aus dem Ergebnisbündel holt.
  LifelineHubUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: AppUITests
    dependencies:
      - target: LifelineHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"

  # Helfer-App (ADR-0098): SwiftUI, eigene Bundle-ID, nur iPhone. Ortung nur „When in Use“ plus
  # `UIBackgroundModes location`, nie die Always-Freigabe; sichtbar durch Standortanzeige und
  # Live-Aktivität.
  LifelineHelfer:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Helfer/App
        excludes:
          - "Info.plist"
          - "LifelineHelfer.entitlements"
          - "PrivacyInfo.xcprivacy"
          - "Version.xcconfig"
      # Live-Aktivität (Attribute, Pausieren) und Thema, gemeinsam mit der Erweiterung.
      - path: Helfer/Gemeinsam
      - path: Helfer/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      # App-Symbol und Startfarbe aus der Bildmarke (Spec `app-marke`), dieselben wie die Hülle.
      - path: App/Assets.xcassets
    dependencies:
      - package: HelferKern
      - target: HelferAktivitaet
    configFiles:
      Debug: Helfer/App/Version.xcconfig
      Release: Helfer/App/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.helfer
        PRODUCT_NAME: LifelineHelfer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Helfer/App/LifelineHelfer.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Helfer/App/Info.plist
      properties:
        CFBundleDisplayName: Lifeline Helfer
        # Aus Helfer/App/Version.xcconfig (scripts/ios/helfer-version.sh).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Zum Scannen des QR-Codes der Einsatzleitung.
        NSLocalNetworkUsageDescription: Lifeline Helfer verbindet sich mit dem Einsatzserver im lokalen Netz, etwa mit elw.local.
        NSLocationWhenInUseUsageDescription: Lifeline Helfer sendet deine Position an die Einsatzleitung, solange du am Einsatz angemeldet bist.
        # Ortung im Hintergrund nur für eine bestehende Helfer-Kopplung (ADR-0098).
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.rubeen.lifeline.helfer
            CFBundleURLSchemes:
              - lifeline-helfer
        UILaunchScreen:
          UIColorName: Kopfschwarz
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  # Widget-Erweiterung der Helfer-App: nur die Live-Aktivität auf Sperrbildschirm und Dynamic
  # Island, mit „Pausieren“ (LiveActivityIntent, ausgeführt im Prozess der App).
  HelferAktivitaet:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Helfer/Aktivitaet
        excludes:
          - "Info.plist"
          - "HelferAktivitaet.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: Helfer/Gemeinsam
      - path: Helfer/Aktivitaet/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: HelferKern
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    # Dieselbe Version wie die App; App Store Connect lehnt eine abweichende ab.
    configFiles:
      Debug: Helfer/App/Version.xcconfig
      Release: Helfer/App/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.helfer.aktivitaet
        PRODUCT_NAME: HelferAktivitaet
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Helfer/Aktivitaet/HelferAktivitaet.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
    info:
      path: Helfer/Aktivitaet/Info.plist
      properties:
        CFBundleDisplayName: Lifeline Helfer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Unit-Tests der Helfer-App im Simulator (Modell im Testzustand, ohne Netz).
  LifelineHelferTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: HelferTests
    dependencies:
      - target: LifelineHelfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.helfer.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  # UI-Tests der Helfer-App: Smoke-Test und Bildschirmbilder der Seiten (Startargument
  # `-HelferTestzustand <seite>`).
  LifelineHelferUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: HelferUITests
    dependencies:
      - target: LifelineHelfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.helfer.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  LifelineHub:
    build:
      targets:
        LifelineHub: all
    test:
      config: Debug
      targets:
        - LifelineHubTests
        - LifelineHubUITests
        # Der Swift-Kern läuft hier zusätzlich auf iOS (Foundation weicht von Linux ab).
        - package: LifelineKern/LifelineKernTests
  LifelineHelfer:
    build:
      targets:
        LifelineHelfer: all
    test:
      config: Debug
      targets:
        - LifelineHelferTests
        - LifelineHelferUITests
        - package: HelferKern/HelferKernTests
