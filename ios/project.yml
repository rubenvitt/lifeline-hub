# XcodeGen-Projekt der iOS-Hülle (LLH-1978, design.md D1; Regeln: ios/AGENTS.md).
#
# Keine .xcodeproj im Repo: `xcodegen generate --spec ios/project.yml` erzeugt
# ios/LifelineHub.xcodeproj. Vorher schreibt `scripts/ios/version.sh` ios/App/Version.xcconfig
# (Version aus [workspace.package]); ohne die Datei bricht XcodeGen ab. Die XcodeGen-Version ist
# in scripts/ios/xcodegen-installieren.sh gepinnt, den Ablauf in der CI fährt
# scripts/ios/simulator-pruefung.sh (`.github/workflows/ios-pruefung.yml`).
#
# Push über APNs (Entwurf „iOS-Alarme über APNs“): die App trägt Push, Time Sensitive, die App
# Group und den gemeinsamen Schlüsselbund (App/LifelineHub.entitlements); die Notification Service
# Extension `Benachrichtigungsdienst` entschlüsselt die Nutzlast und teilt App Group und
# Schlüsselbund. Code für beide liegt in Gemeinsam/. Signiert wird beides automatisch.
name: LifelineHub

options:
  bundleIdPrefix: dev.rubeen.lifeline
  deploymentTarget:
    iOS: "17.4"
  developmentLanguage: de
  createIntermediateGroups: true
  xcodeVersion: "26.6"

settings:
  base:
    DEVELOPMENT_TEAM: H95J852PKP
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # Die Hülle läuft auf iPhone und iPad (1 = iPhone, 2 = iPad).
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  # Testbare Logik ohne UIKit und WebKit, auch unter Linux geprüft (Schritt 18 von check-all.sh).
  LifelineKern:
    path: LifelineKern

targets:
  LifelineHub:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: App
        excludes:
          - "Huelle/**"
          - "Info.plist"
          - "LifelineHub.entitlements"
          - "PrivacyInfo.xcprivacy"
          - "Version.xcconfig"
      # Schlüsselbund, Entschlüsseln und App Group, gemeinsam mit der Extension.
      - path: Gemeinsam
      # Das Init-Skript ist reines JS (Vitest führt es aus, frontend/src/test/huelle.ts); die
      # App liest es als Ressource und spielt es als WKUserScript ein.
      - path: App/Huelle/huelle.js
        buildPhase: resources
      # Vorwärmen der Assets für den Start ohne Server (LLH-1980); Vitest führt es aus
      # (frontend/src/huelle/iosVorwaermen.test.ts), die App per `callAsyncJavaScript`.
      - path: App/Huelle/vorwaermen.js
        buildPhase: resources
      # Privacy-Manifest (Required-Reason-APIs) liegt an der Wurzel des App-Bündels.
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LifelineKern
      # Wird als App-Erweiterung eingebettet (PlugIns/Benachrichtigungsdienst.appex).
      - target: Benachrichtigungsdienst
    configFiles:
      Debug: App/Version.xcconfig
      Release: App/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.ios
        PRODUCT_NAME: LifelineHub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: App/LifelineHub.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lifeline
        # Aus App/Version.xcconfig (scripts/ios/version.sh); gelesen von LifelineKern.AppVersion.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LifelineVersion: $(LIFELINE_VERSION)
        # Gruppe des gemeinsamen Schlüsselbunds (Gemeinsam/Schluesselbund.swift).
        LifelineSchluesselbundGruppe: $(AppIdentifierPrefix)dev.rubeen.lifeline.ios.gemeinsam
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Die Kamera liest den QR-Code mit der Adresse des Einsatzservers.
        NSLocalNetworkUsageDescription: Lifeline verbindet sich mit dem Einsatzserver im lokalen Netz, etwa mit elw.local.
        CFBundleURLTypes:
          - CFBundleURLName: dev.rubeen.lifeline.ios
            CFBundleURLSchemes:
              - lifeline
        # Startbildschirm in Kopf-Schwarz (Farbe aus App/Assets.xcassets), ohne Storyboard.
        UILaunchScreen:
          UIColorName: Kopfschwarz
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Notification Service Extension: öffnet die verschlüsselte Nutzlast, bevor iOS die Meldung zeigt.
  Benachrichtigungsdienst:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Benachrichtigungsdienst
        excludes:
          - "Info.plist"
          - "Benachrichtigungsdienst.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: Gemeinsam
      # Liest die Zahl der Server aus der App Group: eigenes Privacy-Manifest im Bündel.
      - path: Benachrichtigungsdienst/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LifelineKern
    # Dieselbe Version wie die App; App Store Connect lehnt eine abweichende ab.
    configFiles:
      Debug: App/Version.xcconfig
      Release: App/Version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.ios.benachrichtigung
        PRODUCT_NAME: Benachrichtigungsdienst
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Benachrichtigungsdienst/Benachrichtigungsdienst.entitlements
        # Wie in Xcodes Vorlage: nur eingebettet in die App, sonst wird das Archiv „generisch“
        # und lässt sich nicht zu App Store Connect hochladen (TN3110).
        SKIP_INSTALL: "YES"
    info:
      path: Benachrichtigungsdienst/Info.plist
      properties:
        CFBundleDisplayName: Lifeline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LifelineSchluesselbundGruppe: $(AppIdentifierPrefix)dev.rubeen.lifeline.ios.gemeinsam
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Dienst

  # Unit-Tests im Simulator gegen die gebaute App (Info.plist, Ressourcen).
  LifelineHubTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: AppTests
        excludes:
          - "Testserver/**"
      # Wegwerf-Zertifikat des https-Testservers (LLH-1980), erzeugt von
      # scripts/ios/testserver-zertifikat.sh, nie committet.
      - path: AppTests/Testserver/testserver.p12
        buildPhase: resources
        optional: true
    dependencies:
      - target: LifelineHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

  # UI-Tests im Simulator; legen Bildschirmbilder der nativen Seiten als XCTAttachment ab, die
  # scripts/ios/simulator-pruefung.sh aus dem Ergebnisbündel holt.
  LifelineHubUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: AppUITests
    dependencies:
      - target: LifelineHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lifeline.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  LifelineHub:
    build:
      targets:
        LifelineHub: all
    test:
      config: Debug
      targets:
        - LifelineHubTests
        - LifelineHubUITests
        # Der Swift-Kern läuft hier zusätzlich auf iOS (Foundation weicht von Linux ab).
        - package: LifelineKern/LifelineKernTests
