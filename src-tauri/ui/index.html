<!doctype html>
<!--
  Erststart-Maske der Desktop-Hülle (LFH-721, desktop-huelle), seit LLH-1282 mit der Auswahl der
  zuletzt verbundenen Server. Neben der Anzeige „nicht erreichbar“ die einzige lokale Seite der
  Hülle; alles andere lädt vom Einsatzserver. Gestaltung in stil.css. Die Adresse prüft die Hülle
  (src-tauri/src/adresse.rs) — hier steht keine zweite Prüflogik, die Maske zeigt nur deren Meldung.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lifeline Hub – Server verbinden</title>
    <link rel="stylesheet" href="stil.css" />
    <script src="maske.js" defer></script>
  </head>
  <body>
    <form id="maske" novalidate>
      <p class="augenbraue">Lifeline Hub</p>
      <h1>Mit Einsatzserver verbinden</h1>
      <p>
        Adresse des Lifeline-Hub-Servers Ihrer Einsatzorganisation, zum Beispiel
        <code>https://elw.local:8443</code>. Sie steht auch im Link aus „Geräte verbinden“.
      </p>
      <ul id="bekannt" aria-label="Bekannte Server" hidden></ul>
      <label for="adresse">Serveradresse</label>
      <input
        id="adresse"
        name="adresse"
        type="url"
        inputmode="url"
        autocomplete="url"
        spellcheck="false"
        placeholder="https://"
        aria-describedby="fehler"
        required
      />
      <p id="fehler" role="alert"></p>
      <div class="aktionen">
        <button type="submit" id="verbinden">Verbinden</button>
        <button type="button" id="abbrechen" class="sekundaer" hidden>Abbrechen</button>
      </div>
    </form>
  </body>
</html>
