# Desktop-Hülle (LFH-721, Variante A aus LFH-720): der Webview lädt die https-Adresse des
# Servers. Die Hülle trägt Fenster, Erststart, Deeplink, Druck-Umleitung und Update — keine
# zweite Anwendungslogik. Anforderungen: openspec/specs/desktop-huelle/spec.md.
#
# Die Version erbt die Hülle aus [workspace.package] der Wurzel — dieselbe wie der Server;
# semantic-release setzt sie dort (release.config.mjs). tauri.conf.json trägt bewusst keine.
[package]
name = "lifeline-desktop"
version.workspace = true
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# Fremde Links und `mailto:`/`tel:` ans System (LFH-782). Nur die Rust-Funktion, kein Plugin im
# Builder: die Seite bekommt keinen eigenen Weg zum Öffnen.
tauri-plugin-opener = "2"
# Protokoll ins Log-Verzeichnis der App (macOS ~/Library/Logs/<id>, Windows %LOCALAPPDATA%\<id>\logs):
# eine installierte Hülle hat keine Konsole.
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"
# PKCE der Anmeldung im Systembrowser (LFH-818): verifier aus dem OS-Zufall, challenge per SHA-256.
getrandom = "0.3"
sha2 = "0.11"
base64 = "0.22"

# ASWebAuthenticationSession für „Im Browser anmelden“ (LFH-818), nur macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSError"] }
objc2-authentication-services = { version = "0.3", features = ["ASWebAuthenticationSession", "ASFoundation", "block2"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
