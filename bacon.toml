# bacon.toml — Dev-Auto-Reload für das Backend (baut neu und startet den Server neu).
#
#   bacon                  # default_job „serve" (lifeline-hub-Backend)
#   bacon karten-service   # karten-service mit Auto-Reload
#
# Das Frontend braucht das nicht (Vite hat eigenes HMR). Installation: cargo install bacon --locked

default_job = "serve"

# sqlx::migrate! bettet migrations/ zur Compile-Zeit ein, deshalb mitüberwachen.
[jobs.serve]
command = ["cargo", "run", "--features", "dev-seeds"]
watch = ["migrations"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
# Beendet das Server-Binary (Kind von cargo) vor dem Neustart; bacon hängt die cargo-PID an.
kill = ["pkill", "-TERM", "-P"]

# Braucht die KS_*/AWS_*-Envs (aus der .env via mise) und einen laufenden Object-Store
# (`mise run garage`).
[jobs.karten-service]
command = ["cargo", "run", "-p", "karten-service", "--", "serve"]
# Nur das Service-Crate beobachten, sonst startete jede Backend-Änderung den Service neu.
default_watch = false
watch = ["karten-service/src", "karten-service/Cargo.toml"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
kill = ["pkill", "-TERM", "-P"]
