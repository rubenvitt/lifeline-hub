<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0c0e11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lifeline-hub</title>
    <!-- Theme synchron vor dem React-Mount setzen, sonst blitzt beim Laden das
         falsche Farbschema auf (FOUC). Logik gespiegelt aus ThemeModeProvider:
         ohne gespeicherte Wahl gilt der Nachtbetrieb (Neuentwurf, 21.09.2026). -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('lifeline-hub.theme');
          if (m !== 'system' && m !== 'light' && m !== 'dark') m = 'dark';
          var dunkel =
            m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dunkel ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage gesperrt o. Ä. – Nachtbetrieb als Vorgabe, der Provider
             bestätigt das Theme nach dem Mount. */
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <!-- Helligkeit synchron vor dem React-Mount setzen (LFH-397), sonst blitzt der
         abgedunkelte Fükw beim Laden auf voller Helligkeit auf. Gespiegelt aus
         `theme/helligkeit.ts` + ThemeModeProvider (Pin: `helligkeit.test.ts`). Eine
         Warnsperre kennt dieses Skript nicht — die setzt der Provider nach dem Mount. -->
    <script>
      (function () {
        try {
          var stufen = ['100', '80', '60', '40', '20'];
          var h = localStorage.getItem('lifeline-hub.helligkeit');
          if (stufen.indexOf(h) === -1) h = '100';
          document.documentElement.dataset.helligkeit = h;
          document.documentElement.style.setProperty(
            '--lfh-abdunkelung',
            String((100 - Number(h)) / 100),
          );
        } catch (e) {
          /* localStorage gesperrt o. Ä. – keine Abdunklung, der Provider übernimmt. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
