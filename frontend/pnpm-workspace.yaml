allowBuilds:
  esbuild: true
  msw: true

# Transitive Advisory-Fixes, die die Abhängigkeitskette selbst nicht hergibt.
# Ab pnpm 10 werden Overrides hier gelesen, NICHT mehr aus package.json ("pnpm"-Feld
# wird ignoriert — pnpm warnt darüber nur, es bricht nicht).
overrides:
  # GHSA-52cp-r559-cp3m (high): quadratische CPU über YAML-Merge-Key-Ketten.
  # @redocly/openapi-core pinnt js-yaml exakt auf 4.2.0, openapi-typescript ist bereits
  # die neueste Version (7.13.0) — es gibt keinen Upgrade-Pfad über die Kette. 4.3.0 ist
  # ein Minor-Sprung; verifiziert durch check-typ-codegen.sh, das genau diese Toolchain
  # fährt (openapi.json → types.generated.ts).
  # Bewusst `^4.3.0` und nicht `>=4.3.0`: letzteres zog js-yaml 5.2.1 herein — einen
  # Major-Sprung mit Breaking Changes in eine Abhängigkeit, die wir gar nicht selbst rufen.
  js-yaml@>=4.0.0 <4.3.0: ^4.3.0

  # GHSA-4c8g-83qw-93j6 + GHSA-v2hh-gcrm-f6hx (beide high): Host-Confusion in der
  # URI-Zerlegung (fehlgeschlagene IDN-Kanonisierung bzw. literaler Backslash als
  # Authority-Trenner). Kette: vite-plugin-pwa → workbox-build → ajv (bzw.
  # @apideck/better-ajv-errors → ajv) → fast-uri; workbox-build pinnt ajv, das
  # seinerseits fast-uri ^3.0.0 zieht — die Kette gibt den Fix nicht her.
  # Wieder `^3.1.4` statt `>=3.1.4` (siehe js-yaml oben): kein Major-Sprung in eine
  # Abhängigkeit, die wir nicht selbst rufen. Reines Build-Zeit-Tooling (PWA-Manifest),
  # kein Laufzeit-Code im Bundle.
  fast-uri@>=3.0.0 <3.1.4: ^3.1.4
