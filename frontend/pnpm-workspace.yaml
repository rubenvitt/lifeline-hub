allowBuilds:
  esbuild: true
  msw: true

# Transitive Advisory-Fixes mit erzwungenen sicheren Mindestversionen.
# Ab pnpm 10 werden Overrides hier gelesen, NICHT mehr aus package.json ("pnpm"-Feld
# wird ignoriert — pnpm warnt darüber nur, es bricht nicht).
overrides:
  # GHSA-5p4m-2wfm-xmqj (high): quadratische CPU bei !!omap-Auflösung.
  # @redocly/openapi-core pinnt js-yaml exakt auf 4.2.0, openapi-typescript ist bereits
  # die neueste Version (7.13.0) — es gibt keinen Upgrade-Pfad über die Kette. 4.3.1 ist
  # ein Same-Major-Update (Minor+Patch); verifiziert durch check-typ-codegen.sh, das
  # diese Toolchain fährt (openapi.json → types.generated.ts).
  # Bewusst `^4.3.1` und nicht `>=4.3.1`: letzteres zog js-yaml 5.2.1 herein — einen
  # Major-Sprung mit Breaking Changes in eine Abhängigkeit, die wir gar nicht selbst rufen.
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1

  # GHSA-7p8r-x3mc-p8w7 (high): Host-Confusion über einen Backslash als Authority-Trenner.
  # Kette: vite-plugin-pwa → workbox-build → ajv (bzw.
  # @apideck/better-ajv-errors → ajv) → fast-uri. AJV fordert für fast-uri ^3.0.1
  # und lässt den Fix damit zu; der Lockfile löste jedoch noch 3.1.4. Der Override
  # erzwingt die sichere Mindestversion.
  # Wieder `^3.1.5` statt `>=3.1.5` (siehe js-yaml oben): kein Major-Sprung in eine
  # Abhängigkeit, die wir nicht selbst rufen. Reines Build-Zeit-Tooling (PWA-Manifest),
  # kein Laufzeit-Code im Bundle; der Frontend-Produktionsbuild und check-all.sh prüfen es.
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5

  # GHSA-rgw5-rvv9-x895 (high): DoS durch unbeschränkte Zwischenarrays bei Brace-Mustern.
  # Ketten: openapi-typescript → @redocly/openapi-core → minimatch@5 sowie vite-plugin-pwa →
  # workbox-build → rollup-plugin-off-main-thread → ejs → jake → filelist →
  # minimatch@5 → brace-expansion@2.
  # Der Backport ^2.1.4 bleibt im konsumierten Major und wird durch check-typ-codegen.sh
  # sowie check-all.sh geprüft.
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4

  # GHSA-rgw5-rvv9-x895 (high): dieselbe DoS-Lücke in der 5.x-Linie.
  # Ketten: @eslint/js → eslint → @eslint/config-array → minimatch sowie vite-plugin-pwa →
  # workbox-build → glob → minimatch@10 → brace-expansion@5. ^5.0.9 ist ein
  # Same-Major-Patch und wird durch den Frontend-Produktionsbuild sowie check-all.sh geprüft.
  brace-expansion@>=5.0.0 <5.0.9: ^5.0.9
