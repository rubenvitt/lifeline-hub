allowBuilds:
  esbuild: true
  msw: true

# Transitive Advisory-Fixes mit erzwungenen sicheren Mindestversionen.
# Ab pnpm 10 werden Overrides hier gelesen, NICHT mehr aus package.json ("pnpm"-Feld
# wird ignoriert — pnpm warnt darüber nur, es bricht nicht).
overrides:
  # GHSA-5p4m-2wfm-xmqj (high): quadratische CPU bei !!omap-Auflösung.
  # @redocly/openapi-core pinnt js-yaml exakt auf 4.2.0, openapi-typescript ist bereits
  # die neueste Version (7.13.0) — es gibt keinen Upgrade-Pfad über die Kette. 4.3.1 ist
  # ein Same-Major-Update (Minor+Patch); verifiziert durch check-typ-codegen.sh, das
  # diese Toolchain fährt (openapi.json → types.generated.ts).
  # Bewusst `^4.3.1` und nicht `>=4.3.1`: letzteres zog js-yaml 5.2.1 herein — einen
  # Major-Sprung mit Breaking Changes in eine Abhängigkeit, die wir gar nicht selbst rufen.
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1

  # GHSA-7p8r-x3mc-p8w7 (high): Host-Confusion über einen Backslash als Authority-Trenner.
  # Kette: vite-plugin-pwa → workbox-build → ajv (bzw.
  # @apideck/better-ajv-errors → ajv) → fast-uri. AJV fordert für fast-uri ^3.0.1
  # und lässt den Fix damit zu; der Lockfile löste jedoch noch 3.1.4. Der Override
  # erzwingt die sichere Mindestversion.
  # Wieder `^3.1.5` statt `>=3.1.5` (siehe js-yaml oben): kein Major-Sprung in eine
  # Abhängigkeit, die wir nicht selbst rufen. Reines Build-Zeit-Tooling (PWA-Manifest),
  # kein Laufzeit-Code im Bundle; der Frontend-Produktionsbuild und check-all.sh prüfen es.
  #
  # NACHGEZOGEN 2026-09-03: DASSELBE MUSTER WIE BEI nanoid UNTEN — das Advisory ist
  # gewandert, der Override nicht. Aus einem Fund (GHSA-7p8r-x3mc-p8w7) sind VIER
  # geworden (zusätzlich GHSA-jqff-g426-hqxp u. a., Host-Confusion über übersprungene
  # IDN-Normalisierung sowie SSRF), und die Schwelle steht jetzt bei 3.1.6. Der Override
  # hob weiterhin korrekt auf 3.1.5 — nur reichte das Ziel nicht mehr, und `pnpm audit`
  # brach Schritt 6. BEIDE Grenzen sind nachgezogen: die Obergrenze des Bereichs UND die
  # Zielversion. ^3.1.6 bleibt ein Same-Major-Patch.
  fast-uri@>=3.0.0 <3.1.6: ^3.1.6

  # GHSA-c83g-rgw3-j3cx (high): unbegrenztes Cache-Wachstum ohne Eviction (OOM), sowie
  # ein zweiter Fund derselben Version (Crash/Prototype-Write über eine untrusted
  # `browserslist-stats.json`). Beide gepatcht ab 4.28.7, der Lockfile stand auf 4.28.4.
  # Ketten: eslint-plugin-react-hooks → @babel/core → @babel/helper-compilation-targets →
  # browserslist, dazu vite-plugin-pwa → workbox-build → @babel/core bzw.
  # @babel/preset-env (gemeldet über 100 Pfade, alle über @babel).
  # Reines Build-Zeit-Tooling — browserslist beantwortet beim Bundeln die Zielbrowser-
  # Frage und liegt nicht im ausgelieferten Bündel. Wir rufen es nirgends selbst; kein
  # Direktabhängiger führt es, ein Bump ohne Override gibt es also nicht.
  # ^4.28.7 bleibt ein Same-Major-Patch; verifiziert durch den Frontend-Produktionsbuild
  # und check-all.sh.
  browserslist@>=4.0.0 <4.28.7: ^4.28.7

  # GHSA-rgw5-rvv9-x895 (high): DoS durch unbeschränkte Zwischenarrays bei Brace-Mustern.
  # Ketten: openapi-typescript → @redocly/openapi-core → minimatch@5 sowie vite-plugin-pwa →
  # workbox-build → rollup-plugin-off-main-thread → ejs → jake → filelist →
  # minimatch@5 → brace-expansion@2.
  # Der Backport ^2.1.4 bleibt im konsumierten Major und wird durch check-typ-codegen.sh
  # sowie check-all.sh geprüft.
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4

  # GHSA-rgw5-rvv9-x895 (high): dieselbe DoS-Lücke in der 5.x-Linie.
  # Ketten: @eslint/js → eslint → @eslint/config-array → minimatch sowie vite-plugin-pwa →
  # workbox-build → glob → minimatch@10 → brace-expansion@5. ^5.0.9 ist ein
  # Same-Major-Patch und wird durch den Frontend-Produktionsbuild sowie check-all.sh geprüft.
  brace-expansion@>=5.0.0 <5.0.9: ^5.0.9

  # GHSA-2v37-7h3g-55p8 (high): custom-Generatoren von nanoid loopen unbegrenzt bei size 0.
  # Kette: postcss → nanoid, postcss selbst über vite (@vitejs/plugin-react,
  # @vitest/mocker/vitest, vite-plugin-pwa). Reines Build-/Test-Zeit-Tooling (PostCSS läuft
  # nur beim Bundeln bzw. unter Vitest), kein Laufzeit-Code im ausgelieferten Binary — Fund
  # 2026-08-08 beim LFH-336-Gate-Lauf, unabhängig vom Ticket.
  #
  # NACHGEZOGEN 2026-08-17 (LFH-339-Gate-Lauf): DAS ADVISORY WURDE VERSCHÄRFT. Beim ersten
  # Fix galt 3.3.17 als gepatcht; inzwischen nennt GHSA-2v37-7h3g-55p8 „<3.3.18" als
  # verwundbar. Der Override griff weiterhin korrekt und hob auf 3.3.17 — nur reichte diese
  # Zielversion nicht mehr, und `pnpm audit` brach Schritt 6 des Gates. Das ist die Sorte
  # Bestandsbefund, die ohne eigenes Zutun rot wird: ein Override pinnt eine Zahl, das
  # Advisory bewegt sich darunter weg. Wer hier etwas ändert, prüft BEIDE Grenzen — die
  # Untergrenze des Bereichs UND die Zielversion.
  #
  # ^3.3.18 bleibt ein Same-Major-Patch; verifiziert durch den Frontend-Produktionsbuild und
  # die Vitest-Suite in check-all.sh.
  nanoid@>=3.0.0 <3.3.18: ^3.3.18
